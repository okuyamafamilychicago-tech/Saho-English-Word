  /* ===== 850-14 ===== */
  {
    title: "World&rsquo;s Best Skateboarder",
    titleJa: "世界最高のスケートボーダー",
    source: "Lexile 850–900 / ノンフィクション（伝記・スポーツ）",
    photo: "https://upload.wikimedia.org/wikipedia/commons/d/d4/Tony_Hawk_ollie.jpg",
    photoAlt: "ミニランプでオーリーをするトニー・ホーク",
    photoCap: "ミニランプでオーリーを決めるトニー・ホーク（1987年）。",
    photoCredit: "写真: Archeo3（CC BY-SA 3.0 / Wikimedia Commons）",
    paras: [
      { en:`<mark data-q="1 5">Many people think that Tony Hawk is the best skateboarder ever.</mark>`,
        ja:`多くの人が、トニー・ホークは史上最高のスケートボーダーだと考えています。` },
      { en:`Tony was born in 1968 and he grew up in San Diego, California. His father was a pilot in the Navy and his mother was a teacher. Tony was a wild child. In talking about his early years, Tony has said, &ldquo;I was the terrible youth.&rdquo; Tony was very smart, but he was also restless. He had lots of energy and no idea what to do with it. However, that all changed on his ninth birthday when his brother gave him his first skateboard.`,
        ja:`トニーは1968年に生まれ、カリフォルニア州サンディエゴで育ちました。父は海軍のパイロット、母は教師でした。トニーはやんちゃな子どもでした。子どものころについて、トニー自身が「自分はひどい若者だった」と語っています。トニーはとてもかしこかったのですが、じっとしていられませんでした。ありあまるエネルギーを持て余し、それをどう使えばいいのか分からなかったのです。しかし9歳の誕生日に、兄が最初のスケートボードをくれたことで、すべてが変わりました。` },
      { en:`Tony took to skateboarding right from the start. There were very few skate parks at that time, so his dad built him a ramp in the backyard. He could then practice at home. He would be on the board for hours and hours. If he was not at school, he was skating. He soon became too good for the backyard ramp and began to practice at skate parks around San Diego.`,
        ja:`トニーは最初からスケートボードに夢中になりました。当時はスケートパークがほとんどなかったので、父が裏庭にランプ（傾斜台）を作ってくれました。それで家でも練習できるようになったのです。彼は何時間も何時間もボードに乗っていました。学校にいないときは、スケートをしていました。まもなく裏庭のランプでは物足りなくなり、サンディエゴ周辺のスケートパークで練習を始めました。` },
      { en:`Best of all for his parents, Tony had found a place to direct all of his energy. He left behind the troublemaking and focused all his time and effort into skating.`,
        ja:`両親にとって何よりよかったのは、トニーがありあまるエネルギーを向ける先を見つけたことでした。彼はいたずらをやめ、時間と力のすべてをスケートに注ぎました。` },
      { en:`Tony&rsquo;s talent was obvious. He began to master difficult moves very quickly. His dad was very supportive of Tony and drove him to skating contests all over California. In time, he realized there were not enough high-level contests and sponsors. Because of this, Tony&rsquo;s father started two skating groups. One group was the National Skateboarding Association, which was the first professional organization of its kind. It ran many skating contests.`,
        ja:`トニーの才能は、だれの目にも明らかでした。彼はむずかしい技をとても早く身につけていきました。父はトニーをよく応援し、カリフォルニア中の大会に車で連れていきました。やがて父は、高いレベルの大会もスポンサーも足りないことに気づきました。そこでトニーの父は、2つのスケート団体を立ち上げました。その一つが全米スケートボード協会で、この種のものとしては初のプロ組織でした。この協会は多くの大会を運営しました。` },
      { en:`At the young age of 12, Tony gained his first sponsor, a skateboard company. The sponsor gave Tony free boards to use. At age 14, he became a professional skateboarder and started making money from skating. People began calling him the &ldquo;Birdman&rdquo; because when he rode his skateboard, tall, thin Tony looked as if he were a bird flying high in the air.`,
        ja:`わずか12歳で、トニーは最初のスポンサー（スケートボード会社）を得ました。スポンサーはトニーに無料でボードを提供しました。14歳でプロのスケートボーダーになり、スケートでお金をかせぎ始めました。人々は彼を「バードマン（鳥人間）」とよぶようになりました。背が高くやせたトニーがボードに乗ると、まるで空高く飛ぶ鳥のように見えたからです。` },
      { en:`There are two main kinds of skateboarding: street and vert. Street skaters skate on anything that they can find, including sidewalks, curbs, railings, and stairs. These skaters use the world as their skate park. Vert skaters use specially made ramps so they can get high in the air to do tricks. Vert is a way of saying &ldquo;vertical,&rdquo; which means &ldquo;straight up.&rdquo; Street and vert skating are both exciting, but vert skating allows for bigger tricks. Some vert tricks involve spinning around in circles on a board and then landing. For example, a &ldquo;360&rdquo; is a trick in which the skater spins around one full turn in the air. Tony was a very good street skater, but he was even better at vert skating.`,
        ja:`スケートボードには大きく2種類あります。ストリートとバートです。ストリートのスケーターは、歩道、縁石、手すり、階段など、見つけたものなら何でも使ってすべります。世界そのものをスケートパークにしてしまうのです。バートのスケーターは、特別に作られたランプを使い、空中高く上がって技を決めます。バートは「バーティカル（vertical＝垂直）」を短くした言い方で、「まっすぐ上へ」という意味です。ストリートもバートもわくわくしますが、バートのほうが大きな技ができます。バートの技には、ボードの上でぐるぐる回ってから着地するものがあります。たとえば「360」は、空中で1回転する技です。トニーはストリートもとても上手でしたが、バートはさらに得意でした。` },
      { en:`Tony learned the tricks in vert skating quickly. He was very good at a trick called the &ldquo;Ollie.&rdquo; The Ollie is one of the most basic but famous skateboarding tricks. During this trick, the skater and the board both fly into the air, but the skater&rsquo;s feet never leave the board. A skater needs to be able to master an Ollie first before moving on to the harder tricks. Tony managed that quickly.`,
        ja:`トニーはバートの技をすばやく覚えました。「オーリー」とよばれる技がとても得意でした。オーリーは、もっとも基本的でありながら有名な技の一つです。この技では、スケーターとボードの両方が空中に飛び上がりますが、足はボードからはなれません。スケーターは、もっとむずかしい技に進む前に、まずオーリーを身につける必要があります。トニーはそれをすぐにやりとげました。` },
      { en:`By the time he was 16, Tony was the best skater in the world. By the time he was 19, he had won 20 professional skating events and he was earning more than $100,000 a year. He earned money by winning skating contests, and from sponsors who paid him to use their products. He had turned skating into a professional career. Tony owned his own house before he was 20 years old.`,
        ja:`16歳になるころには、トニーは世界一のスケーターでした。19歳になるころには、プロの大会で20回優勝し、年に10万ドル以上をかせいでいました。大会での優勝と、自社製品を使ってもらうためにお金を払うスポンサーから収入を得ていたのです。彼はスケートを職業に変えました。20歳になる前に、自分の家を持っていました。` },
      { en:`By the end of the 1980s, skateboarding was very popular. Tony and other skaters made videos that sold many thousands of copies. Skating contests attracted huge crowds and several skate parks opened in cities and towns. Tony was the sport&rsquo;s king. He won contests all the time, he earned big money, and fans from around the world knew who he was.`,
        ja:`1980年代の終わりごろには、スケートボードはとても人気がありました。トニーやほかのスケーターが作ったビデオは、何千本も売れました。大会には大観衆がつめかけ、街や町にいくつものスケートパークができました。トニーはこの競技の王様でした。いつも大会で優勝し、大金をかせぎ、世界中のファンが彼を知っていました。` },
      { en:`Then it all came crashing down.`,
        ja:`ところが、そのすべてが音を立ててくずれ落ちました。` },
      { en:`In the 1990s, skateboarding became less and less popular. <mark data-q="2">One reason why skateboarding became less popular is that it is a very risky sport.</mark> The skaters can get hurt. Most of the time they get cuts and scrapes that are not too serious, but sometimes they break bones. <mark data-q="2">Because skating is such a risky sport, the skate parks needed to have insurance.</mark> The parks had to pay money to insurance companies in case a skater was injured. If the number of skaters increased, then the insurance costs increased. <mark data-q="2">High insurance costs forced many skate parks to close, so skaters did not have a place to enjoy their sport.</mark> Skateboarding contests also needed insurance. Many of the contests were canceled when the insurance costs rose too high.`,
        ja:`1990年代に入ると、スケートボードの人気はどんどん落ちていきました。人気が落ちた理由の一つは、これがとても危険なスポーツだということです。スケーターはけがをすることがあります。たいていは、それほど重くない切り傷やすり傷ですが、骨を折ることもあります。とても危険なスポーツなので、スケートパークは保険に入る必要がありました。パークは、スケーターがけがをした場合にそなえて、保険会社にお金を払わなければなりませんでした。スケーターの数がふえれば、保険の費用も上がります。高い保険料のせいで多くのスケートパークが閉鎖に追いこまれ、スケーターは自分のスポーツを楽しむ場所を失いました。大会にも保険が必要でした。保険料が上がりすぎて、多くの大会が中止になりました。` },
      { en:`Tony was worried. There were fewer contests to enter and win. There were no more sponsors paying him to use their products. He was earning less money. By then, Tony was married and had a child. His wife was working, but she was not making as much money as he had been earning when skateboarding was very popular. Tony thought about getting a regular job. He liked computers. He thought he would get a job where he could work with computers, but he decided he could not give up skateboarding. He loved the sport too much to leave it.`,
        ja:`トニーは不安でした。出場して勝てる大会が減りました。製品を使ってもらうためにお金を払うスポンサーもいなくなりました。収入は減っていきました。そのころ、トニーは結婚して子どももいました。妻は働いていましたが、スケートボードが大人気だったころに彼がかせいでいたほどの収入ではありませんでした。トニーはふつうの仕事につくことも考えました。彼はコンピューターが好きでした。コンピューターを使う仕事につこうかとも思いましたが、スケートボードをあきらめることはできないと決めました。このスポーツを愛しすぎていて、はなれられなかったのです。` },
      { en:`<mark data-q="3">In 1990, instead of giving up his career in skateboarding, Tony dove in. He started a skate company called Birdhouse Projects that made skateboards and other skating equipment.</mark> At first, Birdhouse Projects did not do well. Tony had to sell his house to get the money to keep his business open. Sales were not great, but Tony kept hoping. Skateboarding had been good to him up to now, and he hoped it would be good to him again.`,
        ja:`1990年、トニーはスケートボードの道をあきらめるかわりに、さらに深く飛びこみました。バードハウス・プロジェクツというスケート会社を立ち上げ、スケートボードやその他の用具を作ったのです。はじめ、バードハウス・プロジェクツはうまくいきませんでした。トニーは事業を続ける資金を得るために、自分の家を売らなければなりませんでした。売り上げはよくありませんでしたが、トニーは希望を持ちつづけました。スケートボードはこれまで自分によくしてくれた、きっとまたよくしてくれる、と願ったのです。` },
      { en:`<mark data-q="4">By 1995, Birdhouse Projects was doing better because a new kind of sports contest had started, called the &ldquo;Extreme Games.&rdquo;</mark> These Extreme Games, or &ldquo;X Games,&rdquo; include competitions in daring sports such as skateboarding, BMX biking, and motocross. <mark data-q="4">The people who started the X Games asked Tony to compete in them. He won second place in street skating and first place in vert skating. The X Games were on TV, and millions of people saw Tony skating and winning. They saw that skateboarding was exciting. Once again, the sport became popular. Once again, Tony was its king.</mark>`,
        ja:`1995年までに、バードハウス・プロジェクツの状況はよくなりました。「エクストリーム・ゲームズ」という新しい種類のスポーツ大会が始まったからです。このエクストリーム・ゲームズ、つまり「Xゲームズ」には、スケートボード、BMX、モトクロスといった大胆なスポーツの競技があります。Xゲームズを始めた人たちは、トニーに出場を依頼しました。彼はストリートで2位、バートで1位になりました。Xゲームズはテレビで放送され、何百万もの人がトニーのすべりと勝利を見ました。人々はスケートボードがわくわくするものだと知ったのです。ふたたび、このスポーツは人気になりました。ふたたび、トニーはその王様になりました。` },
      { en:`Tony did well. He gained many new sponsors and won almost every contest he entered. He also hosted TV shows about skateboarding. Tony traveled around the world to show people his amazing skating tricks. In every country he visited, skaters knew about Tony and came to see him skate. He was unbeatable in the X Games.`,
        ja:`トニーは大活躍しました。多くの新しいスポンサーがつき、出場したほとんどすべての大会で優勝しました。スケートボードのテレビ番組の司会もつとめました。トニーは世界中をまわり、すばらしい技を人々に見せました。おとずれたどの国でも、スケーターたちはトニーを知っていて、そのすべりを見にきました。彼はXゲームズで無敵でした。` },
      { en:`When it was time for the 1999 X Games, Tony was ready. He could do almost every skateboarding trick better than the other skaters. Yet one trick was so difficult that even Tony could not do it. The trick was called the &ldquo;900.&rdquo; A 900 is two and a half spins around on the skateboard, all while in the air. No other skater had ever landed the trick. Tony wanted to be the first.`,
        ja:`1999年のXゲームズのとき、トニーは準備ができていました。ほとんどすべての技を、ほかのだれよりも上手にできました。それでも一つだけ、トニーでさえできないほどむずかしい技がありました。「900（ナインハンドレッド）」とよばれる技です。900とは、空中にいるあいだにボードの上で2回転半する技です。それまで成功させたスケーターは一人もいませんでした。トニーは最初の一人になりたいと思っていました。` },
      { en:`In the 1999 X Games, Tony attempted to do the trick during his turn in the contest. The first time he tried, he was able to spin around two and a half times, but his board did not land in the right way. The same thing happened on his second try. He wanted to try a third time, but his time was up. The other skaters in the X Games agreed to let Tony attempt the trick one more time. He spun two and a half times in the air, waved his arms to keep his balance, and then landed. He had done it! He was the first person to land a 900!`,
        ja:`1999年のXゲームズで、トニーは自分の番にこの技に挑戦しました。1回目は2回転半できましたが、ボードがうまく着地しませんでした。2回目も同じでした。3回目に挑戦したかったのですが、持ち時間が終わってしまいました。Xゲームズに出ていたほかのスケーターたちは、トニーにもう一度だけ挑戦させることに同意しました。彼は空中で2回転半し、バランスを取るために腕を振り、そして着地しました。やってのけたのです！ 900を成功させた最初の人間になりました！` },
      { en:`The crowd cheered. Everyone knew he was the best skater, and the 900 proved it. To this day, very few skaters have safely landed a 900. Tony was more popular than ever.`,
        ja:`観衆は歓声をあげました。だれもが彼を最高のスケーターだと知っていましたし、900がそれを証明しました。今日にいたるまで、900を安全に成功させたスケーターはごくわずかです。トニーはかつてないほどの人気者になりました。` },
      { en:`In 2002, Tony founded the Boom Boom Huck Jam, an event that combines rock music and extreme sports. Skaters, BMX bikers, and motocross dirt bike riders put on a dazzling and dangerous show, and popular bands play music. That same year, he started the Tony Hawk Foundation, which raises money to build skate parks. Tony&rsquo;s foundation has built more than 125 skate parks in places that were not able to afford to build them.`,
        ja:`2002年、トニーは「ブーム・ブーム・ハック・ジャム」を立ち上げました。ロック音楽とエクストリームスポーツを組み合わせたイベントです。スケーター、BMXライダー、モトクロスの選手たちが、まばゆく危険なショーを見せ、人気バンドが演奏します。同じ年、彼はトニー・ホーク財団を設立しました。スケートパークを作るための資金を集める団体です。彼の財団は、自力では作る余裕のなかった地域に、125か所以上のスケートパークを作ってきました。` },
      { en:`Today, Tony is still very active in skateboarding, though he no longer enters skating contests. He does TV reports about the skaters at the X Games. He meets with skating fans from around the world to talk about the sport, and his Birdhouse Projects company is one of the most popular skateboard makers.`,
        ja:`今日でもトニーはスケートボードの世界で活発に活動していますが、大会にはもう出場しません。Xゲームズのスケーターについてテレビでリポートをしています。世界中のスケートファンと会ってこのスポーツについて語り、彼のバードハウス・プロジェクツ社は、もっとも人気のあるスケートボードメーカーの一つです。` },
      { en:`<mark data-q="5">Tony Hawk was one of the first skaters to introduce the sport to people who had not heard of it. He has invented nearly 100 skating tricks, and has performed tricks better than any other skater.</mark> He was the first (and one of only four people in the world) to do the 900, which is the hardest skating trick. Tony Hawk&rsquo;s companies are very successful, and many of the top skaters use his products. He teaches children how to skate and educates millions of TV viewers from around the world about his sport. From Ollies to 900s to TV to X Games to skate parks, Tony Hawk flies high.`,
        ja:`トニー・ホークは、このスポーツを知らなかった人たちに紹介した最初のスケーターの一人です。100近い技を編み出し、ほかのどのスケーターよりも上手に技を決めてきました。もっともむずかしい技である900を成功させた最初の（そして世界で4人しかいないうちの一人の）人物です。トニー・ホークの会社は大きな成功をおさめ、トップスケーターの多くが彼の製品を使っています。彼は子どもたちにすべり方を教え、世界中の何百万人ものテレビ視聴者にこのスポーツを伝えています。オーリーから900へ、テレビへ、Xゲームズへ、スケートパークへ——トニー・ホークは高く飛びつづけています。` },

  {
    title: "The Wheelchair Stunt Master",
    titleJa: "車いすのスタントの達人",
    source: "Lexile 850–900 / ノンフィクション（伝記・スポーツ）",
    paras: [
      { en:`<mark data-q="5">Aaron Fotheringham wants people to see their daily challenges in a new way.</mark> He doesn&rsquo;t believe they are challenges. Instead, he believes they are opportunities to think differently. <mark data-q="1">He feels strongly about this because he was born with spina bifida.</mark> Spina bifida is a birth defect in the spine, and it can damage the spinal cord. For Fotheringham, he can&rsquo;t move his legs because of this defect. Throughout his childhood, his adoptive parents urged him to be as independent as possible, even if that meant he had to think of new and creative ways to deal with problems.`,
        ja:`アーロン・フォザリンガムは、人々が日々ぶつかる困難を、新しい見方でとらえてほしいと考えています。彼はそれを「困難」だとは思っていません。そうではなく、ちがう考え方をするための「機会（チャンス）」だと考えているのです。彼がこう強く思うのは、二分脊椎（にぶんせきつい）という状態で生まれたからです。二分脊椎は背骨の生まれつきの異常で、脊髄を傷つけることがあります。フォザリンガムの場合、この異常のために足を動かすことができません。子ども時代を通して、養父母は彼にできるかぎり自立するようにうながしました。たとえそれが、問題に対処する新しく創造的な方法を自分で考え出さなければならない、ということであっても。` },
      { en:`<mark data-q="7">In school, Fotheringham refused to take the easier physical education classes. When the other students had to run a mile, he kept up by using crutches. While his friends biked, he would wheel quickly to keep up with them.</mark>`,
        ja:`学校で、フォザリンガムはより楽な体育の授業を受けることを断りました。ほかの生徒が1マイル走らなければならないとき、彼はつえ（クラッチ）を使ってついていきました。友だちが自転車に乗るときは、車いすを速くこいでついていったのです。` },
      { en:`<mark data-q="6">He loved the thrill of extreme sports.</mark> He realized his wheelchair could be an instrument for fun rather than just a medical device. <mark data-q="2">His older brother began taking him to skate parks where bicycle motocross riders (or BMXers) would ride and do tricks.</mark> When Fotheringham first tried to do a trick in his chair, he fell hard. It hurt. <mark data-q="2">But he realized he found something he loved to do&mdash;even though it would be difficult to learn.</mark>`,
        ja:`彼はエクストリームスポーツのスリルが大好きでした。自分の車いすは、ただの医療器具ではなく、楽しむための道具になりうると気づいたのです。兄が、BMX（自転車モトクロス）の選手たちが走って技を決めるスケートパークへ、彼を連れていくようになりました。フォザリンガムが初めて車いすで技をやろうとしたとき、彼は激しく転びました。痛かったです。でも彼は、自分が大好きになれるものを見つけたと気づきました——たとえ身につけるのがむずかしくても。` },
      { en:`<mark data-q="3">Fotheringham practiced daring stunts, including wheeling down steep ramps and flipping off of them. After a lot of practice, he perfected a mid-air 180-degree turn. The next year, he landed the first wheelchair backflip.</mark> After posting his backflip on the internet, his life changed. Fotheringham&rsquo;s backflip went viral! Since then, he&rsquo;s performed record-breaking stunts all over the world. A lot of people call him by his nickname, &ldquo;Wheelz.&rdquo;`,
        ja:`フォザリンガムは、急な傾斜のランプを一気に下ってそこから宙返りするなど、大胆なスタントを練習しました。たくさんの練習のすえ、空中で180度回転する技を完成させました。その翌年、彼は車いすで初のバックフリップ（後方宙返り）を成功させたのです。そのバックフリップをインターネットに投稿すると、彼の人生は変わりました。動画が一気に広まったのです！ それ以来、彼は世界中で記録を塗りかえるスタントを披露してきました。多くの人が、彼を「ウィールズ（Wheelz）」というニックネームでよんでいます。` },
      { en:`<mark data-q="4 5">Beyond performing, Fotheringham also speaks to younger people who are in wheelchairs. He shows them how to use their chairs in different, fun ways.</mark> He is also working on creating a wheelchair that is perfect for big stunts. <mark data-q="4">His goal is to inspire people to see their disability as a positive thing.</mark> He wants more people to experience the joy he has gotten from learning these daring stunts.`,
        ja:`演技をするだけでなく、フォザリンガムは車いすに乗る若い人たちに向けて話もしています。車いすを、ちがった、楽しい使い方でどう使えるかを見せているのです。また、大きなスタントにぴったりの車いすを作る仕事にも取り組んでいます。彼の目標は、自分の障害を前向きなものとしてとらえられるよう、人々をはげますことです。大胆なスタントを身につけることで自分が得た喜びを、もっと多くの人に味わってほしいと願っています。` },
    ],

      { en:`This winter festival is both freezing and fun.`,

      { en:`Welcome to the city of ice! Beginning in January, the city of Harbin in northeastern China transforms, or changes, into a winter wonderland. <mark data-q="1">The ice festival is a popular tourist attraction.</mark> It has been drawing crowds for over 45 years. <mark data-q="1 2">Organizers expect millions of visitors to pour into the city&rsquo;s parks this year.</mark> <mark data-q="4">There, they will see hundreds of snow sculptures and some huge buildings made with bricks of ice.</mark>`,

        en:`Harbin is the coldest city in China. The temperature in the city is below freezing for more than six months of the year. (The freezing point of water is 32 degrees Fahrenheit.) In Harbin, the temperature can fall below zero. That gives people there a great opportunity, or chance, to build with tons of snow and ice. In fact, they use enough snow and ice to fill 90 large swimming pools!`,

      { en:`In December, 3,000 workers began creating the winter amusement park. <mark data-q="4">They carved giant castles, friendly dragons, slippery slides, and even working restaurants out of ice.</mark> Some of the buildings and sculptures have colorful lights that are lit up at night.`,

      { en:`Many of the ice sculptures are made by teams of artists from around the world. <mark data-q="3">When visitors come to look at the creations, they have to watch their step. Not only are the buildings made of ice, but so are many of the walkways and railings!</mark>`,
        ja:`氷の彫刻の多くは、世界中から集まった芸術家のチームによって作られます。作品を見にきた人たちは、足もとに気をつけなければなりません。建物が氷でできているだけでなく、通路や手すりの多くまで氷でできているのですから！` },

  {
    title: "What a Dump!",
    titleJa: "なんてゴミの山！ ― プラスチックごみ問題",
    source: "Lexile 850–900 / ノンフィクション（環境・社会）",
    photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Marine_Debris_on_Midway_Atoll_%2833068857593%29.jpg/960px-Marine_Debris_on_Midway_Atoll_%2833068857593%29.jpg",
    photoAlt: "浜辺に打ち上げられたプラスチックごみ",
    photoCap: "ミッドウェー環礁の浜に打ち上げられた海洋ごみ。人の住まない島にも大量のプラスチックが流れ着く。",
    photoCredit: "写真: NOAA / U.S. Fish and Wildlife Service（パブリックドメイン / Wikimedia Commons）",
    paras: [
      { en:`How do we get rid of so much plastic trash?`,
        ja:`こんなにたくさんのプラスチックごみを、どうやって減らせばいいのだろう。` },
      { h:"The Plastic Predicament（プラスチックという難題）",
        en:`<mark data-q="6">Try to get through a day without using plastic. For that matter, try to go just one hour without it.</mark> From food and drink packages to cell phones and toothbrushes, <mark data-q="6">plastic is nearly impossible to avoid.</mark> You can&rsquo;t even turn on a light without flicking a plastic switch.`,
        ja:`プラスチックを使わずに1日をすごしてみてください。いや、それどころか、たった1時間でもいいからやってみてください。食べ物や飲み物の包装から、けいたい電話や歯ブラシまで、プラスチックをさけるのはほとんど不可能です。プラスチックのスイッチを押さなければ、明かりをつけることさえできないのです。` },
      { en:`<mark data-q="1">Plastic doesn&rsquo;t exist in nature. It&rsquo;s created from chemicals.</mark> Mass production of plastic started in the 1940s. Since then, it has become supremely popular&mdash;and for good reason. Plastic is lightweight, cheap, and convenient. It also lasts for a very long time. That can be good&mdash;you don&rsquo;t want your laptop to fall apart as you type&mdash;but it can be bad too.`,
        ja:`プラスチックは自然の中には存在しません。化学物質から作られます。プラスチックの大量生産は1940年代に始まりました。それ以来、プラスチックは非常に広く使われるようになりました。それには理由があります。プラスチックは軽くて、安くて、便利だからです。しかも、とても長もちします。それは良いことでもあります——タイプしている最中にノートパソコンがバラバラになってほしくはありませんから——でも、悪いことにもなりうるのです。` },
      { en:`<mark data-q="3">Plastic can remain in the environment for hundreds or even thousands of years.</mark> <mark data-q="5">It piles up, filling garbage dumps and polluting the land and the ocean.</mark> Each year, more than 300 million tons of new plastic are manufactured worldwide. Clearly, we have a plastic problem.`,
        ja:`プラスチックは、何百年、いや何千年も環境の中に残ることがあります。それが積み上がり、ごみ処分場をうめつくし、陸と海を汚していきます。毎年、世界中で3億トン以上の新しいプラスチックが作られています。あきらかに、わたしたちはプラスチックの問題をかかえているのです。` },
      { h:"Trash Soup（ごみのスープ）",
        en:`Natural products such as food, paper, and wood are biodegradable; they&rsquo;re broken down by bacteria and are absorbed by the environment. Plastic, on the other hand, is photodegradable. <mark data-q="7">Light from the sun causes it to break into smaller pieces over time.</mark> <mark data-q="4 7">It never degrades completely, however.</mark> It often winds up littering the land and the ocean.`,
        ja:`食べ物、紙、木のような自然のものは「生分解性（biodegradable）」です。つまり、バクテリアによって分解され、環境にもどっていきます。一方でプラスチックは「光分解性（photodegradable）」です。太陽の光によって、時間をかけて小さなかけらにくだけていきます。けれども、完全に分解されることはけっしてありません。そして多くの場合、陸や海に散らばったまま残ってしまうのです。` },
      { en:`In the Pacific Ocean, plastic waste has collected in a swirling &ldquo;soup&rdquo; of trash called the Great Pacific Garbage Patch. It&rsquo;s huge&mdash;more than two times as big as Texas! It&rsquo;s just one example of an ocean garbage patch. <mark data-q="5">Plastic pollutes all the world&rsquo;s seas.</mark> The United Nations Environment Programme estimates that plastic kills 100,000 marine mammals and turtles and 1 million seabirds every year. Some become tangled in plastic debris, while others die after eating plastic trash that they can&rsquo;t digest. Scientists estimate that 80 percent of the ocean&rsquo;s plastic started out on land.`,
        ja:`太平洋では、プラスチックごみが渦をまく「スープ」のように集まっていて、これは「太平洋ごみベルト（Great Pacific Garbage Patch）」とよばれています。とても巨大で、テキサス州の2倍以上の広さです！ これは海のごみだまりの一例にすぎません。プラスチックは世界中のすべての海を汚しています。国連環境計画の推定では、プラスチックによって毎年10万頭の海の哺乳類とウミガメ、そして100万羽の海鳥が命を落としています。プラスチックのごみにからまってしまうものもいれば、消化できないプラスチックを食べて死んでしまうものもいます。科学者たちは、海のプラスチックの80パーセントはもともと陸から来たものだと推定しています。` },
      { en:`Now the good news: you can help by tossing plastic into the recycling bin instead of the trash. A measly 29 percent of plastic bottles were recycled in 2018, according to the U.S. Environmental Protection Agency. You can help drive that number up.`,
        ja:`さて、良い知らせです。あなたも、プラスチックをごみ箱ではなくリサイクル用の箱に入れることで力になれます。アメリカ環境保護庁によると、2018年にリサイクルされたペットボトルは、たった29パーセントでした。あなたが、その数字をおし上げる力になれるのです。` },
      { h:"Sea of Trash（ごみの海）",
        en:`The Great Pacific Garbage Patch is two areas of floating garbage in the Pacific Ocean. Together, they cover an area that is more than twice the size of the state of Texas. They lie within the North Pacific Subtropical Gyre, a ring of currents that turns clockwise in the ocean.`,
        ja:`太平洋ごみベルトは、太平洋にうかぶ2つのごみの海域です。あわせると、テキサス州の2倍以上の面積になります。これらは「北太平洋亜熱帯循環（North Pacific Subtropical Gyre）」の中にあります。海の中を時計回りにめぐる海流の輪のことです。` },
      { h:"Reduce, Reuse（減らす・くり返し使う）",
        en:`Still, recycling won&rsquo;t solve our plastic predicament by itself. Not all types of plastic can be recycled. And those that can may not be recycled in the way you&rsquo;d expect. Plastic water and soft-drink bottles&mdash;some of the most commonly used plastics in the United States&mdash;are hardly ever turned into new bottles. Instead, they&rsquo;re recycled into carpet, furniture, and fleece clothing. When those products wear out, they often can&rsquo;t be recycled a second time.`,
        ja:`とはいえ、リサイクルだけでプラスチックの難題が解決するわけではありません。すべての種類のプラスチックがリサイクルできるわけではないのです。そしてリサイクルできるものも、あなたが思っているような形でリサイクルされるとはかぎりません。水や清涼飲料のペットボトル——アメリカでもっともよく使われるプラスチックの一つ——が、新しいボトルに生まれ変わることはほとんどありません。そのかわり、カーペットや家具、フリースの衣類にリサイクルされます。そうした製品が古くなってしまうと、たいてい2度目のリサイクルはできないのです。` },
      { en:`So what can you do? <mark data-q="2 5">One of the best ways to tackle the problem is to reduce the amount of plastic you use.</mark> Carry reusable water containers instead of single-use plastic bottles. Bring your lunch in recyclable aluminum foil instead of a plastic sandwich bag. Ask your family to carry reusable tote bags to the grocery store. Every little bit helps.`,
        ja:`では、あなたに何ができるでしょう。この問題に立ち向かういちばん良い方法の一つは、自分が使うプラスチックの量を減らすことです。使い捨てのペットボトルのかわりに、くり返し使える水筒を持ちましょう。プラスチックのサンドイッチ袋のかわりに、リサイクルできるアルミホイルにお弁当を包みましょう。家族に、買い物へはくり返し使えるトートバッグを持っていこうと言ってみましょう。小さなことでも、すべてが力になります。` },
      { en:`Plastic will probably always be part of our lives. But by making smart choices, we can keep it from burying us.`,
        ja:`プラスチックは、これからもずっとわたしたちの生活の一部でありつづけるでしょう。でも、かしこい選択をすることで、プラスチックにうめつくされるのをふせぐことができるのです。` },

  /* ===== 900-1 ===== */
  {
    title: "Studying Coral Reefs Helps the Land, Too",
    titleJa: "サンゴ礁の研究は、陸も助ける",
    source: "Lexile 850–900 / ノンフィクション（理科・環境）",
    photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Parrotfish_school_over_coral_reef_Guam_2022.png/960px-Parrotfish_school_over_coral_reef_Guam_2022.png",
    photoAlt: "サンゴ礁の上を泳ぐ魚の群れ",
    photoCap: "サンゴ礁の上を泳ぐブダイの群れ。何千種もの海の生き物がサンゴ礁を家にしている。",
    photoCredit: "写真: NOAA Fisheries（パブリックドメイン / Wikimedia Commons）",
    paras: [
      { en:`Have you ever seen the ocean? Standing on a beach watching waves rise and crash onto the sand is an amazing sight. But the real action is happening underwater. <mark data-q="1">Scientists who study the life in the ocean are called marine biologists.</mark> Marine biologists also study major changes in the ocean and how those changes affect ocean life. For instance, climate change is making oceans warmer. It is also changing the water in other ways. <mark data-q="2">One big concern is its damaging effects on coral reefs.</mark> <mark data-q="4">Some marine biologists work as coral reef conservationists to find ways to reverse these effects.</mark>`,
        ja:`海を見たことはありますか。浜辺に立って、波が高くなって砂にくだけるのを見るのはすばらしいながめです。でも、本当のドラマは水の中で起きています。海の生き物を研究する科学者は、海洋生物学者（marine biologists）とよばれます。海洋生物学者は、海の大きな変化や、その変化が海の生き物にどんな影響をあたえるかも研究します。たとえば、気候変動は海をあたたかくしています。ほかの形でも海の水を変えています。大きな心配の一つが、サンゴ礁への害です。海洋生物学者の中には、この害をもとにもどす方法を見つけるため、サンゴ礁の保護活動家として働く人もいます。` },
      { en:`Coral reefs are underwater structures in the ocean near the coasts. They are made up of tiny ocean animals called corals. The corals grow side by side in groups, so that all together they look like plants or piles of rocks. Corals and tiny organisms called algae have a symbiotic relationship. This means they need each other to live. Corals provide a safe home for the algae, and algae help corals get enough food. Algae also give corals their bright colors.`,
        ja:`サンゴ礁は、海岸の近くの海にある水中の構造物です。サンゴ（coral）とよばれる小さな海の動物からできています。サンゴはとなり合って群れで育つので、全体では植物や岩のかたまりのように見えます。サンゴと、藻類（そうるい）とよばれる小さな生き物は、共生（symbiotic）の関係にあります。これは、たがいに相手がいないと生きられないという意味です。サンゴは藻類に安全なすみかをあたえ、藻類はサンゴがじゅうぶんな栄養をとるのを助けます。藻類はまた、サンゴにあざやかな色をあたえています。` },
      { en:`Coral reefs are located near many countries all over the world. <mark data-q="5">These reefs are very important to ocean life and to the coastal communities.</mark> Thousands of ocean animals depend on coral reefs for shelter and food. <mark data-q="3">Coral reefs also protect the land. They absorb some of the energy from big storms that threaten the coasts.</mark> By the time the big storms reach land, they are not as strong. This helps prevent flooding.`,
        ja:`サンゴ礁は、世界中の多くの国の近くにあります。このサンゴ礁は、海の生き物にとっても、海岸の地域社会にとっても、とても大切です。何千種もの海の動物が、すみかと食べ物をサンゴ礁にたよっています。サンゴ礁は陸も守ります。海岸をおそう大きな嵐のエネルギーを、いくらか吸収するのです。大きな嵐が陸にとどくころには、その力は弱まっています。これが洪水をふせぐのに役立ちます。` },
      { en:`<mark data-q="2 5">Climate change and pollution are hurting coral reefs.</mark> <mark data-q="3">When the water gets too dirty or too warm, corals lose their algae and turn white.</mark> This is called coral bleaching. Coral bleaching is happening all over the world. When corals bleach, they often die. When the corals die, it hurts all those other animals that depend on them for their homes and food. Coral bleaching also puts the communities along the coast at greater risk of being damaged by storms.`,
        ja:`気候変動と汚染が、サンゴ礁を傷つけています。水がよごれすぎたり、あたたかくなりすぎたりすると、サンゴは藻類を失って白くなります。これを「白化（coral bleaching）」といいます。白化は世界中で起きています。サンゴが白化すると、多くの場合そのまま死んでしまいます。サンゴが死ぬと、すみかや食べ物をサンゴにたよっているほかの動物すべてが困ります。白化はまた、海岸ぞいの地域が嵐で被害を受ける危険を高めます。` },
      { en:`Coral reef conservationists and other scientists are working to find ways to help corals survive. To do this, they are trying to understand why some corals bleach and others don&rsquo;t. They are also studying ways to help make coral reefs bigger and stronger. They are growing coral in laboratories. Then they transplant them near reefs to find out if they&rsquo;ll grow in that area.`,
        ja:`サンゴ礁の保護活動家やほかの科学者たちは、サンゴが生きのびる方法を見つけようと取り組んでいます。そのために、なぜ白化するサンゴとしないサンゴがいるのかを理解しようとしています。サンゴ礁をより大きく、より強くする方法も研究しています。研究室でサンゴを育て、それをサンゴ礁の近くに移植して、その場所で育つかどうかを調べているのです。` },
      { en:`Amy Baco-Taylor is a marine biologist who is studying corals. She first learned about marine biology from reading stories and watching videos about the ocean. She saw the ocean in person for the first time when she was 13. Now, she goes on expeditions to study deep-sea corals. She is helping to better understand rare corals and the best way to help them survive in a changing ocean.`,
        ja:`エイミー・バコ＝テイラーは、サンゴを研究している海洋生物学者です。彼女は最初、海についての物語を読んだり動画を見たりして海洋生物学を知りました。実際に海を見たのは13歳のときが初めてでした。今では、深海のサンゴを研究するために調査航海に出ています。めずらしいサンゴをよりよく理解し、変わりゆく海の中でそれらが生きのびる最善の方法を探る手助けをしています。` },
      { en:`Curt Storlazzi is a scientist with the United States Geological Survey. He studies other ways to help coral. He calls healthy coral reefs a natural infrastructure, or foundation. On land, infrastructure refers to roads, bridges, and buildings, plus water and electricity. Coral reefs are like the infrastructure of the ocean.`,
        ja:`カート・ストーラッツィは、アメリカ地質調査所の科学者です。彼はサンゴを助ける別の方法を研究しています。彼は健康なサンゴ礁を「自然のインフラ（infrastructure）」＝土台とよんでいます。陸の上でインフラといえば、道路、橋、建物、それに水道や電気のことです。サンゴ礁は、海のインフラのようなものなのです。` },
      { en:`If spending time underwater learning about marine life sounds amazing to you, think about becoming a coral reef conservationist. <mark data-q="4 5">Helping to save these important animals will help the ocean and the land.</mark>`,
        ja:`水の中で海の生き物について学ぶ時間がすばらしいと思うなら、サンゴ礁の保護活動家になることを考えてみてください。この大切な生き物を守る手助けは、海と陸の両方を助けることになるのです。` },

  /* ===== 900-2 ===== */
  {
    title: "Farmers Care for the Land",
    titleJa: "農家は土地を大切にする",
    source: "Lexile 900–950 / ノンフィクション（環境・農業）",
    paras: [
      { en:`You probably know that most of the food you see in grocery stores is grown on farms. Farmers may grow crops, raise animals, or both. <mark data-q="5">No matter what type of food they produce, farmers also focus on the best ways to care for the land. In this way, farmers can be conservationists!</mark>`,
        ja:`スーパーで見かける食べ物のほとんどが農場で作られていることは、たぶん知っているでしょう。農家は作物を育てたり、動物を育てたり、その両方をしたりします。どんな種類の食べ物を作るにしても、農家は土地を大切にするいちばん良い方法にも力を注いでいます。そういう意味で、農家は自然を守る人（conservationist）にもなれるのです！` },
      { en:`In the western United States, some ranchers raise cattle on the prairie, or grasslands. Ranchers work with conservation groups to help preserve the grasslands. <mark data-q="1">The groups work to remove invasive plants that don&rsquo;t belong on the prairie.</mark> Invasive plants can take over and kill off native plants. This is bad for the cattle and for the wildlife that only eat native plants. Ranchers can also work with conservation groups to protect wildlife on the prairie. There are wild animals, like elk, mule deer, and pronghorn, that live on the prairie. These animals migrate across the prairie with the seasons. Ranchers are learning to use special fencing, to help keep migrating animals safe on their journeys. Wildlife-friendly fencing also keeps cattle safe.`,
        ja:`アメリカ西部では、プレーリー（草原）で牛を育てている牧場主がいます。牧場主は保護団体と協力して、草原を守る手助けをしています。団体は、プレーリーに本来いるべきでない外来植物を取りのぞく活動をしています。外来植物は広がって、もとからある在来植物を絶やしてしまうことがあります。これは牛にとっても、在来植物しか食べない野生動物にとっても良くありません。牧場主は、プレーリーの野生動物を守るために保護団体と協力することもできます。プレーリーには、エルク、ミュールジカ、プロングホーンのような野生動物がすんでいます。これらの動物は季節に合わせてプレーリーを移動します。牧場主は、移動する動物が旅の途中で安全でいられるように、特別なフェンスの使い方を学んでいます。野生動物にやさしいフェンスは、牛の安全も守ります。` },
      { en:`In other parts of the United States, farmers who raise crops need to choose what to plant in their fields. Different types of crops grow better in certain types of soil. Farmers test their soil. Farmers may add nutrients such as fertilizer to their soil to help the crops grow. <mark data-q="2">Since the soil is so important to a farmer&rsquo;s work, some groups of farmers are taking steps to protect their soil in a new way.</mark> The work they&rsquo;re doing can also help to slow down climate change. One of the causes of climate change is too much carbon in the air. Plants absorb carbon from the air. So farmers can use different planting practices to help with the carbon in the air.`,
        ja:`アメリカのほかの地域では、作物を育てる農家が、畑に何を植えるかを選ばなければなりません。作物の種類によって、育ちやすい土のタイプがちがいます。農家は自分の土を検査します。作物がよく育つように、肥料などの栄養分を土にくわえることもあります。土は農家の仕事にとってとても大切なので、新しい方法で土を守ろうとしている農家のグループもあります。かれらの取り組みは、気候変動をおそくすることにも役立ちます。気候変動の原因の一つは、空気中の炭素が多すぎることです。植物は空気中から炭素を吸収します。だから農家は、いろいろな植え方を工夫することで、空気中の炭素を減らす助けができるのです。` },
      { en:`<mark data-q="2">To help protect the soil, many farmers have started using plants called cover crops.</mark> After harvesting crops like corn or soybeans, they plant cover crops such as rye or winter peas. In the spring, the cover crops die, break down, and feed the soil with nutrients. Farmers can then plant their normal crops right over the cover crops.`,
        ja:`土を守るために、多くの農家が「カバークロップ（被覆作物）」とよばれる植物を使いはじめました。トウモロコシや大豆などの作物を収穫したあと、ライ麦や冬エンドウなどのカバークロップを植えるのです。春になると、カバークロップは枯れて分解され、土に栄養分をあたえます。農家はそのカバークロップの上から、そのままふだんの作物を植えることができます。` },
      { en:`<mark data-q="3">This process of using cover crops helps the environment in a few ways. First, when the dead cover crops break down into the soil, carbon doesn&rsquo;t go back into the air. Instead, because the cover crops have deep roots, the carbon stays in the ground. Second, the deep roots help the soil stay put, in the fields, where it belongs. The roots stop the soil from washing into waterways. This is important because soil that washes into water can clog the water and kill fish.</mark> If a farmer adds fertilizer to soil and the soil washes into water, the fertilizer can cause algae to grow. Too much algae can poison the water. Plus, if soil washes away, it&rsquo;s lost forever. And finally, because cover crops add nutrients to the soil, farmers can use less fertilizer. This means less danger of pollution or contamination.`,
        ja:`カバークロップを使うこの方法は、いくつかの点で環境の役に立ちます。第一に、枯れたカバークロップが土の中で分解されるとき、炭素は空気中にもどりません。そのかわり、カバークロップには深い根があるので、炭素は地中にとどまります。第二に、深い根は土をその場に、つまり畑という本来あるべき場所にとどめておく助けになります。根は、土が水路へ流れ出るのを止めるのです。これが大切なのは、水に流れこんだ土が水をつまらせ、魚を死なせることがあるからです。もし農家が土に肥料をくわえ、その土が水に流れこむと、肥料が藻を大量に育ててしまうことがあります。藻が多すぎると、水に毒をもたらします。さらに、土が流れ去ってしまえば、それは永遠に失われます。そして最後に、カバークロップが土に栄養分をくわえてくれるので、農家は肥料を減らすことができます。つまり、汚染や有害物質の危険が小さくなるのです。` },
      { en:`Fred Yoder is a farmer who lives in Ohio. He runs a farm that his father used to run. His children are learning to be farmers also. <mark data-q="4">He says that because of technology, fewer workers can grow more crops than ever before.</mark> But farm life is changing because of climate change. Planting seasons, growing seasons, and the time of harvest are changing as weather patterns change. <mark data-q="4">Farming organizations are sharing information to help farmers.</mark> Yoder gets excited about trying new things to make farming better. He is using cover crops on his farm. This is a new idea that his father never used.`,
        ja:`フレッド・ヨーダーは、オハイオ州に住む農家です。彼は、かつて父親が営んでいた農場を引きついでいます。彼の子どもたちも農業を学んでいます。彼が言うには、技術のおかげで、より少ない働き手でこれまで以上に多くの作物を育てられるようになりました。しかし気候変動によって、農業の暮らしは変わりつつあります。天候のパターンが変わるにつれて、種まきの季節、生育の季節、収穫の時期も変わってきているのです。農業団体は、農家を助けるために情報を共有しています。ヨーダーさんは、農業をより良くするために新しいことをためすのが楽しみだと言います。彼は自分の農場でカバークロップを使っています。これは、父親が一度も使わなかった新しい考え方です。` },
      { en:`As younger people learn about farming, they can learn more about technology, too. <mark data-q="4 5">Using information from professional conservation groups and farming organizations will help them make better decisions in the future.</mark> Fred Yoder says they will make the land better for the next generation of farmers.`,
        ja:`若い人たちが農業について学ぶとき、技術についても学ぶことができます。専門の保護団体や農業団体からの情報を使うことが、将来よりよい判断をする助けになるでしょう。フレッド・ヨーダーさんは、かれらが次の世代の農家のために、この土地をもっと良くしていくだろうと語っています。` },
    ],

  /* ===== 900-3 ===== */
  {
    title: "How to Band Birds",
    titleJa: "鳥に足環をつける方法",
    source: "Lexile 900–950 / ノンフィクション（理科・生物）",
    paras: [
      { en:`From songbirds in cities to shorebirds on the beach, everyone has seen a bird. But some people, such as researchers, take time and put in effort to study birds closely. One of the ways researchers study birds is through banding. Banding has nothing to do with guitars and drum sets. <mark data-q="1">Instead, bird banding is when researchers place a special band on birds&rsquo; legs.</mark> Bird banding has been used to study wild birds for more than 100 years!`,
        ja:`街の小鳥から浜辺の水鳥まで、だれもが鳥を見たことがあります。でも研究者のように、時間と労力をかけて鳥をくわしく調べる人たちもいます。研究者が鳥を調べる方法の一つが「バンディング（banding）」です。バンディングといっても、ギターやドラムのバンドとは何の関係もありません。鳥のバンディングとは、研究者が鳥の足に特別な輪（バンド）をつけることです。鳥のバンディングは、100年以上にわたって野生の鳥の研究に使われてきました！` },
      { en:`Birds like to visit and live in areas that have good food and a safe place to rest. They look for areas with trees and bushes. So when scientists want to study the birds in a certain area, they might set up a banding station there. <mark data-q="2">Using special nets, researchers and volunteers gently catch the birds to learn more about them. The researchers carefully weigh and measure the birds and keep track of their species and gender. They also put the bands on each bird&rsquo;s leg.</mark>`,
        ja:`鳥は、良い食べ物と安全に休める場所がある地域をおとずれ、そこに住むのを好みます。木やしげみのある場所をさがすのです。だから科学者は、ある地域の鳥を調べたいとき、そこに「バンディング・ステーション（調査地点）」をつくることがあります。特別なあみを使って、研究者やボランティアがそっと鳥をつかまえ、その鳥についてより多くを知ろうとします。研究者は鳥の体重や大きさをていねいにはかり、種類と性別を記録します。そして、それぞれの鳥の足にバンドをつけるのです。` },
      { en:`The small metal bands are lightweight. Each band has a different number on it. If the bird is ever caught again, researchers will know where the bird was found the first time. They&rsquo;ll also know if the bird has changed at all. Some researchers use tiny plastic bands in bright colors in addition to the metal bands. The bright colors can be seen from a distance.`,
        ja:`その小さな金属のバンドは軽いものです。バンドにはそれぞれちがう番号がついています。もしその鳥がふたたびつかまえられれば、研究者はその鳥が最初にどこで見つかったかを知ることができます。その鳥に何か変化があったかどうかも分かります。金属のバンドにくわえて、明るい色の小さなプラスチックのバンドを使う研究者もいます。明るい色なら、はなれた場所からでも見えるからです。` },
      { en:`In the United States, the U.S. Geological Survey manages the bird banding program for most of North America. So many birds migrate through the continent that Canada and Mexico agreed to be part of the U.S. program. Information collected through bird banding is shared with all the scientists and researchers in the three countries.`,
        ja:`アメリカでは、アメリカ地質調査所が北アメリカのほぼ全域の鳥バンディング事業を運営しています。とても多くの鳥がこの大陸を渡っていくため、カナダとメキシコもアメリカの事業に参加することに同意しました。バンディングによって集められた情報は、3か国のすべての科学者と研究者に共有されます。` },
      { en:`<mark data-q="3 5">The information that scientists have collected at banding stations helps us understand the flight patterns of different bird species. Scientists can describe the routes the birds take when they migrate. Thanks to banding, we are learning where and how long birds live. Researchers are also studying how bird size and migration routes may be changing.</mark>`,
        ja:`バンディング・ステーションで科学者が集めてきた情報は、さまざまな鳥の種類の飛行パターンを理解する助けになります。科学者は、鳥が渡りをするときに通る経路を説明できるようになります。バンディングのおかげで、鳥がどこで、どれくらい長く生きるのかも分かってきています。研究者は、鳥の大きさや渡りの経路がどう変わりつつあるのかも調べています。` },
      { en:`Because of programs that count and follow birds, researchers know that billions of birds have died over the past 50 years. Now that they are aware of this problem, scientists are trying to find out what is killing the birds and how to help them.`,
        ja:`鳥を数え、追いかける事業のおかげで、研究者たちは過去50年間に何十億羽もの鳥が死んだことを知りました。この問題に気づいた今、科学者たちは何が鳥の命をうばっているのか、どうすれば助けられるのかを見つけようとしています。` },
      { en:`<mark data-q="3">The biggest problem for the birds is the loss of habitat. People cut down forests and remove the plants in fields to build homes and businesses. The birds have fewer places to rest when they travel. When they arrive at their former homes, there are no trees left to build their nests.</mark> For birds that nest on the ground, the loss of the fields means they have no home either.`,
        ja:`鳥にとって最大の問題は、生息地の消失です。人々は家や店を建てるために森を切りひらき、野原の草木を取りのぞきます。すると鳥は、旅の途中で休める場所が少なくなります。かつての住みかにたどり着いても、巣を作る木がもう残っていないのです。地面に巣を作る鳥にとっては、野原が失われることも、家を失うことを意味します。` },
      { en:`Climate change is another problem. Warmer temperatures are causing bigger storms, which might send migrating birds in the wrong direction. Big storms might also injure the birds. The warmer temperatures are also changing the growing season. Some plants are starting to bloom at earlier times. This may cause birds that migrate to miss their food source.`,
        ja:`気候変動も、もう一つの問題です。気温が上がることで、より大きな嵐が起こり、渡りをする鳥をまちがった方向へ流してしまうかもしれません。大きな嵐は、鳥を傷つけることもあります。気温の上昇は、植物の育つ季節も変えています。花がこれまでより早く咲きはじめる植物もあります。そのために、渡りをする鳥が食べ物の時期をのがしてしまうかもしれません。` },
      { en:`Another problem for birds is lights from large cities. Lights can cause birds to crash into buildings and die. Some cities have started to schedule nights with &ldquo;lights out&rdquo; during migration seasons.`,
        ja:`大都市の明かりも、鳥にとっての問題です。明かりのせいで、鳥が建物にぶつかって死ぬことがあります。渡りの季節に「消灯（lights out）」の夜を決める都市も出てきました。` },
      { en:`<mark data-q="4 5">Researchers are working to find other solutions to help the birds. Solving problems always starts with understanding the causes. By studying the birds and the problems they are facing, researchers hope to find ways to help birds thrive.</mark>`,
        ja:`研究者たちは、鳥を助けるほかの解決策も見つけようと取り組んでいます。問題を解決することは、いつも原因を理解することから始まります。鳥と、鳥が直面している問題を研究することで、研究者たちは鳥が元気に生きられる方法を見つけたいと願っています。` },

    paras: [
      { en:`<mark data-q="5">Kyle Maynard is a motivational speaker, award-winning athlete, and best-selling author. He also has a disability.</mark> <mark data-q="1">Maynard was born on March 24, 1986, with a rare condition called congenital amputation.</mark> He was born with arms that end at the elbows and legs that end near the knees. <mark data-q="2">His parents made a decision early on to give their child as much independence as possible. They wanted him to develop skills to work with his disability and accomplish everything he wanted to achieve.</mark>`,
        ja:`カイル・メイナードは、人を勇気づける講演者であり、賞を取ったアスリートであり、ベストセラー作家でもあります。そして彼には障害があります。メイナードは1986年3月24日に、「先天性四肢切断（congenital amputation）」というめずらしい状態で生まれました。腕はひじのところで、脚はひざの近くで終わっているのです。両親は早いうちから、わが子にできるかぎりの自立をあたえようと決めました。障害とともに生きる力を身につけ、成しとげたいことをすべて実現できるようになってほしいと願ったのです。` },
      { en:`<mark data-q="2 7">Kyle Maynard loved playing sports throughout his childhood, and he got involved in a wrestling team when he was a middle school student. In his first year of wrestling, he lost every match. But Maynard stuck with the sport. In his senior year of high school, Maynard won 36 matches and made it to the state championships!</mark> He also began weightlifting this same year. By early 2009, he was able to lift 420 pounds with the assistance of leather straps and chains attached to his arms.`,
        ja:`カイル・メイナードは子ども時代を通してスポーツをするのが大好きで、中学生のときにレスリング部に入りました。レスリングを始めた最初の年、彼はすべての試合に負けました。それでもメイナードはこの競技をやめませんでした。高校最終学年では36試合に勝ち、州選手権に出場したのです！ 同じ年、彼はウエイトリフティングも始めました。2009年の初めまでには、腕に取りつけた革のストラップとチェーンの助けを借りて、420ポンド（約190kg）を持ち上げられるようになっていました。` },
      { en:`More recently, Kyle Maynard took on one of his biggest challenges yet: climbing the highest mountain in Africa, Mount Kilimanjaro. He trained for many months by climbing smaller mountains. His team of climbers consisted of war veterans with injuries and other disabilities. <mark data-q="3">The purpose of the climb was to raise awareness for wounded American war veterans. The mission also donated $25,000 worth of medical supplies to the Mwereni Integrated School for the Blind in Tanzania.</mark> <mark data-q="4">In just 10 days, Maynard became the first quadruple amputee to climb Mount Kilimanjaro without the help of artificial arms or legs.</mark>`,
        ja:`最近になって、カイル・メイナードはこれまででもっとも大きな挑戦の一つにいどみました。アフリカでいちばん高い山、キリマンジャロに登ることです。彼は何か月ものあいだ、より小さな山に登って訓練しました。彼の登山チームは、けがや障害のある元軍人たちで構成されていました。この登山の目的は、傷ついたアメリカの元軍人たちへの理解を広げることでした。この活動はまた、タンザニアのムウェレニ盲学校に2万5千ドル相当の医療品を寄付しました。わずか10日間で、メイナードは義手や義足の助けを借りずにキリマンジャロに登った最初の四肢切断者となったのです。` },
      { en:`<mark data-q="4 5">Maynard believes excuses should not stop any person from living a full life. And he clearly lives by his &ldquo;no excuses&rdquo; philosophy, too. Maynard speaks about his many experiences to people of all ages all across the world.</mark> His book, No Excuses, became a New York Times Bestseller in 2005. He wrote about his wrestling experience and how he had overcome difficulties in his life.`,
        ja:`メイナードは、言いわけによって、だれもが充実した人生を送るのをさまたげられるべきではないと信じています。そして彼自身も、その「言いわけなし（no excuses）」という信条どおりに生きています。メイナードは、世界中のあらゆる年齢の人々に向けて、自分の多くの経験について語っています。彼の著書『No Excuses』は、2005年にニューヨーク・タイムズのベストセラーになりました。その中で彼は、レスリングの経験と、人生の困難をどう乗りこえてきたかを書きました。` },

  {
    title: "Saving the World from Smallpox",
    titleJa: "天然痘から世界を救う",
    source: "Lexile 850–900 / ノンフィクション（科学・歴史）",
    photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Edward_Jenner._Pencil_drawing_with_wash._Wellcome_V0003103.jpg/960px-Edward_Jenner._Pencil_drawing_with_wash._Wellcome_V0003103.jpg",
    photoAlt: "エドワード・ジェンナーの肖像",
    photoCap: "エドワード・ジェンナー（1749–1823）。牛痘を使って天然痘をふせぐ方法を見つけた医師。",
    photoCredit: "図: Wellcome Collection（パブリックドメイン / Wikimedia Commons）",
    paras: [
      { en:`Sometimes to solve a tough problem, you have to ask the right questions. If you look carefully, you can find the right questions to ask. Edward Jenner was a doctor who lived hundreds of years ago. <mark data-q="5 6">He solved one of the toughest problems around and saved thousands of lives by preventing a disease called smallpox.</mark>`,
        ja:`むずかしい問題を解決するには、正しい問いを立てなければならないことがあります。よく見れば、たずねるべき正しい問いを見つけることができます。エドワード・ジェンナーは、何百年も前に生きた医師でした。彼は当時もっともむずかしい問題の一つを解決し、天然痘（smallpox）という病気をふせぐことで何千人もの命を救いました。` },
      { en:`For hundreds of years, smallpox was one of the worst diseases you could catch. <mark data-q="1">&ldquo;Pox&rdquo; are bumps filled with pus, and they showed up on sick people&rsquo;s skin. Thousands of people died from smallpox every year.</mark> Smallpox was around for a long time &ndash; even Egyptian pharaohs caught it. A lot of the people who caught smallpox died, but most of the people killed by smallpox were children. People who didn&rsquo;t die had ugly scars afterwards.`,
        ja:`何百年ものあいだ、天然痘はかかりうる病気の中でもっとも恐ろしいものの一つでした。「pox（痘）」とは、うみのつまったふくらみのことで、病気の人の皮ふに出てきました。毎年、何千人もの人が天然痘で亡くなりました。天然痘は長いあいだ存在していて、エジプトのファラオでさえかかりました。天然痘にかかった人の多くが亡くなりましたが、命をうばわれた人のほとんどは子どもでした。死ななかった人にも、あとに見た目の悪い傷あとが残りました。` },
      { en:`No one knew how to prevent people from catching smallpox. Doctors knew that if you had smallpox and didn&rsquo;t die, you couldn&rsquo;t catch it again. Some doctors thought you could inoculate against smallpox. That meant that if you gave people a mild version of the disease, they would be protected from getting the bad version. But it was very dangerous to inoculate people with smallpox. Sometimes it worked, but other times people who were given the mild version still got very sick with smallpox. Sometimes they died.`,
        ja:`天然痘にかかるのをどうふせげばよいのか、だれにも分かりませんでした。医師たちは、天然痘にかかって死ななかった人は、二度とかからないことを知っていました。天然痘に対して「接種（inoculate）」ができるのではないか、と考える医師もいました。それは、人に軽い形の病気をあたえれば、ひどい形にかかるのをふせげる、という考えです。しかし、天然痘を人に接種するのはとても危険でした。うまくいくこともありましたが、軽い形をあたえられた人が、それでも天然痘で重い病気になることもありました。ときには死んでしまうこともあったのです。` },
      { en:`Edward Jenner was interested in stopping people from catching smallpox, but he didn&rsquo;t know how such a bad disease could be prevented. He wondered if there could be a way to inoculate people safely. One day, Dr. Jenner was talking with a dairymaid, a girl who milked cows. She told him that she never worried about catching smallpox. Why? Because she had already caught cowpox. Cowpox was a similar disease that people could catch from cows. But cowpox was much less dangerous and never killed anyone.`,
        ja:`エドワード・ジェンナーは、人が天然痘にかかるのを止めることに関心を持っていましたが、これほどひどい病気をどうすればふせげるのか分かりませんでした。彼は、安全に接種する方法はないだろうかと考えました。ある日、ジェンナー医師は乳しぼりの娘（dairymaid）と話していました。彼女は、天然痘にかかる心配をしたことがない、と言いました。なぜでしょう。すでに牛痘（cowpox）にかかっていたからです。牛痘は、牛からうつる似た病気でした。しかし牛痘はずっと危険が少なく、だれかの命をうばうことはありませんでした。` },
      { en:`Dr. Jenner heard many more stories about how people believed dairymaids were immune to smallpox because they had already caught cowpox, so he decided to do an experiment with cowpox. This experiment was done at a time when people had not yet figured out how to safely do experiments with diseases to find treatments. While Dr. Jenner&rsquo;s experiment wasn&rsquo;t very safe, he was able to learn some very important information about smallpox.`,
        ja:`ジェンナー医師は、乳しぼりの娘たちは牛痘にかかったから天然痘に免疫があるのだ、という話をほかにもたくさん聞きました。そこで彼は、牛痘を使った実験をすることに決めました。この実験が行われたのは、病気を使った実験を安全に行い治療法を見つける方法が、まだ分かっていない時代でした。ジェンナー医師の実験はあまり安全なものではありませんでしたが、彼は天然痘についてとても重要なことを知ることができました。` },
      { en:`For his experiment, Dr. Jenner found a dairymaid with cowpox and took pus from one of the pox on her arm. <mark data-q="4">Then he made a cut on the arm of a boy named James Phipps and put some of the pus into the cut. Soon James Phipps caught cowpox.</mark> <mark data-q="3">A few weeks later Dr. Jenner gave James a mild dose of smallpox. If James got sick, they would know that the inoculation didn&rsquo;t work. But James didn&rsquo;t catch smallpox!</mark> <mark data-q="2 5">Dr. Jenner had solved the smallpox problem.</mark>`,
        ja:`実験のために、ジェンナー医師は牛痘にかかった乳しぼりの娘を見つけ、彼女の腕にできた痘の一つからうみを取りました。そして、ジェームズ・フィップスという少年の腕に切りきずをつくり、そこにそのうみを入れました。まもなくジェームズ・フィップスは牛痘にかかりました。数週間後、ジェンナー医師はジェームズに軽い量の天然痘をあたえました。もしジェームズが病気になれば、接種は効かなかったと分かるはずでした。しかしジェームズは天然痘にかからなかったのです！ ジェンナー医師は、天然痘の問題を解決したのでした。` },
      { en:`At first other people didn&rsquo;t believe Dr. Jenner. Lots of people made fun of him and laughed at him. People didn&rsquo;t know much about germs yet and thought he might be crazy. But Dr. Jenner continued to try his experiment with other children and to observe what happened. <mark data-q="2">Over and over again, giving children cowpox helped keep them safe from smallpox.</mark> Dr. Jenner became a world hero. Fewer and fewer people got smallpox, and now no one gets it.`,
        ja:`はじめ、ほかの人々はジェンナー医師を信じませんでした。多くの人が彼をからかい、笑いました。当時の人々は細菌についてまだよく知らず、彼はおかしくなったのではないかと考えたのです。しかしジェンナー医師は、ほかの子どもたちでも実験を続け、何が起こるかを観察しつづけました。何度くり返しても、子どもに牛痘をあたえることが、天然痘から守るのに役立ちました。ジェンナー医師は世界の英雄になりました。天然痘にかかる人はどんどん減っていき、今ではだれもかかりません。` },

  {
    title: "Syrian Refugees in the United States",
    titleJa: "アメリカに暮らすシリア難民",
    source: "Lexile 900–950 / ノンフィクション（社会・世界の出来事）",
    paras: [
      { en:`Since 2011, over six million Syrian people have been displaced from their homeland&mdash;many as refugees. <mark data-q="1">Refugees are people who fear for their safety and must leave their home country because of persecution or violence.</mark> Most refugees cannot return to their home countries.`,
        ja:`2011年以降、600万人をこえるシリアの人々が故郷を追われ、その多くが難民となりました。難民（refugee）とは、自分の安全を心配し、迫害や暴力のために母国をはなれなければならない人々のことです。ほとんどの難民は、母国にもどることができません。` },
      { en:`Syria is a country in the Middle East bordering a few countries and the Mediterranean Sea. <mark data-q="2">In March 2011, some Syrian citizens began protesting against the government because of political and economic issues. On top of these issues, droughts made farming and producing food difficult. The government responded with violence, and this led to some Syrians demanding the president of Syria to step down.</mark> But the president did not want to step down. <mark data-q="3">Within months, the Syrian civil war broke out. This war is between people wanting a new government and the old government trying to hold its power.</mark> Many countries in the Middle East and northern Africa experienced similar conflicts. These protests and conflicts in the region became part of a movement called the Arab Spring.`,
        ja:`シリアは中東にある国で、いくつかの国と地中海に面しています。2011年3月、一部のシリア市民が、政治や経済の問題を理由に政府に抗議し始めました。こうした問題にくわえて、干ばつのせいで農業や食料の生産がむずかしくなっていました。政府は暴力で応じ、そのことから一部のシリア人がシリア大統領に退陣を求めるようになりました。しかし大統領は退陣しようとしませんでした。数か月のうちに、シリア内戦が起こりました。この戦争は、新しい政府を求める人々と、権力を守ろうとする古い政府との間の戦いです。中東と北アフリカの多くの国でも、似たような対立が起きました。この地域での抗議と対立は、「アラブの春」とよばれる動きの一部となりました。` },
      { en:`<mark data-q="3 5">After the war started in Syria, refugees started to flee the country.</mark> Many settled in neighboring countries, like Turkey, Lebanon, and Jordan. The majority of Syrian refugees today are still in Turkey. The United States began accepting Syrian refugees near the end of 2011. However, resettlement of Syrian refugees in the United States happened on a much larger scale in 2015 and 2016. Most of the refugees who were admitted between 2011 and 2016 were located in a few states and cities. These states are California, Michigan, and Texas. San Diego and Chicago are the U.S. cities with the most Syrian refugees from this time period.`,
        ja:`シリアで戦争が始まったあと、難民が国外へ逃れ始めました。多くはトルコ、レバノン、ヨルダンなどの近隣国に落ち着きました。今日でも、シリア難民の大半はトルコにいます。アメリカは2011年の終わりごろからシリア難民の受け入れを始めました。ただし、アメリカでのシリア難民の再定住が大きな規模で行われたのは、2015年と2016年です。2011年から2016年のあいだに受け入れられた難民のほとんどは、いくつかの州と都市に集まっていました。その州はカリフォルニア、ミシガン、テキサスです。この時期にシリア難民がもっとも多かったアメリカの都市は、サンディエゴとシカゴでした。` },
      { en:`In the United States, most Syrian refugees are Muslim and speak Arabic. These refugees mainly came from refugee camps in Jordan. From 2011 to 2016, about 70% of the refugees were women and children under the age of 14. <mark data-q="4 5">Syrian refugees in the U.S. have become active members of their communities. The children go to school, and some adults have become business owners.</mark> <mark data-q="6">Many new refugees settle in cities with large Syrian immigrant communities. It can be difficult to move to a new country on your own. Having other people who speak your language and understand your culture can be helpful.</mark>`,
        ja:`アメリカでは、シリア難民のほとんどがイスラム教徒で、アラビア語を話します。かれらは主にヨルダンの難民キャンプから来ました。2011年から2016年のあいだ、難民の約70パーセントは女性と14歳未満の子どもでした。アメリカのシリア難民は、地域社会の積極的な一員になっています。子どもたちは学校に通い、大人の中には事業を営む人もいます。新しく来た難民の多くは、シリア移民のコミュニティが大きい都市に落ち着きます。ひとりで新しい国へ移るのは大変なことがあります。同じ言語を話し、自分の文化を理解してくれる人がいることは、助けになるのです。` },
      { en:`<mark data-q="6">Today, Syrian refugees are still settling in the United States and planting roots in American communities.</mark> Resettling in another country as a refugee is not easy, but organizations like the Syrian Community Network provide individualized help for refugee families. <mark data-q="7">They also help refugee families to connect and meet one another.</mark> As Syrian refugees settle in their new communities, they often find ways to share their culture and heritage. Some Syrian refugees work in restaurants or have started small businesses. New York restaurant owner Diaa Alhanoun is one example. Alhanoun fled Syria in 2012. In the U.S., he worked in different restaurants until he helped start a restaurant that shares his Middle Eastern heritage. Even now, he is still sharing Syrian food with new audiences in the United States.`,
        ja:`今日でも、シリア難民はアメリカに落ち着きつづけ、アメリカの地域社会に根を下ろしています。難民として別の国で暮らしを立て直すのはかんたんではありませんが、シリアン・コミュニティ・ネットワークのような団体が、難民の家族一人ひとりに合わせた支援を行っています。また、難民の家族どうしがつながり、出会えるようにも手助けしています。シリア難民は新しい地域に落ち着くにつれて、自分たちの文化と伝統を分かち合う方法を見つけることがよくあります。レストランで働いたり、小さな事業を始めたりする人もいます。ニューヨークのレストラン経営者ディア・アルハヌーンさんは、その一例です。アルハヌーンさんは2012年にシリアを逃れました。アメリカではいくつものレストランで働き、やがて自分の中東の伝統を伝えるレストランの立ち上げに加わりました。今も彼は、アメリカの新しい人たちにシリアの料理を伝えつづけています。` },
      { en:`The Syrian civil war is still happening. Refugees are fleeing the country and searching for safety in other countries. The Syrian refugee crisis is one of the largest displacements of people in this century. <mark data-q="5">Many Syrian refugees are still being displaced, but they are working toward building new lives around the world.</mark>`,
        ja:`シリア内戦は今も続いています。難民は国を逃れ、ほかの国に安全をさがしています。シリア難民の危機は、今世紀でもっとも大規模な人々の移動の一つです。多くのシリア難民が今も故郷を追われていますが、かれらは世界各地で新しい人生を築こうと努力しています。` },

  /* ===== 900-7 ===== */
  {
    title: "The Shortest Path",
    titleJa: "いちばん短い道 ― ナローズをこえる",
    source: "Lexile 900–950 / ノンフィクション（歴史・技術）",
    paras: [
      { en:`What happens when you&rsquo;re standing in one spot, and you want to visit a different spot, but there&rsquo;s water in the way? That&rsquo;s the problem people faced for hundreds of years in the area that is now New York City. In New York City, there is a tidal strait called the Narrows, which connects Upper New York Bay with Lower New York Bay. <mark data-q="1">On one side of the water is Brooklyn. On the other side is Staten Island.</mark> The Narrows is the place where Brooklyn and Staten Island come closest to touching.`,
        ja:`ある場所に立っていて、別の場所へ行きたいのに、途中に水があったらどうしますか。それは、今のニューヨーク市にあたる地域で、何百年ものあいだ人々が直面してきた問題でした。ニューヨーク市には「ナローズ（the Narrows）」とよばれる潮の流れる海峡があり、アッパー・ニューヨーク湾とロワー・ニューヨーク湾をつないでいます。水の一方の側にはブルックリンが、もう一方の側にはスタテン島があります。ナローズは、ブルックリンとスタテン島がもっとも近づいている場所です。` },
      { en:`But the Narrows isn&rsquo;t really so narrow. The water is almost a mile wide, and it&rsquo;s more than 100 feet deep. For a long time that wasn&rsquo;t a problem, because only a few people lived in Brooklyn and Staten Island. When they wanted to talk to each other, they climbed into their boats and sailed across.`,
        ja:`しかしナローズは、名前ほど「狭い（narrow）」わけではありません。水面の幅はほぼ1マイル（約1.6km）あり、深さは100フィート（約30m）以上あります。長いあいだ、それは問題ではありませんでした。ブルックリンとスタテン島には、わずかな人しか住んでいなかったからです。おたがいに話をしたいときは、船に乗って渡っていきました。` },
      { en:`By the 1800s, people were very annoyed with the Narrows. Lots of people had to travel between Staten Island and Brooklyn to get from their homes to their jobs. Taking a boat every time was very slow and expensive, and in bad weather the ferries couldn&rsquo;t sail at all.`,
        ja:`1800年代になるころには、人々はナローズにとてもうんざりしていました。多くの人が、家から職場へ行くためにスタテン島とブルックリンのあいだを移動しなければならなかったのです。毎回船に乗るのはとても時間がかかり、費用も高く、天気が悪い日にはフェリーがまったく出せませんでした。` },
      { en:`<mark data-q="3">In 1888, the Baltimore &amp; Ohio Railroad announced it would dig a tunnel under the water for freight trains. Tunnels cost a lot of money to build, though, so that plan didn&rsquo;t work. Then in the early 1920s, New York&rsquo;s leaders decided to build a tunnel so that subway trains could carry people under the Narrows. They paid workers and started digging the tunnel, but the job was too expensive, and they gave up.</mark>`,
        ja:`1888年、ボルティモア・アンド・オハイオ鉄道が、貨物列車のために水の下にトンネルを掘ると発表しました。しかしトンネルの建設には多額の費用がかかるため、その計画は実現しませんでした。その後1920年代の初め、ニューヨークの指導者たちは、地下鉄がナローズの下を通って人を運べるようにトンネルを造ることを決めました。作業員をやとってトンネルを掘りはじめましたが、その工事はあまりにも費用がかかりすぎ、かれらはあきらめました。` },
      { en:`Other people wanted to cross the Narrows by building a bridge. <mark data-q="6">In 1910 Charles Worthington proposed a bridge that would hang 260 feet above the water. Six years later, an engineer named David Steinman proposed a taller bridge.</mark> But leaders of the military feared the bridges could block big Navy ships entering New York Harbor. So neither bridge was built.`,
        ja:`橋を造ってナローズを渡ろうと考えた人たちもいました。1910年、チャールズ・ワージントンが、水面から260フィート（約79m）の高さにかかる橋を提案しました。その6年後、デイヴィッド・スタインマンという技術者が、さらに高い橋を提案しました。しかし軍の指導者たちは、その橋が大きな海軍の船のニューヨーク港への出入りをさまたげるのではないかと心配しました。そのため、どちらの橋も造られませんでした。` },
      { en:`<mark data-q="4">Finally, after World War II, there were so many people living in New York City that leaders decided Brooklyn and Staten Island needed a direct connection.</mark> <mark data-q="2">Since tunnels were so expensive, they decided to build a bridge.</mark> They hired engineer Othmar Ammann to design it. Ammann decided the bridge should have two separate roadways stacked on top of each other. Both roadways would hang in the air from thick steel cables, supported by two giant steel towers.`,
        ja:`ついに第二次世界大戦のあと、ニューヨーク市の人口があまりに多くなったため、指導者たちはブルックリンとスタテン島に直接のつながりが必要だと判断しました。トンネルはあまりに高くつくので、かれらは橋を造ることに決めました。設計のためにオトマー・アマンという技術者をやといました。アマンは、この橋には2つの車道を上下に重ねるべきだと考えました。どちらの車道も、2本の巨大な鉄の塔にささえられた太い鋼鉄のケーブルから、空中につり下げられることになりました。` },
      { en:`<mark data-q="2 7">Construction took five years, employed 12,000 workers, and cost $320 million.</mark> The bridge was named after the first European who sailed to New York Harbor, Giovanni da Verrazzano. He explored America in 1524. <mark data-q="7">When the Verrazano-Narrows Bridge opened in 1964, it was the longest of its kind in the world.</mark> About 190,000 cars and trucks travel the bridge every day.`,
        ja:`工事には5年かかり、1万2千人の作業員がはたらき、3億2千万ドルの費用がかかりました。この橋は、ニューヨーク港に最初に船で来たヨーロッパ人、ジョヴァンニ・ダ・ヴェラッツァーノにちなんで名づけられました。彼は1524年にアメリカを探検しました。ヴェラザノ・ナローズ橋が1964年に開通したとき、それは同じ種類の橋として世界最長でした。今では毎日およそ19万台の自動車とトラックがこの橋を渡っています。` },
      { en:`Sometimes getting from one place to another is easy. You simply walk there. Other times it can be quite hard. <mark data-q="5">In New York, people tried to solve the problem of crossing the Narrows by sailing boats, digging tunnels, and dreaming of bridges. Figuring out a good solution took 440 years.</mark>`,
        ja:`ある場所から別の場所へ行くのが、かんたんなときもあります。ただ歩いていけばいいのです。けれども、とてもむずかしいこともあります。ニューヨークでは、人々は船で渡り、トンネルを掘り、橋を夢見ることで、ナローズを渡るという問題を解こうとしました。良い解決策にたどり着くまでに、440年かかったのです。` },

      { en:`Archaeologists in northwestern England are thrilled about a rare find. The scientists unearthed a burial site of six Viking men and women. <mark data-q="4">They discovered swords, spears, jewelry, and other artifacts.</mark> The site was excavated, or dug up, after a metal detector user discovered two copper brooches in the ground. The worker informed archaeologists, who believe the site dates back to the 10th century. It is one of only a few Viking cemeteries found in England.`,

    paras: [
      { en:`As a young boy, Abraham Lincoln loved to read books outside his log cabin. Before becoming a lawyer, Lincoln earned money by ferrying passengers across the Ohio River. In 1860, an 11-year-old named Grace Bedell saw a picture of Lincoln and didn&rsquo;t like the way he looked. She thought Lincoln should grow some &ldquo;whiskers.&rdquo;`,
        ja:`少年のころ、エイブラハム・リンカーンは丸太小屋の外で本を読むのが大好きでした。弁護士になる前、リンカーンはオハイオ川を渡る客を船で運んでお金をかせいでいました。1860年、グレース・ベデルという11歳の少女がリンカーンの写真を見て、その見た目が気に入りませんでした。彼女は、リンカーンは「ひげ（whiskers）」をはやすべきだと考えたのです。` },
      { en:`<mark data-q="1 3">Those and other aspects of Lincoln&rsquo;s life are on display at the Abraham Lincoln Presidential Library and Museum. Located in Springfield, Illinois, the museum is almost like an adventure-filled theme park.</mark> <mark data-q="2">Many hands-on exhibits offer interactive experiences. Other displays resemble a science fiction movie. For example, in one exhibit, &ldquo;Ghosts of the Library,&rdquo; the president&rsquo;s &ldquo;ghost&rdquo; mysteriously appears and disappears. A quill then rises from a table and writes in the air&mdash;in Lincoln&rsquo;s handwriting!</mark>`,
        ja:`こうしたことをはじめ、リンカーンの人生のさまざまな面が、エイブラハム・リンカーン大統領図書館・博物館で展示されています。イリノイ州スプリングフィールドにあるこの博物館は、まるで冒険にあふれたテーマパークのようです。手で触れられる展示が多く、来館者が参加できる体験ができます。ほかにも、SF映画のような展示もあります。たとえば「図書館の亡霊たち」という展示では、大統領の「幽霊」が不思議なように現れたり消えたりします。そして羽根ペンがテーブルから浮かび上がり、空中に文字を書くのです——リンカーンの筆跡で！` },
      { en:`In &ldquo;Mrs. Lincoln&rsquo;s Attic,&rdquo; visitors can put on clothing that was fashionable during the first lady&rsquo;s life. Children can also build a miniature log cabin and play with toys from that time period.`,
        ja:`「リンカーン夫人の屋根裏部屋」では、来館者は大統領夫人の時代に流行していた服を着ることができます。子どもたちは小さな丸太小屋を組み立てたり、その時代のおもちゃで遊んだりすることもできます。` },
      { en:`Lincoln has held a special place in American history for nearly 150 years. <mark data-q="4">He was president during the bloodiest conflict in American history, the U.S. Civil War (1861&ndash;1865).</mark>`,
        ja:`リンカーンは150年近くにわたって、アメリカの歴史の中で特別な位置をしめてきました。彼は、アメリカ史上もっとも多くの血が流れた争いである南北戦争（1861〜1865年）のあいだ、大統領でした。` },
      { en:`&ldquo;Lincoln was a fascinating man,&rdquo; Kim Bauer, the museum&rsquo;s curator, told Senior Edition. <mark data-q="3">&ldquo;There is a lot of cool stuff here to see. But we hope that visitors feel connected to Lincoln in ways that last beyond the museum experience.&rdquo;</mark>`,

  /* ===== 950-1 ===== */
  {
    title: "Discoveries in the Deep: Plate Tectonics",
    titleJa: "深海の発見 ― プレートテクトニクス",
    source: "Lexile 950–1000 / ノンフィクション（理科・地球科学）",
    photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Oceanic.Stripe.Magnetic.Anomalies.Scheme.svg/960px-Oceanic.Stripe.Magnetic.Anomalies.Scheme.svg.png",
    photoContain: true,
    photoAlt: "海底が広がるしくみの図",
    photoCap: "海嶺（かいれい）で新しい地殻ができ、左右に広がっていくようす。中央に近い岩ほど新しい。",
    photoCredit: "図: U.S. Geological Survey（パブリックドメイン / Wikimedia Commons）",
    paras: [
      { en:`Earth&rsquo;s surface is always changing. Over time, mountains grow, volcanoes erupt, and oceans form. One way researchers learn about these changes is by studying the ocean floor. The ocean floor can reveal a lot&hellip; if you can reach it! But it is not easy to reach. The water pressure at the ocean floor is dangerous. It can crush or squeeze most objects. But experts have created vehicles called submersibles to explore the ocean floor. Submersibles hold their shape under high water pressure. Humans can even travel in some of them! <mark data-q="1">The French-American Mid-Ocean Undersea Study (FAMOUS) was a research project in the 1970s that used submersibles.</mark> <mark data-q="5">This project helped prove two important theories that help explain how Earth&rsquo;s surface changes: the theories of continental drift and plate tectonics.</mark>`,
        ja:`地球の表面は、つねに変化しています。長い時間のあいだに、山は高くなり、火山は噴火し、海ができます。研究者がこうした変化を知る方法の一つが、海底を調べることです。海底は多くのことを教えてくれます……もしそこまで行けるなら！ しかし、そこへ行くのはかんたんではありません。海底の水圧は危険です。たいていのものは、おしつぶされてしまいます。けれども専門家たちは、海底を探査するために「潜水艇（submersible）」とよばれる乗り物を作りました。潜水艇は高い水圧の中でも形をたもちます。人が乗れるものさえあります！ フランス・アメリカ共同海洋中央海嶺調査（FAMOUS）は、1970年代に潜水艇を使って行われた研究計画でした。この計画は、地球の表面がどう変化するかを説明する2つの重要な理論——大陸移動説とプレートテクトニクス——を証明するのに役立ちました。` },
      { en:`The theory of continental drift came from a geologist named Alfred Wegener. He believed the continents were once connected. Over billions of years, they drifted apart. This theory was the basis for Dr. Patrick M. Hurley&rsquo;s theory of plate tectonics. Dr. Hurley used special technology to figure out the ages of rocks from Earth&rsquo;s crust. By comparing the rocks&rsquo; ages, Hurley could learn about when and how Earth&rsquo;s surface changed. He understood that Earth&rsquo;s crust was made of huge pieces that fit tightly together. These pieces are called tectonic plates. Tectonic plates rest on Earth&rsquo;s mantle, a semi-fluid layer of rock. The heat and pressure from the mantle&rsquo;s currents cause the plates to move.`,
        ja:`大陸移動説は、アルフレート・ヴェーゲナーという地質学者が唱えました。彼は、大陸はかつてひとつにつながっていたと考えました。何十億年ものあいだに、大陸はばらばらに動いていったというのです。この理論が、パトリック・M・ハーリー博士のプレートテクトニクス理論の土台になりました。ハーリー博士は特別な技術を使って、地殻の岩石の年代を調べました。岩石の年代をくらべることで、地球の表面がいつ、どのように変化したのかを知ることができたのです。彼は、地球の地殻が、たがいにぴったり組み合わさった巨大な板でできていることを理解しました。この板を「プレート（tectonic plate）」といいます。プレートは、半分流動している岩の層であるマントルの上にのっています。マントルの流れがもたらす熱と圧力が、プレートを動かしているのです。` },
      { en:`Scientists in Project FAMOUS thought the ocean floor could help prove these theories. That&rsquo;s because, according to the theory of plate tectonics, new ocean floor is created through a process called seafloor spreading. Seafloor spreading happens along large underwater mountain ranges called mid-ocean ridges. Mid-ocean ridges form where two tectonic plates are moving apart from each other. <mark data-q="2 4">Hot magma rises from Earth&rsquo;s mantle to the seafloor between the two plates. It then cools into new crust.</mark> To learn more about seafloor spreading, scientists in Project FAMOUS explored the Mid-Atlantic Ridge, a mid-ocean ridge in the Atlantic Ocean where two tectonic plates meet.`,
        ja:`FAMOUS計画の科学者たちは、海底がこれらの理論を証明する助けになると考えました。プレートテクトニクス理論によれば、新しい海底は「海洋底拡大（seafloor spreading）」とよばれる過程でつくられるからです。海洋底拡大は、「海嶺（mid-ocean ridge）」とよばれる海中の大きな山脈にそって起こります。海嶺は、2つのプレートがたがいにはなれていく場所にできます。地球のマントルから熱いマグマが、2つのプレートのあいだの海底へと上がってきます。そしてそれが冷えて、新しい地殻になるのです。海洋底拡大をもっと知るために、FAMOUS計画の科学者たちは、大西洋にあり2つのプレートが接する海嶺「大西洋中央海嶺」を調査しました。` },
      { en:`The scientists&rsquo; exploration of this ridge took three years of preparation. Engineers prepared a submersible called Alvin for the journey. <mark data-q="3">They replaced Alvin&rsquo;s steel body with titanium. With this stronger material, Alvin could dive much deeper than before&mdash;up to 12,000 feet&mdash;while keeping the scientists inside it safe!</mark>`,
        ja:`この海嶺の探査には、3年間の準備が必要でした。技術者たちは、この航海のためにアルビン号という潜水艇を用意しました。かれらはアルビン号の鋼鉄の船体をチタンに取りかえました。この、より強い素材のおかげで、アルビン号は以前よりずっと深く——1万2千フィート（約3,700m）まで——潜れるようになり、しかも中の科学者たちを安全にたもてたのです！` },
      { en:`Scientists used Alvin, two other submersibles named Cyana and Archimede, and two research ships for their project. Some scientists, like Kathy D. Sullivan, helped record samples and analyze data. Others, like Robert Ballard and Bill Bryan, dove in the submersibles. They navigated the submersibles with sonar technology while collecting samples and observing their surroundings. The submersibles, meanwhile, used technology to take detailed pictures and map the seafloor. Scientists on the research ships tracked the submersibles, shared instructions with the people on the dives, and gathered findings. Throughout the project, scientists worked together to build new technology, analyze samples, and provide support during each dive.`,
        ja:`科学者たちは、アルビン号と、シアナ号・アルシメード号という2つの潜水艇、そして2隻の調査船を使いました。キャシー・D・サリバンのように、試料を記録しデータを分析した科学者もいました。ロバート・バラードやビル・ブライアンのように、潜水艇に乗って潜った人もいました。かれらはソナー技術で潜水艇を進めながら、試料を集め、まわりのようすを観察しました。その間、潜水艇は技術を使ってくわしい写真をとり、海底の地図を作りました。調査船の科学者たちは潜水艇の位置を追い、潜っている人たちに指示を伝え、得られた結果を集めました。計画を通して、科学者たちは協力して新しい技術を作り、試料を分析し、それぞれの潜水を支えました。` },
      { en:`Despite all of this preparation and technology, dives were dangerous. On one dive, Alvin entered a crack in the seafloor. Soon, the scientists onboard realized they were stuck! Alvin&rsquo;s pilot had to retrace his steps carefully to escape. Although there were dangers, scientists took risks to learn more about Earth.`,
        ja:`これほどの準備と技術があっても、潜水は危険でした。ある潜水では、アルビン号が海底のわれ目に入りこみました。まもなく、乗っていた科学者たちは動けなくなったことに気づいたのです！ アルビン号の操縦士は、慎重に来た道をたどって脱出しなければなりませんでした。危険はありましたが、科学者たちは地球についてもっと知るために、危険をおかしたのです。` },
      { en:`<mark data-q="5">Project FAMOUS led to many exciting discoveries.</mark> Scientists collected thousands of photos and rock samples during the dives. For the first time, they saw where magma had reached the seafloor and formed new crust. They proved that the two tectonic plates were moving away from each other at the mid-ocean ridge. <mark data-q="4">By dating the rock samples from near the ridge and further away from it, scientists determined the plates were separating at the rate of about 1 inch per year.</mark> Scientists also mapped hundreds of underwater mountain ranges. Through these dives, scientists uncovered how Earth&rsquo;s surface has been changing throughout its more than 4.5 billion year history.`,
        ja:`FAMOUS計画は、多くのわくわくする発見をもたらしました。科学者たちは潜水のあいだに、何千枚もの写真と岩石の試料を集めました。マグマが海底にとどいて新しい地殻をつくった場所を、初めて目にしたのです。そして、2つのプレートが海嶺のところでたがいにはなれていっていることを証明しました。海嶺の近くと、そこからはなれた場所の岩石の年代を測ることで、科学者たちはプレートが1年に約1インチ（約2.5cm）ずつはなれていると突きとめました。科学者たちはまた、何百もの海底山脈の地図も作りました。これらの潜水を通して、科学者たちは、45億年をこえる歴史の中で地球の表面がどう変化してきたのかを明らかにしたのです。` },
    ],
