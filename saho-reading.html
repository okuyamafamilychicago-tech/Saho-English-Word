  /* ===== 950-2 ===== */
  {
    title: "Earth&rsquo;s Dynamic Machine: Basics of Plate Tectonics",
    titleJa: "地球という動く機械 ― プレートテクトニクスの基本",
    source: "Lexile 950–1000 / ノンフィクション（理科・地球科学）",
    photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/World_tectonic_plate_map_large.png/960px-World_tectonic_plate_map_large.png",
    photoContain: true,
    photoAlt: "世界のプレートの地図",
    photoCap: "地球をおおうプレートと、その境界。地震や火山は、この境界ぞいに集中している。",
    photoCredit: "図: U.S. Geological Survey（パブリックドメイン / Wikimedia Commons）",
    paras: [
      { en:`The lithosphere, the rigid, strong outermost shell of Earth, is broken into ten large plates. The mantle below those plates is solid rock. However, over time &mdash; and at high temperatures and pressures &mdash; the solid rock of the mantle very slowly flows in enormous circular motions called convective currents. <mark data-q="1 5">These currents cause the plates to move, a process geologists describe with the theory of plate tectonics.</mark>`,
        ja:`リソスフェア（岩石圏）は、地球のいちばん外側にある、かたくて強い殻（から）で、10枚の大きなプレートに分かれています。その下のマントルは固い岩です。しかし長い時間をかけて、高い温度と圧力のもとで、マントルの固い岩は「対流（convective current）」とよばれる巨大な円をえがく動きで、ごくゆっくりと流れます。この流れがプレートを動かしており、地質学者はこのしくみをプレートテクトニクス理論で説明します。` },
      { en:`Because of plate tectonics, Earth&rsquo;s surface is in constant motion. Plates separate. They slip past one another. They even collide with each other. Arabia, for instance, pulls away from Africa, opening up the Red Sea. North America creeps away from Europe at about one inch per year &mdash; roughly the rate at which a fingernail grows! Large regions of the Pacific seafloor dive beneath the surrounding continents. And as India pushes north into Asia, it creates the world-famous mountain range called the Himalayas.`,
        ja:`プレートテクトニクスのため、地球の表面はたえず動いています。プレートははなれます。すれちがいます。ぶつかることさえあります。たとえばアラビアはアフリカからはなれていき、紅海を広げています。北アメリカは1年に約1インチずつヨーロッパからはなれています——だいたい爪がのびる速さです！ 太平洋の海底の広い部分は、まわりの大陸の下へもぐりこんでいます。そしてインドが北へアジアへとおしこむことで、世界的に有名なヒマラヤ山脈ができています。` },
      { h:"Plates Moving Apart（プレートがはなれる）",
        en:`Where plates separate, or diverge, ocean basins are created. 85% of Earth&rsquo;s volcanic eruptions occur along divergent boundaries. Many small earthquakes happen along these boundaries at shallow depths (less than 6 miles). <mark data-q="2">As the plates move apart, magma rises from the mantle to fill the empty space. In this way, the plates grow as they separate. By this process, entire ocean basins reform about every 200 million years.</mark>`,
        ja:`プレートがはなれる（発散する）ところでは、海の盆地（かいぼんち）がつくられます。地球の火山噴火の85パーセントは、この「発散境界」にそって起こります。多くの小さな地震も、浅いところ（6マイル未満）でこの境界にそって起きます。プレートがはなれるにつれて、マントルからマグマが上がってきて、あいた空間をうめます。こうしてプレートは、はなれながら成長していきます。この過程によって、海の盆地はまるごと2億年ほどごとに作り直されるのです。` },
      { en:`Most divergent plate boundaries run through the world&rsquo;s oceans. In the Atlantic Ocean, the boundary divides the ocean basin almost exactly in half. This boundary is called a mid-ocean ridge. This term means that there is a range of volcanic mountains running through the bottom of the Atlantic Ocean. This range is part of a worldwide system of such ranges. Together, they form a system of mountain ranges 50,000 miles long.`,
        ja:`発散境界のほとんどは、世界の海の中を走っています。大西洋では、この境界が海の盆地をほぼきっかり半分に分けています。この境界は「海嶺（mid-ocean ridge）」とよばれます。これは、大西洋の底を火山の山脈が走っている、という意味です。この山脈は、世界中に広がる同じような山脈のつながりの一部です。それらを合わせると、全長5万マイル（約8万km）の山脈のつながりになります。` },
      { en:`The lithosphere near the mid-ocean ridges is thin and warm. As the lithosphere moves away from the mid-ocean ridge, it cools and becomes denser. Then it sinks. That means the depth of the ocean is greater farther from a mid-ocean ridge. Mid-ocean ridges are chains of volcanoes sitting on broad rises with vast and deep oceanic plains on both sides.`,
        ja:`海嶺の近くのリソスフェアは、うすくてあたたかいです。リソスフェアが海嶺からはなれていくにつれて、冷えて密度が高くなります。そして沈みます。つまり、海嶺から遠いほど海は深くなるということです。海嶺は、広いもり上がりの上にならぶ火山の連なりで、その両側には広大で深い海底平原が広がっています。` },
      { en:`Divergent boundaries are not always in the middle of ocean basins, however. In a few places, divergent boundaries run right through continents. In those places, the lithosphere stretches and thins. This causes rifts to form in the overlying continental crust. Basaltic magma intrudes into the thinned lithosphere. It then erupts onto the continent, and may melt portions of the continental crust to form other lava types. When such rifts develop long enough, an ocean begins to form. The Red Sea is one such rift. It may eventually grow as large as the Atlantic Ocean!`,
        ja:`ただし、発散境界がいつも海の盆地のまん中にあるとはかぎりません。いくつかの場所では、発散境界が大陸をまっすぐつらぬいています。そうした場所では、リソスフェアが引きのばされてうすくなります。その結果、上にある大陸地殻に「地溝（rift）」ができます。玄武岩質のマグマが、うすくなったリソスフェアに入りこみます。そしてそれが大陸の上に噴き出し、大陸地殻の一部をとかして別の種類の溶岩をつくることもあります。こうした地溝がじゅうぶんに長く育つと、海ができはじめます。紅海は、そうした地溝の一つです。いつかは大西洋くらい大きくなるかもしれません！` },
      { h:"Plates Coming Together（プレートがぶつかる）",
        en:`Where plates collide, or converge, a variety of landforms are created. Such structures include mountains, volcanic island arcs and deep-sea trenches. Convergent plate boundaries produce large and small earthquakes. They build great, explosive volcanoes as well. Exactly what happens at a convergent plate boundary depends on what collides with what.`,
        ja:`プレートがぶつかる（収束する）ところでは、さまざまな地形がつくられます。山、火山の島の弧（こ）、深海の海溝などです。収束境界は、大小の地震を引き起こします。大きくて爆発的な火山もつくります。収束境界で何が起こるかは、何と何がぶつかるかによって決まります。` },
      { en:`Most plate convergence occurs between oceanic and continental plates. When this happens, the colder and denser oceanic plate sinks below the continental plate into the mantle. That process is known as subduction. The boundary where it occurs is called a subduction zone. The subducted plate becomes heated by the mantle, and it loses water, producing an aqueous rich fluid. The fluid moves upward and infiltrates the overlying mantle. This causes the mantle to partially melt, producing a magma that rises up through the mantle and crust to feed volcanoes on the surface. <mark data-q="3">This process usually produces volcanic mountain chains on the overlying continental plate, such as the Andes.</mark> If two oceanic plates converge then the older, colder plate sinks beneath the younger, warmer plate and an arc of islands, like the Aleutians off the coast of Alaska forms on the overlying oceanic plate. Deep-sea trenches are created along convergent margins. That is where the oceanic lithosphere bends into the subduction zone. Trenches are the deepest parts of the ocean. Some have depths in excess of 36,000 feet.`,
        ja:`プレートの収束のほとんどは、海洋プレートと大陸プレートのあいだで起こります。このとき、より冷たく密度の高い海洋プレートが、大陸プレートの下からマントルへと沈みこみます。この過程を「沈み込み（subduction）」といいます。それが起こる境界は「沈み込み帯」とよばれます。沈みこんだプレートはマントルに熱せられ、水を失って、水分の多い流体を生み出します。その流体は上へ移動し、上にあるマントルにしみこみます。これによってマントルの一部がとけ、マグマができて、マントルと地殻を通って上がり、地表の火山に供給されます。この過程はふつう、上にある大陸プレートの上に、アンデスのような火山の山脈をつくります。もし2枚の海洋プレートが収束すると、古くて冷たいほうのプレートが、若くてあたたかいほうの下に沈みこみ、アラスカ沖のアリューシャン列島のような島の弧が、上のプレートの上にできます。収束する縁（へり）にそっては、深海の海溝ができます。海洋のリソスフェアが曲がって沈み込み帯に入っていく場所です。海溝は海のいちばん深いところで、3万6千フィート（約1万1千m）をこえる深さのものもあります。` },
      { en:`A different type of convergent boundary occurs where two continents collide. In this case subduction does not occur, because both continents have crust with a similar density. Neither is forced down into the mantle. Instead, a mountain range forms as one continent overrides the other. This forms an unusually high and thick crust. The Himalayas are the best example of this type of convergent plate boundary. Behind these mountains, the crust of the Tibetan Plateau can be nearly 50 miles thick.`,
        ja:`これとはちがう種類の収束境界は、2つの大陸がぶつかるところに生まれます。この場合、両方の大陸の地殻の密度が似ているため、沈み込みは起こりません。どちらもマントルへおし下げられないのです。そのかわり、一方の大陸がもう一方に乗り上げる形で山脈ができます。こうして、ふつうではないほど高く厚い地殻ができます。ヒマラヤは、この種類の収束境界のもっとも良い例です。この山々の奥では、チベット高原の地殻の厚さが50マイル（約80km）近くにもなります。` },
      { h:"Plates Sliding By（プレートがすれちがう）",
        en:`<mark data-q="4">Where plates slip past each other, they form long furrows in the lithosphere called transform boundaries.</mark> These boundaries are typically hundreds to thousands of miles long. At transform boundaries, crust is not created, nor does it disappear. The plates on either side of the fault may be moving in opposite directions. Or they could be moving in the same direction, but at different speeds.`,
        ja:`プレートがたがいにすれちがうところでは、リソスフェアに長い溝（みぞ）ができ、これを「トランスフォーム境界」といいます。この境界はふつう、数百マイルから数千マイルの長さがあります。トランスフォーム境界では、地殻はつくられも、消えもしません。断層の両側のプレートは、反対向きに動いていることもあれば、同じ向きでも速さがちがうこともあります。` },
      { en:`Many people have heard of the San Andreas Fault in California. Or perhaps they know about the Anatolian Fault that runs through northern Turkey. Both of these transform faults are among the most active earthquake zones on Earth, and both have been struck by devastating earthquakes.`,
        ja:`カリフォルニアのサンアンドレアス断層を聞いたことがある人は多いでしょう。トルコ北部を走るアナトリア断層を知っている人もいるかもしれません。このトランスフォーム断層はどちらも、地球でもっとも地震活動の活発な地帯の一つで、どちらも壊滅的な地震におそわれてきました。` },
      { en:`Where transform faults bend, one of two different structures will form. A pull-apart basin may grow. This type of long, narrow depression collects sediment or fills with water. The Dead Sea between the countries Jordan and Israel is one such basin. <mark data-q="4">On the other hand, plate motion may cause blocks of crust to jam together, creating ridges and folds called transverse ridges.</mark> A good example of this is the Transverse Ranges in California, to the north of Los Angeles. There, a bend in the San Andreas Fault causes the crust to wrinkle.`,
        ja:`トランスフォーム断層が曲がっているところでは、2種類の構造のどちらかができます。一つは「引きはなし盆地」が育つ場合です。この細長いくぼ地は、土砂がたまったり、水で満たされたりします。ヨルダンとイスラエルのあいだにある死海は、そうした盆地の一つです。もう一方では、プレートの動きによって地殻の塊（かたまり）がおし合い、「横ずれ隆起（transverse ridge）」とよばれる尾根やしわができます。その良い例が、ロサンゼルスの北にあるカリフォルニアのトランスバース山脈です。そこでは、サンアンドレアス断層の曲がりが地殻にしわをよせているのです。` },
      { h:"What Plate Tectonics Tells Us（プレートテクトニクスが教えてくれること）",
        en:`<mark data-q="5">The theory of plate tectonics teaches us a lot about Earth. It describes how the mantle and crust of Earth interact with each other. It makes clear why mountains, ocean basins or continents form where they do. It also explains why volcanoes and earthquakes so often appear on plate boundaries.</mark>`,
        ja:`プレートテクトニクス理論は、地球について多くのことを教えてくれます。地球のマントルと地殻がどのようにたがいに影響し合うかを説明します。山や海の盆地、大陸が、なぜその場所にできるのかをはっきりさせます。そして、火山や地震がなぜプレートの境界にこれほど多く現れるのかも説明してくれるのです。` },
    ],

        why:"Overall（全体として）と聞かれたら、細かい例ではなく<b>大きなしくみ</b>を答えます。第1段落の最後の文が、そのまま定義になっています。",

      { stem:"How do divergent boundaries affect the Earth&rsquo;s surface?",

        keyEn:"As the plates move apart, magma rises from the mantle to fill the empty space. In this way, the plates grow as they separate. By this process, entire ocean basins reform about every 200 million years.",
        keyJa:"プレートがはなれるにつれ、マントルからマグマが上がってあいた空間をうめる。こうしてプレートははなれながら成長する。この過程で、海の盆地は2億年ほどごとに作り直される。",
        why:"3種類の境界が出てくる文章では、<b>どの境界の話か</b>を必ず確認します。この問題は divergent（発散＝はなれる）。「Plates Moving Apart」の節をさがせば答えがあります。",
        others:[

      { stem:"What conclusion can you draw from this evidence?",
        quote:`&ldquo;Most plate convergence occurs between oceanic and continental plates. When this happens, the colder and denser oceanic plate sinks below the continental plate into the mantle&hellip; This causes the mantle to partially melt, producing a magma that rises up through the mantle and crust to feed volcanoes on the surface. This process usually produces volcanic mountain chains on the overlying continental plate, such as the Andes.&rdquo;`,
        choices:[

        keyJa:"プレートの収束のほとんどは、海洋プレートと大陸プレートのあいだで起こる。…この過程はふつう、火山の山脈をつくる。",
        why:"2つの言葉をつなぎます。<b>Most</b>（ほとんど）の収束はこの型 ＋ この型は <b>usually</b>（ふつう）火山の山脈をつくる。だから「ほとんどの収束境界が火山の山脈をつくる」と言えます。",

      { stem:"Pretend you found an area of ridges and folds in Earth&rsquo;s crust. What kind of boundary would you expect to find there?",
        choices:["continental boundary","convergent boundary","divergent boundary","transform boundary"],

        why:"ridges and folds（尾根としわ）という言葉を本文でさがすと、「Plates Sliding By（トランスフォーム境界）」の節にあります。<b>問題文の言葉をそのまま本文で探す</b>のが確実です。",

  /* ===== 950-3 ===== */
  {
    title: "Condoleezza Rice, Politician and Educator",
    titleJa: "コンドリーザ・ライス ― 政治家であり教育者",
    source: "Lexile 950–1000 / ノンフィクション（伝記・社会）",
    paras: [
      { en:`Condoleezza Rice has been an important person in U.S. politics for decades. Rice is an educator and politician. <mark data-q="1 4 5">She was also the first African American woman to become Secretary of State.</mark> The Secretary of State helps carry out the President&rsquo;s foreign policy&mdash;the ways that a country interacts with other nations.`,
        ja:`コンドリーザ・ライスは、何十年にもわたってアメリカの政治で重要な役割をになってきた人物です。ライスは教育者であり、政治家です。そして、アフリカ系アメリカ人の女性として初めて国務長官になった人でもあります。国務長官は、大統領の外交政策——その国がほかの国々とどう関わるか——を実行する手助けをします。` },
      { en:`Rice&rsquo;s determination to succeed was clear at an early age. Rice grew up in Birmingham, Alabama in the 1950s. At that time, the Alabama government strictly imposed Jim Crow laws. This system of laws enforced racial segregation. For example, certain laws ordered separate sections for white and Black people on buses and restaurants. Many people fought against these &ldquo;separate but equal&rdquo; policies throughout the 1950s and 1960s. Rice said, &ldquo;As a child, I was a part of another great awakening&hellip;the Civil Rights Movement unfolded in my hometown of Birmingham, Alabama, and finally expanded the meaning of &lsquo;We the people&rsquo; to encompass people like me.&rdquo;`,
        ja:`成功しようという彼女の強い意志は、幼いころからはっきりしていました。ライスは1950年代のアラバマ州バーミングハムで育ちました。当時、アラバマ州政府はジム・クロウ法を厳しく課していました。この法律のしくみは人種隔離を強制するものでした。たとえば、バスやレストランで白人と黒人の席を分けるよう命じる法律がありました。多くの人が1950年代から1960年代を通して、この「分離すれども平等」という方針と闘いました。ライスはこう語っています。「子どものころ、わたしはもう一つの大きな目覚めの一部でした……公民権運動が故郷のアラバマ州バーミングハムで広がり、ついに『われら人民（We the people）』という言葉の意味が、わたしのような人間までふくむように広がったのです。」` },
      { en:`Even though she saw and experienced discrimination growing up, Rice was focused on accomplishing her goals. She studied hard in school. <mark data-q="2">At the young age of 15, she attended the University of Denver. Although she first wanted to become a concert pianist, she decided to study international relations.</mark> After graduating from college, she got her masters and doctorate degrees. <mark data-q="2">Rice started teaching at Stanford University in 1981.</mark> While she was teaching at Stanford, she got the attention of President George H.W. Bush&rsquo;s staff. She became an important advisor to the President, especially regarding Soviet and Eastern European affairs.`,
        ja:`育つ過程で差別を見て、また経験しながらも、ライスは自分の目標を達成することに集中していました。学校では熱心に勉強しました。わずか15歳でデンバー大学に入学します。はじめはコンサートピアニストになりたいと考えていましたが、国際関係を学ぶことに決めました。大学を卒業したあと、修士号と博士号を取りました。ライスは1981年にスタンフォード大学で教えはじめます。スタンフォードで教えているあいだに、ジョージ・H・W・ブッシュ大統領のスタッフの目にとまりました。そして、とくにソビエトと東ヨーロッパの問題について、大統領の重要な助言者となったのです。` },
      { en:`In 1999, Rice left Stanford to become the foreign policy advisor to George W. Bush, the son of George H.W. Bush, during his presidential campaign. <mark data-q="2">When Bush became president, she was appointed his National Security Advisor.</mark> <mark data-q="4">She became the first Black woman to hold this position.</mark> The Advisor works closely with the President on matters related to national security and foreign relations. Rice&rsquo;s role became especially important when a terrorist attack struck the U.S. on September 11th, 2001. <mark data-q="3">After the attack, Rice helped shape the United States&rsquo; response. That response included a military invasion of Iraq in 2003, a major decision which Rice supported.</mark> The Iraq War lasted from 2003 to 2011 and caused hundreds of thousands of deaths. <mark data-q="3">The decision to invade Iraq was controversial and became a significant part of Rice&rsquo;s legacy.</mark>`,
        ja:`1999年、ライスはスタンフォードを離れ、ジョージ・H・W・ブッシュの息子であるジョージ・W・ブッシュの大統領選挙運動で外交政策の助言者となりました。ブッシュが大統領になると、彼女は国家安全保障担当補佐官に任命されます。黒人女性として初めてこの職についた人になりました。補佐官は、国家の安全保障や外交に関わる問題について、大統領と密接に働きます。2001年9月11日にアメリカがテロ攻撃を受けたとき、ライスの役割はとりわけ重要になりました。攻撃のあと、ライスはアメリカの対応をかたちづくる手助けをしました。その対応には2003年のイラクへの軍事侵攻がふくまれ、ライスはこの大きな決定を支持しました。イラク戦争は2003年から2011年まで続き、数十万人の死者を出しました。イラク侵攻の決定は賛否が分かれるもので、ライスの経歴の中で重要な部分となりました。` },
      { en:`George Bush appointed Rice as Secretary of State in 2005. During her time as Secretary of State, Rice championed the idea of &ldquo;Transformational Diplomacy.&rdquo; She encouraged U.S. diplomats to take a more active role in expanding democracy. Diplomats live in foreign countries. They help manage aspects of international relations in the countries where they are located, such as peace deals, human rights issues, and trade. They also help negotiate treaties. Rice worked to move U.S. diplomats to areas with social and political turmoil. Her goal was to address human rights issues, including disease and human trafficking. She also required U.S. diplomats to become fluent in at least two languages other than English. <mark data-q="6">She encouraged diplomats to advise local governments on how to strengthen their court and border security systems. She believed bolstering these systems helped young democracies develop.</mark>`,
        ja:`ジョージ・ブッシュは2005年、ライスを国務長官に任命しました。国務長官の在任中、ライスは「変革の外交（Transformational Diplomacy）」という考えをおし進めました。彼女はアメリカの外交官たちに、民主主義を広げる役割をもっと積極的に果たすようはたらきかけました。外交官は外国に住みます。そして、平和の合意、人権の問題、貿易など、その国での国際関係のさまざまな面を扱う手助けをします。条約の交渉も助けます。ライスは、社会的・政治的に混乱している地域へアメリカの外交官を移そうとしました。その目的は、病気や人身売買をふくむ人権の問題に取り組むことでした。彼女はまた、アメリカの外交官に、英語以外の言語を少なくとも2つ流ちょうに話せるようになることを求めました。さらに、外交官たちに、その国の政府へ裁判所や国境警備のしくみを強くする方法を助言するようすすめました。こうしたしくみを支えることが、若い民主主義国家の発展を助けると考えていたのです。` },
      { en:`Rice also worked hard to negotiate peace and trade deals. <mark data-q="7">One of her big successes was signing an agreement between the United States and India.</mark> This agreement allowed the exchange of nuclear technology between the two countries. It served as a foundation for an important partnership between India and the U.S. After her time as Secretary of State, Rice returned to teaching at Stanford. As of 2024, she continues to teach students and work on issues like education reform. She has also written many books and shares her knowledge through speaking engagements around the country.`,
        ja:`ライスはまた、平和や貿易の合意をまとめるためにも力をつくしました。大きな成果の一つが、アメリカとインドのあいだの協定に署名したことです。この協定によって、両国のあいだで原子力技術のやり取りができるようになりました。それは、インドとアメリカの重要な協力関係の土台となりました。国務長官の任期を終えたあと、ライスはスタンフォードでの教職にもどりました。2024年現在も、学生を教え、教育改革などの課題に取り組みつづけています。多くの本も書き、全国での講演を通して自分の知識を分かち合っています。` },
    ],

  {
    title: "Cleaning Up Ocean Pollution: Collecting &ldquo;Ghost&rdquo; Fishing Gear",
    titleJa: "海の汚染をかたづける ― 「ゴーストギア」を回収する",
    source: "Lexile 950–1000 / ノンフィクション（環境）",
    paras: [
      { en:`Did you know more than 10% of the pollution in the ocean is old fishing gear? Some of it got lost by accident or mistake. Some of it might have been thrown overboard from boats on purpose. <mark data-q="1">Some people call these items &ldquo;ghost gear.&rdquo;</mark> <mark data-q="4">And the ghost gear is causing big problems for wildlife in the ocean.</mark> From California to Florida to Maine, people are worried about how ghost gear is hurting ocean wildlife.`,
        ja:`海の汚染の10パーセント以上が、古い漁具だと知っていましたか。事故やまちがいで失われたものもあります。船からわざと海に投げすてられたものもあるかもしれません。こうしたものを「ゴーストギア（ghost gear＝幽霊の漁具）」とよぶ人もいます。そしてこのゴーストギアが、海の野生生物に大きな問題を引き起こしているのです。カリフォルニアからフロリダ、メインまで、人々はゴーストギアが海の生き物を傷つけていることを心配しています。` },
      { en:`When ghost gear ends up in the ocean, it sometimes keeps fishing. <mark data-q="2">Old lobster and crab cages, fishing nets, and fishing lines trap helpless animals that can&rsquo;t escape. They often die.</mark> Plus, lost equipment is often worth a lot of money. When it ends up in the ocean, millions of dollars are wasted. Sometimes the old equipment can even damage boats. <mark data-q="5">But across the United States, organizations are working to help solve the ghost gear problem!</mark>`,
        ja:`ゴーストギアが海に残されると、それはときどき「漁をしつづけて」しまいます。古いロブストーやカニのかご、漁のあみ、釣り糸が、逃げられない動物をとらえてしまうのです。そうした動物はしばしば死んでしまいます。しかも、失われた漁具は高価なことが多いのです。それが海に沈んでしまうと、何百万ドルもがむだになります。古い漁具が船をこわすこともあります。けれどもアメリカ各地で、団体がこのゴーストギア問題を解決しようと取り組んでいます！` },
      { en:`In Maine, there is an organization that is focused on making a healthy ecosystem for lobsters and people. <mark data-q="3">This organization, the Gulf of Maine Lobster Foundation, held special events for cleaning up lost lobster crates. Over a single weekend, more than 100 volunteers on boats searched for and collected lost and broken lobster cages.</mark> The volunteers collected more than 3,000 traps! They returned 1,000 traps to their owners. They recycled 21 tons of steel from the non-useable traps. The money they earned from recycling was put back into the project. Now, they&rsquo;re working on collecting old fishing nets from professional fishers. They hope to recycle 280 tons of fishing gear!`,
        ja:`メイン州には、ロブスターと人の両方にとって健康な生態系をつくることに力を入れている団体があります。この団体「ガルフ・オブ・メイン・ロブスター財団」は、失われたロブスターかごをかたづける特別なイベントを開きました。たった1回の週末で、100人以上のボランティアが船に乗り、失われたりこわれたりしたロブスターかごをさがして集めました。ボランティアは3,000個以上のかごを集めたのです！ そのうち1,000個は持ち主に返しました。使えないかごからは21トンの鉄をリサイクルしました。リサイクルで得たお金は、この活動にもどされました。今かれらは、プロの漁師から古い漁網を集める活動に取り組んでいます。280トンの漁具をリサイクルすることを目指しています！` },
      { en:`In California, a group called Wildcoast is also getting ready to collect old fishing nets. They are setting up five different places to collect ghost fishing gear. The people at Wildcoast think they will be able to recycle 60 tons of unused fishing nets.`,
        ja:`カリフォルニアでは、ワイルドコーストという団体も古い漁網を集める準備を進めています。ゴーストギアを回収する場所を5か所つくっているところです。ワイルドコーストの人たちは、使われていない漁網を60トンリサイクルできると考えています。` },
      { en:`<mark data-q="3">A group of fishers and a research center from Mississippi State University got together to work on the ocean pollution problem in Louisiana. They placed giant recycling bins at popular harbors for people to turn in old fishing gear. People who register with the program will receive a cash reward for all the gear they turn in.</mark>`,
        ja:`ルイジアナ州では、漁師たちのグループとミシシッピ州立大学の研究センターが協力して、海の汚染問題に取り組んでいます。人々が古い漁具を持ちこめるように、人の多い港に大きなリサイクル用の箱を置きました。この取り組みに登録した人は、持ちこんだ漁具の分だけ現金の報酬を受け取れます。` },
      { en:`<mark data-q="3 5">These projects will encourage people to stop throwing old fishing gear in the water. The best way to protect the ocean from old fishing gear is to prevent the equipment from getting left behind. Programs like these also help to clean up what was already left behind.</mark> <mark data-q="4">In this way, people can help protect the ocean and wildlife.</mark>`,
        ja:`こうした取り組みは、人々が古い漁具を海に捨てるのをやめるようにうながします。古い漁具から海を守るいちばん良い方法は、そもそも漁具が置き去りにされるのをふせぐことです。そしてこのような活動は、すでに置き去りにされたものをかたづける助けにもなります。こうして人々は、海と野生生物を守る力になれるのです。` },

  {
    title: "Olympic Legend, Jackie Joyner-Kersee",
    titleJa: "オリンピックの伝説 ― ジャッキー・ジョイナー＝カーシー",
    source: "Lexile 950–1000 / ノンフィクション（伝記・スポーツ）",
    paras: [
      { en:`<mark data-q="1">Jackie Joyner-Kersee was no regular track and field athlete.</mark> She had an extremely impressive athletic record! In fact, she was named the Greatest Female Athlete of the 20th Century by Sports Illustrated for Women. <mark data-q="1 5">Born on March 3, 1962, Joyner-Kersee grew up to be one of the greatest track and field athletes of all time.</mark>`,
        ja:`ジャッキー・ジョイナー＝カーシーは、ふつうの陸上選手ではありませんでした。おどろくほどすばらしい競技成績を残したのです！ 実際、彼女は『スポーツ・イラストレイテッド・フォー・ウィメン』誌によって「20世紀最高の女性アスリート」に選ばれました。1962年3月3日に生まれたジョイナー＝カーシーは、史上最高の陸上選手の一人へと成長しました。` },
      { en:`Joyner-Kersee&rsquo;s success story started early. As a teen, Joyner-Kersee won many track, basketball, and volleyball championships. <mark data-q="2">She went to the University of California, Los Angeles, to pursue her athletic goals, and at age 19 began training for the Olympics.</mark>`,
        ja:`ジョイナー＝カーシーの成功の物語は、早くから始まりました。10代のころ、彼女は陸上、バスケットボール、バレーボールで多くの選手権に勝ちました。競技の目標を追いかけるためにカリフォルニア大学ロサンゼルス校（UCLA）へ進み、19歳でオリンピックに向けたトレーニングを始めたのです。` },
      { en:`She worked to be the best in the seven-part track and field event called the heptathlon. The heptathlon tests many skills that include running, throwing, and jumping. Athletes earn points for each event, and the player with the most combined points wins the heptathlon. One of Joyner-Kersee&rsquo;s specialties was the long jump. The long jump combines speed, strength, and skill. A long jump athlete runs up to a line called the foul line and then leaps as far as possible into a sand pit. The athlete who leaps the farthest wins, but the athlete must jump before running past the foul line.`,
        ja:`彼女は、七種競技（ヘプタスロン）とよばれる7つの種目からなる陸上競技で最高になろうと努力しました。七種競技は、走る・投げる・跳ぶをふくむ多くの力をためします。選手は種目ごとに得点をかせぎ、合計得点がもっとも高い選手が勝ちます。ジョイナー＝カーシーの得意種目の一つが走り幅跳びでした。走り幅跳びは、速さと力と技術を組み合わせた種目です。選手はファウルラインとよばれる線まで助走し、そこから砂場へできるだけ遠くへ跳びます。いちばん遠くへ跳んだ選手が勝ちますが、ファウルラインをこえる前に踏み切らなければなりません。` },
      { en:`Jackie Joyner-Kersee experienced many successes at the Olympics. At her first Olympic Games, in 1984, she won a silver medal in the heptathlon. She was just warming up, it seemed. <mark data-q="3">At her second Olympic games, in 1988, Joyner-Kersee broke the world record in the heptathlon by earning 7,291 points. At the same Olympics, she became the first American woman to win a gold medal in the long jump. In 1992, she broke another record by winning two Olympic heptathlons in a row, and gained a bronze medal in the long jump.</mark> In 1996, at the Olympic games in Atlanta, Georgia, Joyner-Kersee took home yet another bronze medal in the long jump. This was the last Olympics she competed in.`,
        ja:`ジャッキー・ジョイナー＝カーシーは、オリンピックで多くの成功を経験しました。1984年の初めてのオリンピックでは、七種競技で銀メダルを取りました。彼女はまだ「準備運動」の段階だったようです。1988年の2回目のオリンピックでは、7,291点を取って七種競技の世界記録を破りました。同じ大会で、走り幅跳びで金メダルを取った初めてのアメリカ人女性にもなりました。1992年には、オリンピックの七種競技を2大会連続で制するという別の記録も打ち立て、走り幅跳びでは銅メダルを得ました。1996年、ジョージア州アトランタでのオリンピックでは、走り幅跳びでさらにもう一つ銅メダルを持ち帰りました。これが彼女が出場した最後のオリンピックとなりました。` },
      { en:`Decades have passed since Jackie Joyner-Kersee set the world record in the heptathlon at her second Olympic Games. Many athletes have competed in heptathlons, but no other athlete has beaten her heptathlon record.`,
        ja:`ジャッキー・ジョイナー＝カーシーが2回目のオリンピックで七種競技の世界記録を出してから、何十年もたちました。多くの選手が七種競技に挑んできましたが、彼女の記録を破った選手はまだ一人もいません。` },
      { en:`<mark data-q="4 5">While Jackie Joyner-Kersee was training and competing in the Olympics, she also created her own foundation to encourage children to play sports and contribute to their own communities.</mark> Since her last Olympic games, she has continued in using her athletic fame to inspire and change her community. Joyner-Kersee has dedicated her life after competing in track and field to supporting important causes. <mark data-q="6">She has helped provide resources for children to reach their academic and athletic goals. She also has helped provide resources to many families. One of these resources is internet access. More than four million Americans have gained internet access because of her help.</mark> <mark data-q="7">Joyner-Kersee also goes around the United States to speak about the importance of children&rsquo;s education, racial equality, and women&rsquo;s rights.</mark>`,
        ja:`ジャッキー・ジョイナー＝カーシーは、トレーニングをしてオリンピックで戦っているあいだにも、子どもたちがスポーツをし、自分の地域に貢献できるようにはげますための財団を自分でつくりました。最後のオリンピックのあとも、競技で得た名声を使って地域をはげまし、変えつづけています。ジョイナー＝カーシーは、陸上競技を退いてからの人生を、大切な活動を支えることにささげてきました。子どもたちが学業と競技の目標に届くための支援を提供する手助けをしてきました。多くの家庭への支援も助けています。その支援の一つがインターネット接続です。彼女の助けによって、400万人以上のアメリカ人がインターネットを使えるようになりました。ジョイナー＝カーシーはまた、子どもの教育、人種の平等、女性の権利の大切さについて話すため、アメリカ各地をまわっています。` },

    paras: [
      { en:`Robert Peary was a civil engineer for the United States Navy. <mark data-q="1">Peary is famous for his claim of being the first person to visit the geographic North Pole.</mark>`,
        ja:`ロバート・ピアリーは、アメリカ海軍の土木技師でした。ピアリーは、地理上の北極点をおとずれた最初の人物だと主張したことで有名です。` },
      { en:`He was granted several leaves of absence from the Navy for Arctic exploration. On his first journey, he traveled for about 100 miles over the Greenland ice sheet. His next few trips took him into the northern areas of Greenland. He used dog sleds to travel across the ice!`,
        ja:`彼は北極探検のために、海軍から何度か長期の休暇を認められました。最初の旅では、グリーンランドの氷床の上を約100マイル（約160km）進みました。その後の数回の旅では、グリーンランドの北部へ入っていきました。氷の上を移動するのに犬ぞりを使ったのです！` },
      { en:`<mark data-q="3">Peary made several attempts to reach the North Pole. His first two attempts were unsuccessful because he encountered difficulties with ice conditions.</mark> In 1908 Peary set out on his third attempt for the North Pole. <mark data-q="2">He first traveled on the S.S. Roosevelt, a steamship with three masts. The S.S. Roosevelt was specially designed for Arctic waters. When the S.S. Roosevelt went as far north as it could, Peary continued his travel mostly by dog sled.</mark>`,
        ja:`ピアリーは北極点に到達しようと何度も挑戦しました。最初の2回の挑戦は、氷の状態による困難にぶつかって失敗しました。1908年、ピアリーは3回目の北極点への挑戦に出発しました。彼はまず、3本のマストを持つ蒸気船S.S.ルーズベルト号で進みました。S.S.ルーズベルト号は北極の海のために特別に設計された船でした。ルーズベルト号が行けるかぎり北まで進んだあと、ピアリーはおもに犬ぞりで旅を続けました。` },
      { en:`<mark data-q="4">Peary was accompanied by his assistant, African American Matthew Henson. He also brought along 24 people, 133 dogs, and 19 sledges to help him on his travel toward the North Pole.</mark> After Peary and his team got closer to the North Pole, Peary sent most of his team back. <mark data-q="4">Matthew Henson and four Inuit men continued with Peary. The Inuit are the people native to the land near the North Pole, and they helped Peary by driving dog sleds, building igloos for rest, and looking after the supplies.</mark>`,

      { en:`<mark data-q="1 5">Robert Peary claims to have reached the North Pole on April 6, 1909. Since then, his claim has never been accepted by everyone. We may never know for sure if Peary actually reached the North Pole.</mark>`,

      { en:`As the wheels on the bus go round and round, many kids are being bounced around. <mark data-q="3">A study showed that about 17,000 accidents occur on school buses each year.</mark> <mark data-q="1">Injuries range from cuts to broken bones.</mark>`,
        ja:`バスの車輪がぐるぐる回るあいだに、多くの子どもが車内でゆさぶられています。ある調査によると、スクールバスでは毎年およそ1万7千件の事故が起きています。けがの程度は、切り傷から骨折までさまざまです。` },
      { en:`<mark data-q="1">Researchers report that crashes aren&rsquo;t causing all of those injuries. Kids are sometimes thrown around when buses stop and turn.</mark> <mark data-q="2">Some people say those injuries could be prevented if school buses had seat belts.</mark>`,
        ja:`研究者の報告によると、そうしたけがのすべてが衝突事故によるものではありません。バスが止まったり曲がったりするときに、子どもが投げ出されることがあるのです。スクールバスにシートベルトがあれば、そうしたけがはふせげるはずだと言う人もいます。` },
      { en:`Traffic safety experts say seat belts would not reduce, or lower, injuries. Not all injuries occur when kids are in their seats. <mark data-q="1">Nearly one-quarter of injuries occur when kids are getting on and off the buses.</mark>`,
        ja:`交通安全の専門家たちは、シートベルトがあってもけがは減らない（reduce＝少なくする）と言います。すべてのけがが、子どもが座席にいるときに起きているわけではないからです。けがのおよそ4分の1は、子どもがバスに乗り降りするときに起きています。` },
      { en:`<mark data-q="4">School buses are still the safest way for kids to ride to school, says the National School Transportation Association.</mark> The number of kids injured is only a small fraction of the nearly 24 million kids who travel on school buses each year.`,
        ja:`それでもスクールバスは、子どもが学校へ行く方法としてもっとも安全だ、と全米スクール輸送協会は述べています。けがをする子どもの数は、毎年スクールバスで通学するおよそ2400万人の子どものうちの、ごくわずかな割合にすぎません。` },
    ],

  {
    title: "Can the Amazon Be Saved?",
    titleJa: "アマゾンは守れるか",
    source: "Lexile 900–950 / ノンフィクション（環境）",
    paras: [
      { en:`The Amazon rain forest is disappearing at an alarming rate.`,
        ja:`アマゾンの熱帯雨林が、おそろしい速さで消えつつあります。` },
      { h:"Paradise Lost?（失われる楽園？）",
        en:`Bright-colored toucans and other exotic birds fly among the rain forest. Emerald tree boas curl up on branches to stalk prey. Endangered jaguars slink through the thick brush in search of food. These are just a few of the thousands of animals that call the Amazon rain forest home. A tropical rain forest is warm and has heavy rainfall. The Amazon, in South America, is the largest rain forest in the world.`,
        ja:`あざやかな色のオオハシやそのほかの珍しい鳥たちが、熱帯雨林の中を飛びます。エメラルドツリーボアは枝の上でとぐろを巻き、獲物をねらいます。絶滅の危機にあるジャガーは、えさをさがして深いやぶをそっと進みます。これらは、アマゾンの熱帯雨林を家とする何千もの動物のうちの、ほんの一部にすぎません。熱帯雨林はあたたかく、雨がたくさん降ります。南アメリカにあるアマゾンは、世界最大の熱帯雨林です。` },
      { en:`Yet the Amazon&rsquo;s future is grim. Farmers have been rapidly destroying this lush landscape. <mark data-q="1">Deforestation has been a huge problem in the Amazon since the 1960s. Deforestation occurs when farmers and loggers cut down trees to make room for farms, homes, and roads.</mark> Until the early 2000s, scientists thought the rain forest was losing about 5,800 square miles a year. However, using the latest satellite technology, researchers have discovered that the Amazon is shrinking at about twice that rate.`,
        ja:`しかしアマゾンの未来は暗いものです。農民たちがこの緑ゆたかな風景を、急速に破壊してきました。森林破壊（deforestation）は、1960年代からアマゾンで大きな問題になっています。森林破壊とは、農民や木こりが、農地や住宅、道路のための場所をつくろうとして木を切りたおすことです。2000年代の初めまで、科学者たちは熱帯雨林が1年に約5,800平方マイル失われていると考えていました。しかし最新の人工衛星技術を使った結果、アマゾンはその約2倍の速さで縮んでいることが分かったのです。` },
      { h:"Cause for Concern（心配すべき理由）",
        en:`Why should most people in the world worry about a rain forest that is thousands of miles from where they live? Deforestation reduces the rain forest&rsquo;s biodiversity, or the variety of plants and animals in a particular area. The Amazon is one of the richest areas of the world in animal and plant diversity. It is home to the biggest flower in the world, a bird-eating spider, and a monkey about the size of a toothbrush.`,
        ja:`自分の住む場所から何千マイルもはなれた熱帯雨林のことを、なぜ世界中の人が心配しなければならないのでしょう。森林破壊は、その熱帯雨林の生物多様性（biodiversity）＝ある地域にいる植物や動物の種類の豊かさを減らしてしまいます。アマゾンは、動植物の多様性という点で世界でもっとも豊かな地域の一つです。世界最大の花、鳥を食べるクモ、歯ブラシほどの大きさのサルも、ここに住んでいます。` },
      { en:`<mark data-q="2">Scientists estimate that they have identified only a small number of all species that live in the rain forest. As loggers and farmers destroy the forest, animals and plants may become extinct before they are discovered.</mark> Deforestation affects people too. Many of the foods, spices, and medicines we need come from the rain forest.`,
        ja:`科学者たちは、熱帯雨林にすむすべての種のうち、ごく一部しか確認できていないと推定しています。木こりや農民が森を破壊するにつれて、動植物は発見される前に絶滅してしまうかもしれません。森林破壊は人にも影響します。わたしたちに必要な食べ物、香辛料、薬の多くは、熱帯雨林から来ているのです。` },
      { en:`The Amazon is often called the &ldquo;lungs of the world.&rdquo; Its trees clean the air by taking in carbon dioxide and releasing oxygen. Too much carbon dioxide in the air is harmful to humans. Carbon dioxide is a greenhouse gas. Greenhouse gases trap the sun&rsquo;s heat close to the earth. <mark data-q="4">Without the trees in the rain forest, the earth&rsquo;s climate would become much hotter.</mark>`,
        ja:`アマゾンはよく「世界の肺」とよばれます。その木々は二酸化炭素を取りこみ、酸素を出すことで空気をきれいにします。空気中の二酸化炭素が多すぎると、人間にとって害になります。二酸化炭素は温室効果ガスです。温室効果ガスは、太陽の熱を地球の近くにとじこめます。熱帯雨林の木々がなくなれば、地球の気候はずっと暑くなってしまうでしょう。` },
      { h:"Fixing the Problem（問題を解決する）",
        en:`Stopping the destruction of the rain forest is not an easy task. Brazil&rsquo;s government created two national parks in the Amazon rain forest. The government&rsquo;s efforts placed 3.7 million acres of rain forest off-limits for development. The protected area is more than twice the size of the state of Maryland.`,
        ja:`熱帯雨林の破壊を止めるのは、かんたんな仕事ではありません。ブラジル政府はアマゾンの熱帯雨林に2つの国立公園をつくりました。政府の取り組みによって、370万エーカーの熱帯雨林が開発禁止となりました。その保護区域は、メリーランド州の2倍以上の広さです。` },
      { en:`Others think that this is not enough. <mark data-q="3">&ldquo;The single most important factor contributing to forest loss is population growth in Brazil,&rdquo; scientist Jim Bowyer of the University of Michigan told Weekly Reader. &ldquo;People make the forest their home. All these people need land for farming and wood for heat and cooking. They are looking for a way to survive.&rdquo;</mark>`,
        ja:`これでは足りないと考える人たちもいます。「森林が失われるいちばん大きな要因は、ブラジルの人口増加です」と、ミシガン大学の科学者ジム・ボウヤー氏はウィークリー・リーダー誌に語りました。「人々は森を自分の住まいにします。その人たちはみな、農業のための土地と、暖をとったり料理をしたりするための木を必要としています。かれらは生きのびる方法をさがしているのです。」` },
      { en:`Scientists estimate that if deforestation continues at its current rate, the rain forest may survive only another 40 to 50 years. <mark data-q="3">&ldquo;We need to address the real causes of deforestation, like poverty and population growth,&rdquo; says Bowyer. &ldquo;Solutions need to involve the very people who destroy the forest.&rdquo;</mark>`,
        ja:`科学者たちは、森林破壊が今の速さで続けば、熱帯雨林はあと40年から50年しかもたないかもしれないと推定しています。「わたしたちは、貧困や人口増加のような、森林破壊の本当の原因に取り組む必要があります」とボウヤー氏は言います。「解決策には、森を破壊しているまさにその人たち自身が関わらなければならないのです。」` },
    ],

  {
    title: "White Out",
    titleJa: "白く消えていく ― コウモリを襲う白鼻症候群",
    source: "Lexile 950–1000 / ノンフィクション（理科・生物）",
    photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Little_Brown_Bat_with_White_Nose_Syndrome_%28Greeley_Mine%2C_cropped%29.jpg/960px-Little_Brown_Bat_with_White_Nose_Syndrome_%28Greeley_Mine%2C_cropped%29.jpg",
    photoAlt: "白鼻症候群にかかったコウモリ",
    photoCap: "鼻に白い菌がついたコウモリ。この見た目から「白鼻症候群（white-nose syndrome）」と名づけられた。",
    photoCredit: "写真: U.S. Fish and Wildlife Service（パブリックドメイン / Wikimedia Commons）",
    paras: [
      { en:`Scientists have learned a great deal about the disease since its discovery. There&rsquo;s much they don&rsquo;t understand, though, including how to stop it. &ldquo;There&rsquo;s a lot of work still being done,&rdquo; says Tom Kunz, a bat expert at Boston University. Time is of the essence. <mark data-q="1">More than a million and perhaps as many as 2 million bats have died already, Kunz says. &ldquo;We&rsquo;ve got a disease that is causing one of the most precipitous declines of bats in American history,&rdquo; he says.</mark>`,
        ja:`この病気が見つかってから、科学者たちは多くのことを学んできました。それでも、どうすれば止められるのかをふくめ、分かっていないことがたくさんあります。「まだやるべき仕事がたくさんあります」と、ボストン大学のコウモリ研究者トム・クンツは言います。時間との勝負です。すでに100万匹以上、もしかすると200万匹ものコウモリが死んだ、とクンツは言います。「アメリカの歴史の中でもっとも急激なコウモリの減少を引き起こしている病気なのです」と彼は語ります。` },
      { h:"Skin and Bone（皮と骨だけになって）",
        en:`<mark data-q="1">White-nose syndrome is named for the white fungus that typically appears on the muzzles and other body parts of infected bats.</mark> Initially, scientists weren&rsquo;t sure whether the fungus caused the disease. Many suspected it was an opportunistic infection&mdash;a secondary infection that gains a foothold in an animal already weakened by another illness. Researchers haven&rsquo;t found any other infectious agents in the sickened bats. So most now agree that the fungus is the likely cause of WNS. The fungus is new to science, and researchers have named it Geomyces destructans.`,
        ja:`白鼻症候群（white-nose syndrome、WNS）という名前は、感染したコウモリの鼻先などの体の部分に決まって現れる白い菌（きん）にちなんでいます。はじめ、科学者たちはこの菌が病気の原因かどうか確信が持てませんでした。多くの人は「日和見（ひよりみ）感染」——ほかの病気ですでに弱った動物に取りつく二次的な感染——ではないかと疑っていました。しかし研究者たちは、病気になったコウモリからほかの病原体を見つけられませんでした。そこで今では、この菌がWNSの原因である可能性が高いと、ほとんどの人が考えています。この菌は科学にとって新しいもので、研究者たちは Geomyces destructans と名づけました。` },
      { en:`&ldquo;We still haven&rsquo;t determined how the bats are actually dying from the fungal infection,&rdquo; says Jeremy Coleman, the national WNS coordinator for the U.S. Fish and Wildlife Service. <mark data-q="3">One clue: Infected bats seem to run out of fat in the middle of winter. Bats need that fat to nourish themselves until spring. Without it, they die.</mark>`,
        ja:`「この菌の感染で、コウモリが実際にどうやって死んでいるのかは、まだ突きとめられていません」と、アメリカ魚類野生生物局のWNS全国調整官ジェレミー・コールマンは言います。手がかりが一つあります。感染したコウモリは、冬のなかばで体の脂肪を使い切ってしまうようなのです。コウモリは春まで自分の体を養うために、その脂肪を必要とします。それがなければ、死んでしまいます。` },
      { en:`<mark data-q="3">Normally, hibernating bats wake briefly once or twice a month, Kunz says. Infected bats arouse from hibernation every four or five days. They then expend valuable calories flying around.</mark> That activity probably explains why the bats are so skinny. &ldquo;Every arousal burns up body fat,&rdquo; he says.`,
        ja:`ふつう、冬眠中のコウモリは月に1〜2回、短く目をさますだけだ、とクンツは言います。ところが感染したコウモリは、4〜5日ごとに冬眠から目をさましてしまいます。そして飛び回って、貴重なカロリーを使ってしまうのです。この動きが、コウモリがひどくやせている理由を説明していると考えられます。「目をさますたびに体の脂肪が燃えてしまうのです」と彼は言います。` },
      { en:`What makes infected bats wake up so often? Some scientists have proposed an &ldquo;itch-and-scratch hypothesis.&rdquo; Just as people scratch their toes like crazy when they have athlete&rsquo;s foot, a common fungal infection, bats might feel a similar itch when the fungus invades their skin. The uncomfortable sensation could be rousing them from their winter naps.`,
        ja:`感染したコウモリは、なぜそんなに何度も目をさますのでしょう。「かゆみ・ひっかき仮説」を唱える科学者もいます。よくある菌の感染である水虫になった人が足の指を狂ったようにかくのと同じで、菌が皮ふに入りこむとコウモリも似たかゆみを感じるのかもしれません。その不快な感覚が、冬の眠りから彼らを起こしているのかもしれないのです。` },
      { en:`Then again, the bats might just be thirsty. One of skin&rsquo;s many jobs is preventing water loss. In bats, healthy wing membranes help maintain a water balance in the body. <mark data-q="2 7">The fungus damages bat wings, causing small holes and scar tissue to appear in the membranes. Bats could be losing excess water through their injured wings, some scientists propose. The animals might be waking up to find a drink and avoid dehydration (an excessive loss of fluid).</mark>`,
        ja:`いや、コウモリはただのどがかわいているだけなのかもしれません。皮ふの多くの役割の一つが、水分が失われるのをふせぐことです。コウモリの場合、健康な翼の膜（まく）が体の水分のつり合いをたもつのを助けています。この菌はコウモリの翼を傷つけ、膜に小さな穴やかさぶたのような組織をつくります。傷ついた翼から、コウモリは余分な水分を失っているのではないか、と考える科学者もいます。コウモリは水を飲みに行き、脱水（体の水分を失いすぎること）をさけるために目をさましているのかもしれません。` },
      { h:"Fungus Among Us（わたしたちの中の菌）",
        en:`The fungus G. destructans is itself puzzling. Hundreds of other species of Geomyces fungi live in U.S. caves but don&rsquo;t bother bats at all, says Coleman. And though G. destructans has been found in caves in Europe, bats there appear unaffected by it. Do European bats possess a gene that makes them resistant to infection? Is European G. destructans somehow different from the strain found in the U.S.? &ldquo;We&rsquo;re trying to figure out why this fungus is so devastating for [North American] bats,&rdquo; Coleman says.`,
        ja:`G. destructans という菌そのものも、なぞに満ちています。アメリカのほら穴には何百種類ものほかの Geomyces 属の菌がすんでいますが、コウモリにはまったく害をあたえない、とコールマンは言います。そして G. destructans はヨーロッパのほら穴でも見つかっていますが、そこのコウモリは影響を受けていないように見えます。ヨーロッパのコウモリは、感染に強くなる遺伝子を持っているのでしょうか。それとも、ヨーロッパの G. destructans はアメリカのものと何かちがうのでしょうか。「この菌がなぜ北アメリカのコウモリにこれほど壊滅的なのかを、突きとめようとしています」とコールマンは言います。` },
      { en:`Meantime, the best hope for North America&rsquo;s bats seems to be preventing any further spread of WNS. The disease is thought to spread from bat to bat, says Coleman, but researchers haven&rsquo;t ruled out the possibility that people are spreading it too. The Fish and Wildlife Service has played it safe and closed a number of caves to human visitors. &ldquo;We&rsquo;re trying to prevent people from moving the fungus faster than the bats can,&rdquo; Coleman says.`,
        ja:`いっぽうで、北アメリカのコウモリにとって最大の希望は、WNSがこれ以上広がるのをふせぐことのようです。この病気はコウモリからコウモリへ広がると考えられている、とコールマンは言いますが、人間も広げている可能性を研究者たちは否定していません。魚類野生生物局は安全を取って、多くのほら穴を人の立ち入り禁止にしました。「人が、コウモリよりも速く菌を運んでしまうのをふせごうとしているのです」とコールマンは言います。` },
      { en:`So far, WNS has been found in nine bat species, including two endangered ones: the Indiana bat and the gray bat. <mark data-q="6">As more states and more species are affected, the impact of WNS could snowball. Bats play an important role in their ecosystems.</mark> <mark data-q="4">A bat can eat half its weight in insects every night. A female bat that&rsquo;s lactating (feeding her pups with milk) can gulp down twice that amount. Insect-eating bats in the U.S. save farmers at least $3 billion a year by swallowing bugs that would otherwise damage crops, according to an analysis in the journal Science.</mark> WNS is just beginning to move into the Midwest, the nation&rsquo;s agricultural heartland. &ldquo;As it continues to spread, we could see an agricultural impact,&rdquo; Coleman says.`,
        ja:`これまでにWNSは9種類のコウモリで見つかっており、その中にはインディアナコウモリとハイイロホオヒゲコウモリという2つの絶滅危惧種もふくまれます。影響を受ける州と種がふえるにつれて、WNSの影響は雪だるま式に大きくなるかもしれません。コウモリは生態系の中で重要な役割を果たしています。1匹のコウモリは、毎晩自分の体重の半分もの虫を食べられます。授乳中（子どもに乳をあたえている）のメスは、その2倍を飲みこむこともできます。『サイエンス』誌の分析によれば、アメリカの虫を食べるコウモリは、放っておけば作物を荒らす虫を食べることで、農家に少なくとも年間30億ドルを節約させています。WNSは今、この国の農業の中心地である中西部に入りはじめたところです。「広がりつづければ、農業への影響が出るかもしれません」とコールマンは言います。` },
      { en:`<mark data-q="5">Scientists across the country are hard at work studying the bats, the fungus, and potential ways to manage the disease.</mark> &ldquo;Bats provide a real value,&rdquo; Kunz says. &ldquo;This is a massive loss.&rdquo;`,
        ja:`国じゅうの科学者たちが、コウモリと菌、そしてこの病気に対処できそうな方法を、けんめいに研究しています。「コウモリには本当の価値があります」とクンツは言います。「これは途方もない損失なのです。」` },

  /* ===== 950-10 ===== */
  {
    title: "Old-Time Operations",
    titleJa: "大むかしの手術",
    source: "Lexile 950–1000 / ノンフィクション（歴史・科学）",
    paras: [
      { en:`Ancient people drilled teeth and skulls to stay healthy. If you think going to the dentist is scary now, imagine what it must have been like 9,000 years ago!`,
        ja:`大むかしの人々は、健康でいるために歯や頭がい骨に穴を開けていました。今の歯医者がこわいと思うなら、9,000年前がどんなだったか想像してみてください！` },
      { en:`<mark data-q="3">Archaeologists (scientists who study the remains of ancient human cultures) dug up bones that old from a graveyard in Pakistan. They found 11 teeth with holes drilled into them, even though ancient people didn&rsquo;t have metal tools.</mark> Instead, Stone Age dentists used stone drills to make holes in the teeth. The scientists who found the teeth think the holes were drilled to remove decay (rotten parts). They say that the patients may have had fillings in the holes and that the fillings probably fell out when the teeth were buried.`,
        ja:`考古学者（大むかしの人間の文化ののこりを研究する科学者）が、パキスタンの墓地からそれほど古い骨を掘り出しました。金属の道具がなかった時代なのに、穴を開けられた11本の歯が見つかったのです。石器時代の歯医者は、そのかわりに石のきりを使って歯に穴を開けていました。この歯を見つけた科学者たちは、虫歯（decay＝くさった部分）を取りのぞくために穴が開けられたと考えています。患者の穴にはつめ物がされていて、歯が埋められたときにそのつめ物がぬけ落ちたのだろう、と言っています。` },
      { h:"Shocking Surgeries（おどろきの手術）",
        en:`This discovery is the oldest proof of dentistry in ancient civilizations. But people have practiced many kinds of medicine for thousands of years. <mark data-q="4">The oldest-known surgery is trepanation. The operation involves drilling a hole into a person&rsquo;s skull!</mark> It&rsquo;s not always clear why this operation was performed, but it may have helped some people survive accidents. When a person hurts his or her head, the skull sometimes fills up with fluid. Drilling a hole allows the fluid to drain so the brain can heal.`,
        ja:`この発見は、古代文明での歯科治療のもっとも古い証拠です。しかし人々は、何千年ものあいだにさまざまな医療を行ってきました。知られているかぎりもっとも古い手術は「穿頭術（trepanation）」です。この手術は、人の頭がい骨に穴を開けるというものです！ なぜこの手術が行われたのかは、いつもはっきりしているわけではありませんが、事故から人が生きのびるのを助けたのかもしれません。頭を傷つけると、頭がい骨の中に液体がたまることがあります。穴を開ければその液体が外へ出て、脳が回復できるのです。` },
      { en:`Egyptians are famous for mummifying dead bodies, but they performed operations on living patients too. Scientists discovered the mummy of a woman who had lost a toe when she was alive. She had a wooden toe sewn to her foot and scientists believe she used it for years before she died. Ancient Indians also performed surgery. They completed the first known nose job thousands of years ago. At the time, criminals were punished by having their noses cut off. Luckily for them, doctors designed a way to make new noses&mdash;from the skin of the people&rsquo;s foreheads! Today people have more tricks and tools than ever to keep them alive. Doctors have been practicing their work for thousands of years.`,
        ja:`エジプト人は死体をミイラにすることで有名ですが、生きている患者への手術も行っていました。科学者たちは、生きているあいだに足の指を失った女性のミイラを発見しました。彼女の足には木の指がぬいつけられていて、亡くなるまで何年もそれを使っていたと科学者たちは考えています。古代インドの人々も手術を行いました。知られているかぎり最初の「鼻の手術」を、何千年も前になしとげたのです。当時、罪をおかした人は鼻を切り落とされる罰を受けました。さいわいなことに、医師たちは新しい鼻を作る方法を考え出しました——その人の額（ひたい）の皮ふから！ 今日、人々は生きのびるための技と道具を、かつてないほど多く持っています。医師たちは何千年も前から、その仕事を続けてきたのです。` },
      { h:"Making Medical History（医学の歴史をつくった「はじめて」）",
        en:`<mark data-q="1">1670 &mdash; Anton von Leeuwenhoek designed a microscope and viewed human blood cells.</mark><br>1796 &mdash; Edward Jenner invented a vaccination for a deadly disease called smallpox.<br>1829 &mdash; A doctor in England transferred blood (a transfusion) from one person to another.<br>1860s &mdash; Doctors discovered that many diseases are caused by germs, so they began washing their hands and equipment.<br><mark data-q="2">1895 &mdash; A German physicist discovered X-rays.</mark><br>1899 &mdash; Chemists began selling aspirin, a medicine made from a chemical in the bark of a willow tree.<br>1928 &mdash; Alexander Fleming discovered penicillin, the first antibiotic (a medicine that kills bacteria).<br>1954 &mdash; A doctor in Boston completed the first organ transplant, transferring a kidney from one identical twin to another.<br><mark data-q="2">1972 &mdash; The CAT scan machine was patented. Doctors use CAT scans to take detailed 3-D pictures of the inside of the body.</mark><br>1982 &mdash; Doctors saved a man named Barney Clark by giving him an artificial heart. Clark survived with the heart for 112 days.`,
        ja:`1670年 ― アントン・ファン・レーウェンフックが顕微鏡を設計し、人間の血液の細胞を見た。<br>1796年 ― エドワード・ジェンナーが、天然痘という命にかかわる病気のワクチン接種を考案した。<br>1829年 ― イングランドの医師が、ある人から別の人へ血液を移した（輸血）。<br>1860年代 ― 多くの病気が細菌によって起こると医師たちが発見し、手や器具を洗いはじめた。<br>1895年 ― ドイツの物理学者がX線を発見した。<br>1899年 ― 化学者たちがアスピリンを売りはじめた。ヤナギの樹皮にふくまれる化学物質から作られた薬である。<br>1928年 ― アレクサンダー・フレミングがペニシリンを発見した。細菌を殺す薬である最初の抗生物質だ。<br>1954年 ― ボストンの医師が最初の臓器移植をなしとげ、一卵性双生児の一方からもう一方へ腎臓を移した。<br>1972年 ― CTスキャン装置の特許が取られた。医師はCTスキャンで体の内部の細かい3D画像をとる。<br>1982年 ― 医師たちがバーニー・クラークという男性に人工心臓を入れて命を救った。クラークはその心臓で112日間生きた。` },

    paras: [
      { en:`<mark data-q="3">Frank Knight&rsquo;s job stinks&mdash;really. Knight&rsquo;s job is making scents for stores and museums to trigger old memories and make exhibits seem more real.</mark>`,

      { en:`<mark data-q="1">Recently, the Natural History Museum in London asked Knight&rsquo;s company, Dale Air, to try to re-create the breath of one of the fiercest dinosaurs to have roamed Earth&mdash;Tyrannosaurus rex.</mark> <mark data-q="2 3">&ldquo;Basically, the bigger the creatures, the smellier they were,&rdquo; Knight said.</mark>`,
        ja:`最近、ロンドンの自然史博物館が、ナイトの会社デール・エアに、地球を歩き回ったもっともどうもうな恐竜の一つ——ティラノサウルス・レックス——の息を再現できないかと依頼しました。「基本的に、生き物は大きいほどくさかったのです」とナイトは言いました。` },
      { en:`<mark data-q="4">To get the stench right, Knight talked to paleontologists, scientists who study the remains of dinosaurs and other ancient animals and plants.</mark> <mark data-q="2">They decided that a carnivorous (meat-eating) dino like T. rex would have had open sores from fighting and from rotting meat stuck in its razor-sharp teeth. Smelly!</mark>`,
        ja:`その悪臭を正しく再現するために、ナイトは古生物学者——恐竜やそのほかの古代の動植物ののこりを研究する科学者——に話を聞きました。かれらは、T. レックスのような肉食（carnivorous）の恐竜には、けんかでできた開いた傷や、かみそりのように鋭い歯にはさまって腐った肉があっただろうと結論しました。くさいはずです！` },
      { en:`Knight&rsquo;s company was more than up to the task of stinking up the place. It has re-created smells such as burned wood and the aroma of a grandmother&rsquo;s kitchen to enhance the experience of visiting a museum. Still, trying to re-create the scent of T. rex was a big job.`,
        ja:`ナイトの会社は、その場をくさくするという仕事をこなす力が十分にありました。これまでにも、焼けた木のにおいや、おばあちゃんの台所の香りなどを再現して、博物館を訪れる体験をより豊かにしてきました。それでも、T. レックスのにおいを再現しようとするのは大仕事でした。` },
      { en:`<mark data-q="1">Knight has successfully created a totally disgusting scent. How disgusting? It is so smelly that museum visitors have raised a stink. As a result, museum officials decided to make the display smell like a swamp instead!</mark>`,

  /* ===== 1000-3 ===== */
  {
    title: "The Problem Solvers",
    titleJa: "問題を解決する人たち",
    source: "Lexile 1000–1050 / ノンフィクション（考え方・技術）",
    paras: [
      { en:`Problems&mdash;whether they are scientific, medical, creative, culinary, personal, communal, or any other type&mdash;require solutions. <mark data-q="1 5">The best way to find a solution that fits is to first research the problem.</mark> Find out as much as you can about what the difficulty is. Say, for instance, the issue is architectural in nature. A boutique hotel was built several years ago on a beach, facing the sea, in Los Angeles, California. Its owners have pointed out that the building is not handicap-accessible and would like for you to make it so. To begin, you will need to study the hotel, look into what makes a physical space handicap-accessible, and understand what the owners&rsquo; needs are. Where exactly is the hotel? How big is it, how is it laid out and how many floors? Is it important that only the lobby be made wheelchair-accessible, or will handicapped guests also need to get from the hotel down to the sand? How much money do the hotel&rsquo;s owners have to spend on solving this problem?`,
        ja:`問題は——科学の問題であれ、医療、創作、料理、個人的なこと、地域のこと、そのほかどんな種類であれ——解決策を必要とします。ぴったり合う解決策を見つけるいちばん良い方法は、まずその問題を調べることです。何が困りごとなのかを、できるかぎり明らかにしましょう。たとえば、その課題が建築に関わるものだとします。数年前、カリフォルニア州ロサンゼルスの海に面した浜辺に、小さな高級ホテルが建てられました。持ち主たちは、この建物が障がいのある人にとって使いやすくない（handicap-accessible ではない）と指摘し、そうしてほしいとあなたに求めています。まず、あなたはそのホテルを調べ、どうすれば空間が障がいのある人に使いやすくなるのかを調べ、持ち主が何を必要としているのかを理解する必要があります。ホテルは正確にはどこにあるのか。どれくらいの大きさで、どんな間取りで、何階建てなのか。ロビーだけ車いすで入れればよいのか、それとも障がいのある客がホテルから砂浜まで下りる必要もあるのか。持ち主はこの問題の解決にどれくらいのお金をかけられるのか。` },
      { en:`Once you properly comprehend the problem and all of the details surrounding it, it&rsquo;s time to brainstorm. No matter what stage you find yourself in, it is usually helpful to share proposed ideas with your peers. More heads are better than one, and shared ideas can lead to improved projects and designs. Now imagine that just the hotel&rsquo;s lobby and rooms need to be made wheelchair-friendly. How might this be accomplished? You will have discovered, from your research, that a surface that is firm and level will allow for wheelchair traffic, and will also have traction for walkers. <mark data-q="2">The easiest way to make an entry accessible is to install a ramp.</mark> According to the U.S. Department of Justice, a ramp should use the least possible slope and be at least 36 inches wide to accommodate a person in a wheelchair. To prevent slipping, you might consider handrails and curbs. What about the front door leading to the lobby? Ensuring the outdoor entrance is protected from elements like rain will make it safer.`,
        ja:`問題と、それを取りまく細かい事情をきちんと理解できたら、次はブレインストーミング（考えを出し合うこと）の番です。どの段階にいても、思いついた案を仲間と分かち合うことはたいてい役に立ちます。頭は一つより多いほうがよく、共有された考えは、より良い計画や設計につながります。ここでは、ホテルのロビーと客室だけを車いすで使いやすくすればよいと考えてみましょう。どうすれば実現できるでしょうか。調べていく中で、かたくて平らな面なら車いすが通れ、歩行器を使う人にとっても滑りにくいと分かるはずです。入口を使いやすくするいちばんかんたんな方法は、スロープ（ramp）を設けることです。アメリカ司法省によれば、スロープはできるかぎりゆるやかな傾きにし、車いすの人が通れるよう少なくとも幅36インチ（約91cm）は必要です。滑るのをふせぐために、手すりや縁の立ち上がりも考えるとよいでしょう。ロビーへ続く正面のドアはどうでしょう。屋外の入口が雨などから守られているようにすれば、より安全になります。` },
      { en:`Clearing paths of travel through doorways and hallways is also important. If there are potted plants on the ground, one solution could be to replace them with hanging plants. In the individual guestrooms, it could be helpful to install adjustable rods in closets, and certify that light switches are low enough and electrical outlets high enough. Throw rugs have the ability to move around, so it would be wise to go with other flooring choices instead. Showers are easier to roll into than baths for those with limited mobility. How about installing a seat or a hand-held showerhead? Grab-bars and a taller toilet would work to make the bathroom more accessible, too.`,
        ja:`出入口や廊下の通り道を空けておくことも大切です。床に鉢植えが置いてあるなら、つり下げ式の植物に替えるのも一つの解決策でしょう。それぞれの客室では、クローゼットに高さを変えられるポールを取りつけたり、照明のスイッチが十分に低く、コンセントが十分に高い位置にあることを確かめたりすると役立ちます。敷きラグは動いてしまうことがあるので、別の床材を選ぶのが賢明です。体を動かしにくい人にとっては、浴そうよりシャワーのほうが入りやすいものです。座る台や、手に持てるシャワーヘッドを取りつけてはどうでしょう。手すりや高めの便器も、浴室を使いやすくするのに役立ちます。` },
      { en:`<mark data-q="3">It is crucial to come up with more than one solution.</mark> Now that you&rsquo;ve thought of as many answers as possible to the problem at hand, <mark data-q="4">test them and adjust them according to your test results.</mark> There are countless ways to evaluate solutions with respect to how well they meet the particular criteria and constraints of an issue. Maybe the best way to test out a ramp would be to build one or more prototypes. Then you can experiment with different materials and location. <mark data-q="4">Tests are usually designed to identify points of failure.</mark> In other words, you will want to submit your ramp to tough conditions to see if it will be successful even under these circumstances. Try out a particularly heavy wheelchair. Will your prototype support it? Try out a manual chair, an electric mobility scooter and a walker. Will a permanent access ramp work better, or is a fold-up portable ramp more suitable in this situation? How does wood hold up in comparison to aluminum or concrete?`,
        ja:`解決策を一つ以上考え出すことが、とても大切です。目の前の問題に対してできるだけ多くの答えを考えたら、それらをためし、ためした結果に応じて調整します。ある課題の条件や制約にどれだけよく合っているかという点から解決策を評価する方法は、数えきれないほどあります。スロープをためすいちばん良い方法は、試作品（prototype）を一つ以上つくることかもしれません。そうすれば、材料や場所を変えて実験できます。テストはふつう、うまくいかない点（points of failure）を見つけるために設計されます。つまり、厳しい条件の中でもうまくいくかどうかを見るために、スロープをきびしい状況に置いてみるのです。とくに重い車いすでためしてみましょう。あなたの試作品はそれを支えられますか。手動の車いす、電動の移動用スクーター、歩行器でもためします。固定式のスロープのほうがよいのか、それともこの場合は折りたたみ式の持ち運べるスロープのほうが向いているのか。木材はアルミやコンクリートとくらべて、どれくらいもつのでしょう。` },
      { en:`Sometimes, different solutions can be combined to create a result that is better than any of the ones that have come before it. Perhaps during the brainstorming process, your peers suggested two equally good solutions to the problem at hand. One proposed using a ramp to help handicapped guests bypass the stairs. The other proposed using a stairlift, a mobilized chair with the ability to transport people right to the top of the steps. It is possible that the best solution will be some combination of these two suggestions. How might both of these ideas work together? Maybe the least costly solution would be to eliminate the ramp and the stairlift, and simply clear a path to an elevator. Test it out. Is the route leading to the elevator wide enough for a wheelchair? Is the elevator itself wide enough? <mark data-q="6">When thinking up solutions and performing tests, you must take into consideration a whole variety of variables&mdash;in this case, factors like cost, efficiency and safety levels.</mark>`,
        ja:`ときには、ちがう解決策を組み合わせることで、それまでのどれよりも良い結果が生まれることもあります。ブレインストーミングの途中で、仲間が同じくらい良い解決策を2つ出したとしましょう。一方は、階段を通らずにすむようスロープを使う案。もう一方は、階段の上まで人を運べる電動いす「階段昇降機（stairlift）」を使う案です。いちばん良い解決策は、この2つの案を組み合わせたものかもしれません。どうすれば両方の考えを生かせるでしょう。もしかすると、いちばん費用のかからない解決策は、スロープも昇降機もやめて、エレベーターまでの通り道を空けることかもしれません。ためしてみましょう。エレベーターまでの経路は、車いすが通れるだけの幅がありますか。エレベーターそのものは十分な広さですか。解決策を考えたりテストをしたりするときには、さまざまな変わりうる要素（variables）——この場合なら費用、効率、安全の水準といった要因——を考えに入れなければなりません。` },
      { en:`<mark data-q="5">These same steps can be applied to any kind of problem, from simple science experiments in the classroom to big, real-world difficulties.</mark> For people who have practiced problem solving, running through these stages comes as second-nature. Picture an experienced cook in a kitchen, readying herself to bake a chocolate cake for a birthday party. The birthday party begins in an hour or two, so she will need to work quickly! Suddenly, the cook realizes that she has run out of butter and the recipe calls for some. What to do? She does not have time to run to the grocery store. <mark data-q="3">After rapidly examining the problem and brainstorming, she might come up with a list of butter substitutes. Some common ones are canola oil, olive oil, margarine and shortening.</mark> Sometimes butter can also be replaced with pureed fruits, like apples, bananas or dates.`,
        ja:`これと同じ手順は、教室での簡単な理科の実験から、現実世界の大きな困難まで、どんな種類の問題にも当てはめられます。問題解決の訓練を積んだ人にとって、こうした段階をたどることは、ごく自然な習慣になっています。台所にいるベテランの料理人が、誕生日パーティーのためにチョコレートケーキを焼こうとしているところを思いうかべてください。パーティーは1〜2時間後に始まるので、急いで作業しなければなりません！ とつぜん、料理人はバターを切らしていることに気づきます。レシピにはバターが必要だと書いてあるのに。どうしましょう。買い物に行く時間はありません。すばやく問題を調べ、案を出したあと、彼女はバターの代わりになるものの一覧を思いつくかもしれません。よく使われるのは、キャノーラ油、オリーブ油、マーガリン、ショートニングなどです。りんご、バナナ、デーツなどの果物をすりつぶしたもので、バターの代わりにすることもあります。` },
      { en:`By performing various tests, the cook will be able to determine which butter stand-in will work best in her cake. From her research, she will understand that the process of creaming butter together with granulated sugar helps achieve the rich, fluffy, spongy texture that is so important to cakes, cupcakes and other baked goods. In her tests, she will likely discover that because of this &ldquo;creaming&rdquo; step, using oil on its own, instead of butter in this case, will not yield the results she is looking for. It could be that combining two of the butter substitutes would be best. Maybe the cook only has margarine with salt in it, when the recipe calls for unsalted butter. The solution here could be to use the margarine, but to then reduce the amount of salt added to the mixture. The cook will need to consider several variables here, including taste and texture.`,
        ja:`いろいろなテストをすることで、料理人はどのバターの代わりが自分のケーキにいちばん合うかを見きわめられます。調べていく中で、バターとグラニュー糖をすり混ぜる（クリーミングする）工程が、ケーキやカップケーキなどの焼き菓子にとても大切な、こくのあるふんわりした食感を生むことを理解するでしょう。テストの中で彼女は、この「クリーミング」の工程があるために、この場合バターの代わりに油だけを使っても求める結果は得られない、と気づくはずです。バターの代わりになるものを2つ組み合わせるのがいちばんかもしれません。レシピが食塩不使用のバターを求めているのに、料理人の手元には塩入りのマーガリンしかない、ということもあるでしょう。その場合の解決策は、そのマーガリンを使い、生地に加える塩の量を減らすことかもしれません。ここでも料理人は、味や食感といったいくつかの変わりうる要素を考えに入れる必要があります。` },
      { en:`Next time you have a problem to solve, think back to these guidelines. What is the quickest way to get to school when you&rsquo;ve missed the bus? How to block the light from coming through your windows when you don&rsquo;t have any curtains or blinds? How to make a plant grow in a room that&rsquo;s too dark? What happens when you&rsquo;d like to play a game with six people, but only have enough parts for five? <mark data-q="5 7">The keys are these: research the issue, brainstorm alone or with peers, list a variety of solutions, test those solutions, modify them on the basis of your tests, and then select the best one.</mark> In most instances, this should lead you to an answer that works well. Just follow our cook&rsquo;s lead. She must have landed on the right solution because the kitchen smells great!`,
        ja:`次に解決すべき問題にぶつかったときは、この手引きを思い出してください。バスに乗りおくれたとき、学校へ行くいちばん速い方法は何でしょう。カーテンもブラインドもないとき、窓から入る光をどうさえぎりますか。暗すぎる部屋で、どうすれば植物を育てられるでしょう。6人でゲームをしたいのに、部品が5人分しかないときはどうしますか。大事なのはこれです。問題を調べ、一人で、または仲間と案を出し、いろいろな解決策を並べ、それらをためし、テストにもとづいて手直しし、そのうえで最良のものを選ぶ。たいていの場合、これでうまくいく答えにたどり着けるはずです。あの料理人のやり方にならいましょう。台所からとても良いにおいがしているのですから、彼女はきっと正しい解決策にたどり着いたのです！` },

    paras: [
      { en:`Two eyes peer through the thick leaves and branches of a tree. The eyes belong to a 400-pound lowland gorilla that lives in Africa&rsquo;s Congo Basin. That is home to the second-largest rain forest in the world. <mark data-q="3">The world&rsquo;s entire population of lowland gorillas lives in the Congo Basin. Those creatures are among many species of endangered animals living in the rain forest.</mark>`,
        ja:`二つの目が、木の厚い葉と枝のあいだからのぞいています。その目は、アフリカのコンゴ盆地にすむ体重400ポンド（約180kg）のローランドゴリラのものです。コンゴ盆地は、世界で2番目に大きな熱帯雨林があるところです。世界のローランドゴリラの全個体が、このコンゴ盆地に生息しています。この生き物は、熱帯雨林にすむ多くの絶滅危惧種の一つです。` },
      { en:`<mark data-q="3">Scientists warn that more than half of the forest could disappear within 50 years. Some people illegally cut down trees and hunt wildlife to sell as meat. Many rain forest animals, like the lowland gorilla, are endangered because of illegal hunting.</mark>`,
        ja:`科学者たちは、この森の半分以上が50年以内に消えてしまうかもしれないと警告しています。木を違法に切りたおし、肉として売るために野生動物をかる人たちがいるのです。ローランドゴリラのように、熱帯雨林の多くの動物が、違法な狩りのせいで絶滅の危機にあります。` },
      { h:"Hope for the Future（未来への希望）",
        en:`Help is on the way for the rain forest and the animals that live there. The presidents of 10 African countries recently signed a treaty, or agreement, to protect the rain forest. &ldquo;The treaty is important because it shows that the governments are committed to protecting the Congo Basin,&rdquo; World Wildlife Fund (WWF) scientist Richard Carroll told Weekly Reader. The WWF is a group that protects endangered animals and habitats. The WWF is helping governments in Africa to stop illegal hunting and to set up parks and protected areas for animals. &ldquo;This gives us a great opportunity to save the forest,&rdquo; said Carroll.`,
        ja:`熱帯雨林と、そこにすむ動物たちへの助けが動き出しています。アフリカ10か国の大統領が最近、熱帯雨林を守るための条約（treaty＝取り決め）に署名しました。「この条約が重要なのは、各国の政府がコンゴ盆地を守ることに本気で取り組んでいると示しているからです」と、世界自然保護基金（WWF）の科学者リチャード・キャロルはウィークリー・リーダー誌に語りました。WWFは絶滅危惧種と生息地を守る団体です。WWFはアフリカの政府が違法な狩りをやめさせ、動物のための公園や保護区をつくるのを助けています。「これは森を救う大きな機会をあたえてくれます」とキャロルは言いました。` },
      { h:"Did You Know?（知っていましたか）",
        en:`<mark data-q="4">&bull; Gorillas are plant eaters. They also like to eat insects, such as termites and ants. An adult male eats about 40 pounds of food each day!<br>&bull; Young gorillas love to play. They learn new skills by imitating adult gorillas.<br>&bull; Each gorilla has a unique nose print. Scientists can identify a gorilla by the shape of its nose.</mark>`,
        ja:`・ゴリラは植物を食べます。シロアリやアリのような昆虫を食べるのも好きです。おとなのオスは1日に約40ポンド（約18kg）の食べ物を食べます！<br>・若いゴリラは遊ぶのが大好きです。おとなのゴリラをまねて新しい技を身につけます。<br>・ゴリラにはそれぞれ、ちがう「鼻の模様」があります。科学者は鼻の形でゴリラを見分けることができます。` },

  {

    titleJa: "蚊よ、消えろ ― 遺伝子を変えた蚊は病気を止められるか",
    source: "Lexile 1000–1050 / ノンフィクション（理科・生命科学）",
    paras: [
      { en:`Can Bioengineering Mosquitoes Stop The Spread Of Tropical Diseases?`,
        ja:`蚊の遺伝子を操作すれば、熱帯の病気の広がりを止められるのか。` },
      { en:`It&rsquo;s a bright, sunny day in the Caribbean. You roll out your beach towel and settle down in the sand when&mdash;drat!&mdash;a mosquito interrupts the serenity. You reach over and swat it. If you happened to be on the island of Grand Cayman not long ago, you needn&rsquo;t have bothered. In a test on the island, scientists released millions of lab-created mosquitoes. The insects were engineered to self-destruct. No need for swatters.`,
        ja:`カリブ海の、明るく晴れた日。ビーチタオルを広げて砂の上に落ち着いたそのとき——ちくしょう！——一匹の蚊が静けさをやぶります。あなたは手をのばして、たたきます。もしあなたが少し前にグランドケイマン島にいたなら、その必要はなかったでしょう。この島での実験で、科学者たちは研究室でつくられた何百万匹もの蚊を放したのです。その虫たちは、自分たちで絶えていくように操作されていました。ハエたたきはいりません。` },
      { en:`Although a tropical vacation without biting bugs sounds like a true paradise, there&rsquo;s a bigger goal at stake. <mark data-q="2">Mosquitoes transmit dengue fever, a devastating and sometimes fatal disease. No vaccine or cure for it exists.</mark> Could tailor-made mosquitoes be the answer?`,
        ja:`刺す虫のいない熱帯の休暇はまさに楽園のようですが、かかっているのはもっと大きな目的です。蚊はデング熱を運びます。これは深刻で、ときに命をうばう病気です。ワクチンも治療法もありません。注文どおりにつくられた蚊が、その答えになりうるでしょうか。` },
      { h:"No Fly Zone（飛べない蚊）",
        en:`<mark data-q="2">Dengue fever strikes about 100 million people each year in tropical and subtropical regions.</mark> It&rsquo;s also called breakbone fever for the joint and muscle aches and the intense headaches it causes. In some cases, the fever worsens into dengue hemorrhagic fever, which leads to internal bleeding, organ damage, and possible death.`,
        ja:`デング熱は毎年、熱帯・亜熱帯の地域でおよそ1億人をおそいます。関節や筋肉の痛み、激しい頭痛を起こすことから「骨折熱（breakbone fever）」ともよばれます。場合によっては、デング出血熱へと悪化し、体の内部の出血、臓器の損傷、そして死に至ることもあります。` },
      { en:`<mark data-q="1">Dengue fever is caused by a virus, which the mosquito Aedes aegypti spreads through its bite.</mark> Until now, the best way to control the disease has been to prevent contact between mosquitoes and humans, says Anthony James, a molecular biologist at the University of California, Irvine. One way to do that is to put up window screens. Another is to douse people and places with insecticides (chemicals that kill insects). Unfortunately, insecticides can harm other organisms, including beneficial insects. And mosquitoes can develop a resistance to them over time.`,
        ja:`デング熱はウイルスによって起こり、そのウイルスをネッタイシマカ（Aedes aegypti）という蚊が、刺すことで広げます。これまで、この病気をおさえるいちばん良い方法は、蚊と人が接触しないようにすることだった、とカリフォルニア大学アーバイン校の分子生物学者アンソニー・ジェームズは言います。その一つが網戸をつけること。もう一つが、人や場所に殺虫剤（虫を殺す化学薬品）をふりかけることです。残念ながら、殺虫剤は役に立つ昆虫をふくむほかの生き物にも害をあたえます。そして蚊は、時がたつと殺虫剤への抵抗力を身につけてしまいます。` },
      { en:`James believes there&rsquo;s a better option: genetically engineering the A. aegypti mosquito. Genetic engineering is the process of manipulating an organism&rsquo;s deoxyribonucleic acid (DNA). James tweaked A. aegypti by adding some extra genes to its DNA. Genes are short DNA segments that are responsible for individual traits in an organism. <mark data-q="8">The genes that James added prevent flight muscles from forming in female mosquitoes.</mark> &ldquo;Only the adult females feed on blood and therefore are responsible for transmitting diseases,&rdquo; he says. Unable to fly, the engineered females can&rsquo;t mate, bite, or spread dengue fever.`,
        ja:`ジェームズは、もっと良い方法があると考えています。ネッタイシマカの遺伝子を操作することです。遺伝子工学とは、生き物のDNA（デオキシリボ核酸）を操作する技術のことです。ジェームズはネッタイシマカのDNAに、いくつかの遺伝子を付け加えて手を加えました。遺伝子とは、生き物のそれぞれの特徴を決めている短いDNAの区間のことです。ジェームズが加えた遺伝子は、メスの蚊に飛ぶための筋肉ができるのをふせぎます。「血を吸うのはおとなのメスだけで、だから病気を運ぶ役目もメスが負っています」と彼は言います。飛べないため、操作されたメスは交尾も、刺すことも、デング熱を広げることもできません。` },
      { en:`In order to get flightless females, James actually engineered male skeeters instead. The transgenic (genetically engineered) males mate with females and pass on their extra genes to their offspring. Any female mosquitoes born to those fathers are unable to fly and, therefore, unable to mate. As the genes spread, the population dwindles. &ldquo;The idea is to get a zero population,&rdquo; James says. So far, James has tested his mosquitoes in the lab and in large outdoor mesh cages in Mexico. He&rsquo;s now working on securing approval to test the engineered mosquitoes in the wild.`,
        ja:`飛べないメスを得るために、ジェームズが実際に手を加えたのはオスの蚊のほうでした。遺伝子を操作された（transgenic な）オスがメスと交尾し、加えられた遺伝子を子どもに受けわたします。その父親から生まれたメスの蚊は飛べず、したがって交尾もできません。遺伝子が広がるにつれて、蚊の数は減っていきます。「ねらいは、数をゼロにすることです」とジェームズは言います。これまでのところ、ジェームズは研究室と、メキシコの屋外にある大きな網のおりの中で自分の蚊をためしてきました。今は、操作した蚊を自然の中でためす許可を得るために動いています。` },
      { h:"Into the Wild（自然の中へ）",
        en:`Meanwhile, Oxitec, a British company James has collaborated with, has marched ahead and released engineered mosquitoes into nature. The Oxitec mosquitoes are engineered in a slightly different way from those James designed. The males are unable to produce healthy offspring. In 2009, the company released a batch of those males into a small area of Grand Cayman. Wild females mated with the engineered males, and their offspring died before they reached adulthood. Within three months, the mosquito population in the area fell by 80 percent.`,
        ja:`いっぽうで、ジェームズが協力してきたイギリスの会社オキシテックは先に進み、操作した蚊を自然の中に放しました。オキシテックの蚊は、ジェームズが設計したものとは少しちがうやり方で操作されています。そのオスは、健康な子どもをつくることができません。2009年、この会社はそうしたオスの一群をグランドケイマン島の小さな地域に放しました。野生のメスが操作されたオスと交尾し、その子どもはおとなになる前に死にました。3か月のうちに、その地域の蚊の数は80パーセント減りました。` },
      { en:`Despite the success of that first experiment, it may be awhile before transgenic mosquitoes are released on a bigger scale. The next step, James says, is to prove that the dip in a mosquito population actually reduces the number of dengue fever cases. An even bigger problem may be dealing with critics who are wary of releasing transgenic organisms into the environment. Oxitec reportedly chose Grand Cayman for the experiment because of weak regulations there. Most other countries, including Mexico, where James works, have stricter policies about releasing transgenic organisms.`,
        ja:`この最初の実験が成功したにもかかわらず、遺伝子を操作した蚊がもっと大きな規模で放されるまでには、しばらくかかるかもしれません。次の段階は、蚊の数の減少が実際にデング熱の患者数を減らすと証明することだ、とジェームズは言います。さらに大きな問題は、遺伝子操作された生き物を環境に放つことを警戒する批判者たちへの対応かもしれません。オキシテックがグランドケイマンを実験の場に選んだのは、そこの規制がゆるいからだと伝えられています。ジェームズが働くメキシコをふくむほかのほとんどの国は、遺伝子操作された生き物を放つことについて、より厳しい方針を持っています。` },
      { en:`Genetic engineering has been going on for years. In fact, much of today&rsquo;s packaged food contains genetically engineered corn or soy. Still, many people are suspicious of genetic engineering. The environmental organization Greenpeace, for instance, likens transgenic organisms to &ldquo;a giant genetic experiment&rdquo; that could have unforeseen consequences for the environment and for human health.`,
        ja:`遺伝子工学は何年も前から行われています。実際、今日の包装された食品の多くには、遺伝子操作されたトウモロコシや大豆がふくまれています。それでも、多くの人が遺伝子工学に疑いの目を向けています。たとえば環境団体グリーンピースは、遺伝子操作された生き物を「巨大な遺伝子実験」にたとえ、環境と人の健康に予期せぬ結果をもたらしかねないと言っています。` },
      { en:`<mark data-q="7">James is sensitive to the criticisms. But, he says, &ldquo;we don&rsquo;t think there are risks.&rdquo;</mark> <mark data-q="6">For one thing, the engineered mosquitoes won&rsquo;t persist in the environment indefinitely. After all, they&rsquo;re designed to die.</mark> And in most of the world, A. aegypti is a nonnative species, he adds. Getting rid of the buzzing pests would actually return those habitats to a more natural state.`,
        ja:`ジェームズは、こうした批判に敏感です。それでも彼は「危険はないと考えています」と言います。一つには、操作された蚊は環境の中に永久に残りつづけることはありません。なにしろ、死ぬように設計されているのですから。そして世界のほとんどの地域で、ネッタイシマカは在来種ではない、と彼はつけ加えます。この羽音を立てる害虫を取りのぞくことは、むしろその生息地をより自然な状態にもどすことになる、というのです。` },
      { en:`<mark data-q="3">If the experiment is a success, dengue fever may be just the start. &ldquo;Mosquitoes can transmit a number of diseases,&rdquo; James says. The most devastating is malaria, which kills close to 1 million people every year. Unlike dengue fever, which is spread by just one mosquito species, more than 30 species can transmit the malaria parasite. That makes it a trickier target for genetic engineering, but James contends the goal is within reach.</mark> <mark data-q="4 5">&ldquo;We develop vaccines and medications, but for some diseases we have no tools,&rdquo; he says. &ldquo;It&rsquo;s important that we look at all the science available to find something that will actually work.&rdquo;</mark>`,
        ja:`もしこの実験が成功すれば、デング熱は始まりにすぎないかもしれません。「蚊は多くの病気を運びます」とジェームズは言います。もっとも深刻なのはマラリアで、毎年100万人近くの命をうばっています。1種類の蚊だけが広げるデング熱とちがい、マラリアの原虫は30種類以上の蚊が運びます。そのぶん遺伝子工学にとっては手ごわい相手ですが、ジェームズは目標は手のとどく範囲にあると主張します。「わたしたちはワクチンや薬を開発しますが、病気によっては手だてがまったくないのです」と彼は言います。「実際に効くものを見つけるために、使えるかぎりの科学に目を向けることが大切です。」` },
    ],

  {
    title: "Butterfly Conservation",

    source: "Lexile 1050–1100 / ノンフィクション（環境・生物）",
    paras: [
      { en:`What are the threats facing butterflies today?`,
        ja:`今日、チョウはどんな脅威（きょうい）に直面しているのでしょうか。` },
      { h:"Climate Change（気候変動）",
        en:`<mark data-q="5">Is climate change a threat to butterflies? Yes. Changes in our climate, caused by burning fossil fuels like coal, oil, and gas, are harming butterflies.</mark> <mark data-q="1">Monarch butterflies, which migrate between North America and Mexico, are especially affected. As extreme weather becomes more common, monarchs may be killed or driven off course by heat, drought, fires, severe rains, winds, or floods.</mark>`,
        ja:`気候変動はチョウにとって脅威でしょうか。答えははいです。石炭、石油、ガスといった化石燃料を燃やすことで起こる気候の変化が、チョウを傷つけています。北アメリカとメキシコのあいだを渡るオオカバマダラ（モナーク）は、とくに影響を受けています。極端な気象がふえるにつれて、オオカバマダラは暑さ、干ばつ、火事、激しい雨、風、洪水によって命を落としたり、進路からはずされたりすることがあります。` },
      { en:`As the planet warms, many North American butterflies are moving north or higher into the mountains. <mark data-q="2">One species, Edith&rsquo;s checkerspot, was once common across the western United States. At many sites in southern California, this species has become locally extinct. Populations are more stable in Canada, and in mountains such as the Sierra Nevada.</mark>`,
        ja:`地球があたたかくなるにつれて、北アメリカの多くのチョウが北へ、あるいは山のより高いところへ移っています。エディスチェッカースポットという種は、かつてアメリカ西部の各地でふつうに見られました。ところが南カリフォルニアの多くの場所では、この種は地域的に絶滅してしまいました。カナダや、シエラネバダのような山地では、個体数はより安定しています。` },
      { h:"Habitat Loss（生息地の消失）",
        en:`<mark data-q="3">Human activities, such as logging, building, recreation, and industry can all damage areas where butterflies live. The widespread use of pesticides also threatens butterflies&rsquo; lives. The Xerces blue (Glaucopsyche xerces) butterfly became extinct in the early 1940s, after cities expanded in northern California.</mark>`,
        ja:`伐採、建設、レジャー、産業といった人間の活動はどれも、チョウがすむ場所を損ないます。農薬が広く使われることも、チョウの命をおびやかします。ゼルセスブルー（Glaucopsyche xerces）というチョウは、北カリフォルニアで都市が広がったあと、1940年代初めに絶滅しました。` },
      { h:"Supporting Butterflies（チョウを支える）",
        en:`In some areas, butterfly species that declined in the 1900s are more plentiful now. <mark data-q="4 5">Biologists, conservation groups, and other organizations have been supporting their revival by protecting and managing open areas, growing more of the plants the butterflies feed on, and in some cases, raising endangered butterflies and releasing them into the wild. You can help butterflies by planting your own butterfly garden and giving butterflies more opportunities to eat, rest, and reproduce.</mark>`,
        ja:`地域によっては、1900年代に減ったチョウの種が、今はより多く見られるようになっています。生物学者、保護団体、そのほかの組織が、その復活を支えてきました。開けた土地を守って管理し、チョウがえさにする植物をもっと育て、場合によっては絶滅の危機にある種を育てて自然に放してきたのです。あなたも、自分のチョウの庭をつくり、チョウが食べ、休み、繁殖する機会をふやすことで、力になれます。` },

      { stem:"According to the text, how is the Edith&rsquo;s checkerspot butterfly affected by climate change?",

        why:"この文章は2種類のチョウについて<b>ちがう影響</b>を書いています。オオカバマダラ＝進路をはずされる、エディスチェッカースポット＝すむ場所が北や高地へ移る。どちらの話かを取りちがえないこと。",

        why:"最後の節「Supporting Butterflies（チョウを支える）」が答えの場所です。<b>小見出しは答えのありかを示す地図</b>だと思って使いましょう。",
