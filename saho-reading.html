  {
    title: "When the Space Age Came to Florida",
    titleJa: "宇宙時代がフロリダにやってきたとき",
    source: "Lexile 1050–1100 / ノンフィクション（歴史・科学技術）",
    paras: [
      { en:`In 1957, as tensions between the Soviet Union and the United States grew, the Soviet Union launched a satellite named Sputnik I into space. It was the first satellite ever launched into orbit, a huge milestone for humankind &mdash; and for the Soviets. Many Americans felt that it was crucial for the United States to catch up to the Soviet Union in space technology. President Eisenhower agreed. In 1958, the President created the National Aeronautics and Space Administration (NASA). The great space race had begun!`,
        ja:`1957年、ソビエト連邦とアメリカのあいだの緊張が高まる中、ソビエト連邦はスプートニク1号という人工衛星を宇宙へ打ち上げました。これは軌道に乗った史上初の人工衛星であり、人類にとって——そしてソ連にとって——大きな節目でした。多くのアメリカ人は、宇宙技術でソビエト連邦に追いつくことがアメリカにとって決定的に重要だと感じました。アイゼンハワー大統領も同じ考えでした。1958年、大統領はアメリカ航空宇宙局（NASA）を創設します。偉大な宇宙開発競争が始まったのです！` },
      { en:`<mark data-q="1">In a choice that would affect the state&rsquo;s economy, education, tourism, and technology for decades to come, NASA picked Cape Canaveral in Florida as the location for its &ldquo;spaceport&rdquo;.</mark> Cape Canaveral was an empty stretch of flat land on the central Florida coast, facing the ocean. It was the perfect location for railroads and ships to bring materials to build the launch pad and space station.`,
        ja:`その後何十年にもわたって州の経済、教育、観光、技術に影響をあたえることになる選択として、NASAはフロリダ州のケープカナベラルを「スペースポート（宇宙港）」の場所に選びました。ケープカナベラルは、フロリダ中部の海岸にある、海に面した何もない平らな土地でした。発射台や宇宙施設を建てる資材を、鉄道や船で運びこむのにうってつけの場所だったのです。` },
      { en:`Over the next few years, thousands of scientists, engineers, and builders moved to the area with their families. In a short time, quiet Cape Canaveral became a busy place. <mark data-q="2">To encourage more people to work in the space industry, the U.S. government began to provide Florida with extra money for education in mathematics, science, engineering, and foreign languages.</mark> Florida Technological University was built to teach students the skills needed for working in the space program.`,
        ja:`その後の数年で、何千人もの科学者、技術者、建設作業員が家族とともにこの地域へ移り住みました。短いあいだに、静かだったケープカナベラルはにぎやかな場所になりました。より多くの人が宇宙産業で働くようにうながすため、アメリカ政府は数学、科学、工学、外国語の教育のために、フロリダへ追加の資金を出しはじめました。フロリダ工科大学は、宇宙計画で働くのに必要な技能を学生に教えるために建てられました。` },
      { en:`Cape Canaveral was not the only Florida town to feel the impact of the space race. Factories were built all over the state to produce materials needed for the space program, and nearby cities, including Melbourne and Orlando, grew rapidly. The federal government continued to fund industries important to developing space technology. <mark data-q="2">Billions of dollars entered Florida&rsquo;s economy as a result of the new space program.</mark>`,
        ja:`宇宙開発競争の影響を受けたフロリダの町は、ケープカナベラルだけではありませんでした。宇宙計画に必要な資材をつくる工場が州じゅうに建てられ、メルボルンやオーランドをふくむ近くの都市が急速に大きくなりました。連邦政府は、宇宙技術の開発に重要な産業に資金を出しつづけました。この新しい宇宙計画の結果、何十億ドルもがフロリダの経済に流れこんだのです。` },
      { en:`In 1959, the Soviets made another big step in the Space Race. They launched Luna 2, the first space probe to reach the surface of the moon. Two years later, a Soviet astronaut, Yuri Gagarin, became the first person to orbit Earth. <mark data-q="3">The Soviet Union was getting closer and closer to becoming the first country to put a man on the moon. The U.S. knew they would have to work quickly to make major strides in the space race.</mark>`,
        ja:`1959年、ソ連は宇宙開発競争でまた大きな一歩をふみ出します。月の表面に到達した最初の宇宙探査機、ルナ2号を打ち上げたのです。その2年後、ソ連の宇宙飛行士ユーリ・ガガーリンが、地球を周回した最初の人間になりました。ソビエト連邦は、月に人を送りこむ最初の国になることに、どんどん近づいていました。アメリカは、この競争で大きく前進するには急がなければならないと分かっていました。` },
      { en:`The first American program to send humans into space was called Project Mercury. Six manned flights were launched from Cape Canaveral between 1961 and 1963, after two years of many unmanned practice flights. Scientists wanted to see how well the astronauts could perform tasks in zero gravity. With each flight, NASA workers were able to make improvements in spacecraft design. Americans were very excited about the space race, and many people began visiting Cape Canaveral to watch these spacecraft launches. The area around Cape Canaveral became known as Florida&rsquo;s &ldquo;Space Coast.&rdquo;`,
        ja:`人間を宇宙へ送るアメリカ最初の計画は、マーキュリー計画とよばれました。2年間にわたる多くの無人の練習飛行のあと、1961年から1963年のあいだに、6回の有人飛行がケープカナベラルから打ち上げられました。科学者たちは、無重力の中で宇宙飛行士がどれだけうまく作業できるかを知りたかったのです。飛行のたびに、NASAの人々は宇宙船の設計を改良していきました。アメリカ人は宇宙開発競争にとてもわくわくし、多くの人が打ち上げを見にケープカナベラルを訪れるようになりました。ケープカナベラル周辺の地域は、フロリダの「スペースコースト（宇宙海岸）」として知られるようになりました。` },
      { en:`In 1961, President John F. Kennedy made a bold statement. He announced that the U.S. would put a man on the moon before the end of the decade. Americans were thrilled about this possibility. The goal of the Apollo Mission, which ran from 1963 to 1972, was to accomplish this goal. <mark data-q="4">On July 20, 1969, almost all of America was watching as the Apollo 11 spacecraft, launched from Cape Canaveral with three astronauts aboard, landed on the moon! Neil Armstrong and &ldquo;Buzz&rdquo; Aldrin were the first humans to walk on the moon.</mark> Michael Collins orbited above in the command ship, Columbia.`,
        ja:`1961年、ジョン・F・ケネディ大統領は大胆な宣言をしました。アメリカは1960年代が終わる前に月に人を送る、と発表したのです。アメリカ人はその可能性に胸をおどらせました。1963年から1972年まで続いたアポロ計画の目標は、これを成しとげることでした。1969年7月20日、ほぼアメリカじゅうが見守る中、3人の宇宙飛行士を乗せてケープカナベラルから打ち上げられたアポロ11号が、月に着陸しました！ ニール・アームストロングと「バズ」・オルドリンは、月面を歩いた最初の人間になりました。マイケル・コリンズは、指令船コロンビアで上空を周回していました。` },
      { en:`<mark data-q="5">The U.S. may have been the first country to land astronauts on the moon, but scientists didn&rsquo;t want to stop there.</mark> The next big challenge was to develop spacecraft that could orbit the earth for long periods of time. They also needed a way to get astronauts and supplies on and off those orbiting spacecraft. So NASA started the space shuttle program. Over the years, more than 130 space shuttle flights sent orbiters to study space and map the earth, and eventually to supply the International Space Station and perform repairs to the Hubble Space Telescope. <mark data-q="5">After decades of space age development, Florida is still one of the country&rsquo;s centers for technology and the home to one of the world&rsquo;s most important spaceports.</mark>`,
        ja:`アメリカは宇宙飛行士を月に着陸させた最初の国になったかもしれませんが、科学者たちはそこで止まるつもりはありませんでした。次の大きな挑戦は、長い期間、地球を周回できる宇宙船を開発することでした。また、周回する宇宙船に宇宙飛行士や物資を運びこんだり運び出したりする方法も必要でした。そこでNASAはスペースシャトル計画を始めます。年月をへて、130回をこえるスペースシャトルの飛行が、宇宙を研究し地球の地図をつくるために、そしてやがては国際宇宙ステーションへ物資を運び、ハッブル宇宙望遠鏡の修理を行うために、軌道船を送り出しました。宇宙時代の何十年にもおよぶ発展をへて、フロリダは今も国の技術の中心地の一つであり、世界でもっとも重要な宇宙港の一つがある土地です。` },
    ],

  {
    title: "Banding Together",
    titleJa: "リストバンドで力を合わせて",
    source: "Lexile 1050–1100 / ノンフィクション（社会）",
    paras: [
      { en:`<mark data-q="3">Twelve-year-old Sydney Davis is riding the wristband wave. Inspired by the popular yellow wristbands introduced by champion cyclist Lance Armstrong to raise money for cancer research, Sydney had her own idea. &ldquo;I thought, &lsquo;Why can&rsquo;t we have one for diabetes?&rsquo;&rdquo; she told Weekly Reader.</mark>`,
        ja:`12歳のシドニー・デイビスは、リストバンドの流行に乗っています。がん研究の資金を集めるためにチャンピオン自転車選手ランス・アームストロングが広めた、人気の黄色いリストバンドに触発され、シドニーは自分なりの考えを思いつきました。「『どうして糖尿病のためのものがないんだろう』と思ったんです」と、彼女はウィークリー・リーダー誌に語りました。` },
      { en:`Sydney has had diabetes since she was in kindergarten. She is one of 18 million people in the United States with this disease. <mark data-q="4">In a person with diabetes, the body makes little or no insulin. That is a substance that the body needs to help convert glucose, a sugar in food, into energy.</mark>`,
        ja:`シドニーは幼稚園のころから糖尿病です。彼女は、アメリカでこの病気を持つ1,800万人のうちの一人です。糖尿病の人の体は、インスリンをほとんど、あるいはまったくつくりません。インスリンは、食べ物にふくまれる糖であるブドウ糖（グルコース）をエネルギーに変えるのを助けるために、体が必要とする物質です。` },
      { en:`<mark data-q="2">With the help of her friend Daniel Rosen, 13, who also has diabetes, Sydney ordered blue wristbands with the slogan &ldquo;Cure Diabetes Today.&rdquo; The two friends started selling the wristbands in their New Jersey community to raise money for research aimed at curing diabetes.</mark> After only a month, they had sold 10,000 bracelets and donated the contributions to the Naomi Berrie Diabetes Center in New York City. The bracelets were in such high demand that the diabetes center began selling them on its Web site. &ldquo;We made over $100,000 already!&rdquo; said Sydney.`,
        ja:`同じく糖尿病である13歳の友人ダニエル・ローゼンの助けを借りて、シドニーは「今日、糖尿病を治そう」というスローガンの入った青いリストバンドを注文しました。二人は、糖尿病を治す研究のための資金を集めようと、ニュージャージーの地域でそのリストバンドを売りはじめました。わずか1か月で1万本を売り、集まったお金をニューヨーク市のナオミ・ベリー糖尿病センターに寄付しました。バンドの人気があまりに高かったため、このセンターは自分たちのウェブサイトでも売りはじめました。「もう10万ドル以上集まりました！」とシドニーは言いました。` },

  {
    title: "Satellites and Gravity",
    titleJa: "人工衛星と重力",
    source: "Lexile 1050–1100 / ノンフィクション（理科・物理）",
    paras: [
      { en:`You may have heard the story of how Isaac Newton discovered gravity. As the legend goes, Newton was sitting under an apple tree when, all of a sudden, an apple dropped from the tree and fell on his head. This incident made him wonder why the apple fell toward the ground and not in any other direction. Nowadays, it seems quite silly to think that an apple might fall up, or sideways. That&rsquo;s because now we know that Earth&rsquo;s gravity makes everything fall down, toward the planet&rsquo;s center. Gravity is the reason we are able to stand on the earth. Without it, we would all float off into space!`,
        ja:`アイザック・ニュートンが重力を発見した話を聞いたことがあるかもしれません。言い伝えによれば、ニュートンがリンゴの木の下にすわっていたとき、とつぜんリンゴが木から落ちて頭に当たったといいます。この出来事から彼は、なぜリンゴはほかの方向ではなく地面に向かって落ちるのだろう、と考えるようになりました。今では、リンゴが上や横に落ちるかもしれないと考えるのは、ずいぶんばかげたことに思えます。地球の重力が、すべてのものを下へ、つまり地球の中心に向かって落とすことを、わたしたちは知っているからです。重力があるから、わたしたちは地球の上に立っていられます。重力がなければ、みんな宇宙へ浮かんで行ってしまうでしょう！` },
      { en:`Gravity is also necessary for the operation of satellites. Usually when people talk about satellites, they are referring to manmade objects that have been sent into orbit. However, the moon is also a satellite! <mark data-q="1">A satellite is any object that revolves around a planet in a circular or elliptical path.</mark> The path of a satellite is its orbit.`,
        ja:`重力は、人工衛星が働くためにも必要です。ふつう人が「衛星（satellite）」と言うとき、それは軌道に送りこまれた人工の物体のことを指しています。でも、月も衛星なのです！ 衛星とは、円または楕円（だえん）の道すじで惑星のまわりを回る、あらゆる物体のことです。衛星の通る道すじが、その軌道です。` },
      { en:`<mark data-q="6">Manmade satellites have all kinds of important applications. Communications satellites, for instance, are satellites that are sent to orbit the earth for the purpose of sending communication signals or messages.</mark> <mark data-q="3">Though we might not think about it when we&rsquo;re on the phone, using the Internet, watching television, or listening to the radio, many satellites help make those activities possible for us to enjoy.</mark>`,
        ja:`人工衛星には、あらゆる種類の大切な用途（applications）があります。たとえば通信衛星は、通信の信号やメッセージを送るために地球を回るよう送り出された衛星です。電話をしているとき、インターネットを使っているとき、テレビを見たりラジオを聞いたりしているときには意識しないかもしれませんが、多くの衛星が、そうした活動を楽しめるようにしてくれているのです。` },
      { en:`<mark data-q="4 7">Scientists have used observation satellites. These are satellites that have been specifically designed to monitor the earth. Observation satellites are used to keep track of the weather, detect changes in the environment, and create maps of the earth. They can be very useful for scientists in monitoring natural disasters, global warming, pollution, and other changes to the planet.</mark> The military also has spy satellites (very similar to observation satellites) that help them to peek in on other people around the world. If you&rsquo;re ever in the car and need to find directions to go somewhere, you have probably used the Global Positioning System, also known as GPS. This is a network of 24 satellites that people with a GPS receiver can use to determine their location.`,
        ja:`科学者は観測衛星を使ってきました。これは地球を監視するために特別に設計された衛星です。観測衛星は、天気を追いかけ、環境の変化をとらえ、地球の地図をつくるのに使われます。自然災害、地球温暖化、汚染、そのほかの地球の変化を見張るうえで、科学者にとってとても役に立ちます。軍も、世界のほかの人々をのぞき見るのに役立つ偵察衛星（観測衛星によく似たもの）を持っています。もし車に乗っていて、どこかへの道順を知る必要があるなら、あなたはたぶんGPS（全地球測位システム）を使ったことがあるでしょう。これは24個の衛星のネットワークで、GPS受信機を持つ人が自分の位置を知るために使えます。` },
      { en:`These are the main applications of satellites you may have encountered in your everyday life, but of course there are countless others! Satellites are incredibly useful, but how exactly do they stay in orbit? It might seem strange that gravity doesn&rsquo;t cause satellites to just fall straight down to Earth, like Newton&rsquo;s apple. Why is that? It turns out that the earth&rsquo;s gravitational pull on an object weakens the farther away it is from the planet&rsquo;s surface. Satellites orbit far above the earth&rsquo;s surface at a set speed. Earth has an &ldquo;escape velocity,&rdquo; which is the minimum speed necessary for an object to escape the earth&rsquo;s gravity entirely and fly off into outer space. Earth&rsquo;s escape velocity is more than 25,000 miles per hour. Engineers don&rsquo;t build satellites that travel faster than that because they don&rsquo;t want their satellites flying off into space.`,
        ja:`これらは、あなたが日常生活で出会うかもしれない衛星のおもな使い道ですが、もちろんほかにも数えきれないほどあります！ 衛星はおどろくほど役に立ちますが、いったいどうやって軌道にとどまっているのでしょう。ニュートンのリンゴのように、重力で衛星がまっすぐ地球に落ちてこないのは、不思議に思えるかもしれません。なぜでしょう。実は、物体にはたらく地球の重力の引く力は、地表からはなれるほど弱くなります。衛星は、決まった速さで地表のはるか上を回っています。地球には「脱出速度（escape velocity）」があります。これは、物体が地球の重力から完全にのがれて宇宙空間へ飛び出すために必要な最低の速さのことです。地球の脱出速度は時速2万5千マイル以上です。技術者は、それより速く進む衛星をつくりません。衛星が宇宙へ飛び去ってしまっては困るからです。` },
      { en:`<mark data-q="2 5">Satellites are designed to achieve a balance. They revolve around the earth slowly enough to avoid drifting off into space, but fast enough to avoid getting pulled completely down toward the center of the earth by the force of gravity. At the correct velocity, a satellite is pulled by the earth with just enough force to maintain its orbit.</mark> The closer a satellite is to the earth&rsquo;s surface, the faster it needs to go in order to stay in orbit. And satellites have a circular or elliptical orbit because they are constantly being pulled toward the earth&rsquo;s surface, which is curved. <mark data-q="5">Therefore, gravity is an important part of our daily lives, whether it&rsquo;s keeping our feet firmly planted on the planet&rsquo;s surface, or keeping our satellites in orbit to help us communicate with one another and learn more about the world we live in.</mark>`,
        ja:`衛星は、つり合いを保つように設計されています。宇宙へただよい出てしまわない程度にゆっくりと、しかし重力によって地球の中心へ完全に引き落とされてしまわない程度に速く、地球のまわりを回っているのです。ちょうどよい速さのとき、衛星は軌道を保つのにちょうど足りるだけの力で地球に引かれます。衛星が地表に近いほど、軌道にとどまるにはより速く進む必要があります。そして衛星の軌道が円や楕円になるのは、曲がった地表に向かって、たえず引かれつづけているからです。ですから重力は、わたしたちの足を地表にしっかり立たせているという意味でも、たがいに連絡を取り合い、住む世界についてより多くを学ぶ手助けとなる衛星を軌道に保っているという意味でも、日々の暮らしの大切な一部なのです。` },

    paras: [
      { en:`<mark data-q="1 5">When an airplane is in flight, there is a downward force (gravity) and an upward force (lift) acting on the airplane.</mark> As an airplane moves through the air, the shape of the wings causes there to be less air pressure pushing down on the wings than pushing up on the wings. This difference in pressure yields the upward lift. <mark data-q="5">If the downward gravitational force is less than the upward lift, then the airplane stays in the air.</mark> Read on for a more detailed explanation.`,
        ja:`飛行機が飛んでいるとき、その機体には下向きの力（重力）と上向きの力（揚力＝ようりょく）がはたらいています。飛行機が空気の中を進むと、翼の形のために、翼を上から押す空気の圧力よりも、下から押し上げる圧力のほうが大きくなります。この圧力の差が、上向きの揚力を生みます。下向きの重力より上向きの揚力のほうが大きければ、飛行機は空にとどまります。もっとくわしい説明を読んでみましょう。` },

        ja:`事実1. 飛行機のプロペラが回ると、機体に前向きの力（推力＝すいりょく）があたえられます。飛行機が前へ進むと、空気の抵抗によって後ろ向きの力（抗力＝こうりょく）が生まれます。（図1：推力と抗力）` },

        ja:`事実3. 飛行機が前へ進むと、翼の形によって、翼の上の圧力が下より低くなり、その結果、全体として上向きの力——揚力——が生まれます。（図3：翼の形）` },
      { en:`<mark data-q="7">As an airplane speeds along the runway, the airplane&rsquo;s wings disrupt the flow of the air. This disruption causes the air above the wings to move faster than below the wings.</mark> As a result, the air pressure above the wing is less than below the wing. As the airplane speeds up, this pressure difference increases until the lift is stronger than the gravitational force, and the airplane takes off. <mark data-q="3">In order to remain in flight, the thrust must be greater than the drag, and lift must be greater than the force of gravity.</mark> There is still some debate as to the exact cause of the difference in the air&rsquo;s speed around the wings. The basic concept described here, however, seems to explain why an airplane can fly.`,

  {
    title: "Designing from Scratch",
    titleJa: "ゼロから設計する",
    source: "Lexile 1050–1100 / ノンフィクション（技術・環境）",
    paras: [
      { en:`Open up a newspaper, click on a news website, or peel open the latest magazine. Chances are you&rsquo;ll find something about a new technology. You may read about the latest digital enhancements in smartphones, or maybe something about advancements in green technology&mdash;that is, how to reduce our environmental impact. Whatever that technology might be, it all started with an idea regarding engineering design.`,
        ja:`新聞を開き、ニュースサイトを開き、最新の雑誌をめくってみてください。おそらく、新しい技術についての記事が見つかるでしょう。スマートフォンの最新のデジタル改良についてかもしれませんし、グリーンテクノロジー——つまり、環境への負担をどう減らすか——の進歩についてかもしれません。それがどんな技術であれ、すべては工学設計（engineering design）についての一つの考えから始まったのです。` },
      { en:`<mark data-q="1">Typically, the process of engineering design starts with a problem or a need.</mark> For example, let&rsquo;s consider the hypothetical building of a new apartment complex. <mark data-q="5">Our task is to construct a green, sustainable city building.</mark> This will allow residents to easily commute to their workplace, hopefully without cars in order to cut back on air pollution. However, there are several considerations that need to be addressed. <mark data-q="3 7">We must consider various things: potential energy sources, waste disposal, materials of the new building, and water sources. To make these decisions, it is best to define a precise task with criteria and constraints.</mark> What is the budget? What materials are available? If questions like these can be answered early on in the design process, it is more likely that the designed solution will be successful. Therefore, it&rsquo;s important to go through each consideration one by one to determine the best possible solution.`,
        ja:`ふつう、工学設計の過程は、問題や必要から始まります。たとえば、新しい集合住宅を建てる場合を仮に考えてみましょう。わたしたちの課題は、環境にやさしく持続可能な、都市の建物をつくることです。そうすれば住む人は職場へ通いやすくなり、できれば車を使わずにすんで、大気汚染を減らせます。しかし、取り組むべき検討事項がいくつもあります。使えるエネルギー源、ごみの処理、新しい建物の材料、水の供給——さまざまなことを考えなければなりません。こうした判断をするには、基準（criteria）と制約（constraints）をともなう明確な課題を定めるのがいちばんです。予算はいくらか。手に入る材料は何か。こうした問いに設計の早い段階で答えられれば、設計した解決策がうまくいく見こみは高くなります。ですから、検討事項を一つずつ順にたどり、できるかぎり良い解決策を決めていくことが大切です。` },
      { h:"Building Materials（建物の材料）",
        en:`First, the question must be asked&mdash;are we building on an empty lot, or are we replacing an old building? <mark data-q="6">If it&rsquo;s the latter option, we must face the decision of completely tearing down the old building, or utilizing the current space and renovating it for our design.</mark> As previously mentioned, our goal is to be sustainable, which means our building should be built using methods that do not completely use up or destroy natural resources. We want to have the minimum possible negative impact on the environment. To attain our goal, we could demolish the old building in order to use new, sustainable technology; however, we would have to purchase new building material, which isn&rsquo;t necessarily sustainable, since we&rsquo;re not recycling. Or we can use the skeleton of the old building, but this may limit our use of modern technology. Unfortunately, there are tough decisions to make during the design process&mdash;sometimes there isn&rsquo;t one option that is clearly the best. Therefore, it&rsquo;s important to weigh the good against the bad, and move on from there.`,
        ja:`まず、こう問わなければなりません——空き地に建てるのか、それとも古い建物を建てかえるのか。もし後者（the latter）なら、古い建物を完全に取りこわすか、今ある空間を生かして自分たちの設計に合わせて改修するかを決めなければなりません。すでに述べたように、目標は持続可能であることです。つまり、天然資源を完全に使い切ったり壊したりしない方法で建てるべきだ、ということです。環境への悪い影響をできるかぎり小さくしたいのです。目標を果たすために、新しい持続可能な技術を使えるよう古い建物を取りこわすこともできます。しかしその場合、新しい建築材料を買わなければならず、リサイクルをしないのですから、必ずしも持続可能とはいえません。あるいは古い建物の骨組みを使うこともできますが、そうすると最新の技術を使いにくくなるかもしれません。残念ながら、設計の過程にはむずかしい判断がつきものです——どれか一つがはっきり最良だ、とはかぎらないのです。ですから、良い面と悪い面を天びんにかけ、そこから前へ進むことが大切です。` },
      { h:"Energy Sources（エネルギー源）",
        en:`Since the task is to build a sustainable building, we should consider sustainable energy sources. It might be easier to use non-renewable energy (which is considered less sustainable than renewable energy), because it&rsquo;s often more readily available. However, our task is to create a sustainable building, so we need to find sustainable energy sources. Solar panels could be an option, if we are building in a sunny area. <mark data-q="4">Another option might be wind energy, generated by large wind turbines.</mark> Furthermore, it is important to think not only about generating energy, but about saving that energy. Insulation is an important factor to consider, as it helps keep the heat in during the winter and makes sure the building doesn&rsquo;t get too hot in the summer.`,
        ja:`課題は持続可能な建物をつくることなので、持続可能なエネルギー源を考えるべきです。再生できないエネルギー（再生可能エネルギーより持続可能性が低いとされます）のほうが、手に入りやすいぶん楽かもしれません。しかしわたしたちの課題は持続可能な建物をつくることですから、持続可能なエネルギー源を見つける必要があります。日当たりのよい地域に建てるなら、太陽光パネルが選択肢になるでしょう。もう一つの選択肢は、大きな風力タービンで生み出す風のエネルギーかもしれません。さらに、エネルギーを生み出すことだけでなく、そのエネルギーをむだにしないことも大切です。断熱は重要な要素です。冬は熱を中にとどめ、夏は建物が暑くなりすぎないようにしてくれるからです。` },
      { h:"Waste Disposal（ごみの処理）",
        en:`Because our goal for the building is sustainability, a baseline requirement for tenants of the building should be recycling and composting. For this reason, it is important to provide recycling and composting services to the building.`,
        ja:`この建物の目標は持続可能性ですから、入居者に求める最低限の条件として、リサイクルと堆肥（たいひ）づくりを入れるべきです。そのため、建物にリサイクルと堆肥化の仕組みを用意することが大切です。` },
      { h:"Water Sources（水）",
        en:`Imagine we are building in an area known for having a high amount of rainfall. Since the city is covered with streets and buildings, the rain isn&rsquo;t absorbed by the ground. This may lead to flooding. When planning our building, it is vital to try to prevent flooding by absorbing storm water runoff. <mark data-q="2">Possible solutions include roof gardens, rain gardens (gardens planted in a lowered hole to soak up excess water), and flow-through planters (which temporarily relieve water runoff).</mark> All three of these solutions can be implemented in the building. As long as they are properly maintained, the gardens can greatly contribute to reducing flooding after large rainfalls.`,
        ja:`雨の多いことで知られる地域に建てると想像してみましょう。都市は道路や建物におおわれているため、雨は地面に吸いこまれません。これが洪水につながることがあります。建物を計画するときには、降った雨の流出を吸収して洪水をふせぐようにすることが欠かせません。考えられる解決策には、屋上庭園、レインガーデン（余分な水を吸わせるために低く掘ったところにつくる庭）、そして流下型プランター（水の流出を一時的にやわらげるもの）があります。この3つはどれも、この建物に取り入れられます。きちんと手入れをするかぎり、これらの庭は大雨のあとの洪水を減らすのに大きく役立ちます。` },
      { h:"The Solution（解決へ）",
        en:`From this example, we can see how many decisions are involved in the design process. And these aren&rsquo;t even all of them! There are many, many more decisions involved in the construction of a new building. <mark data-q="3 5">However, the design process is made much easier by setting specific tasks and defining constraints. This way, you can focus on providing the best possible solutions.</mark>`,
        ja:`この例から、設計の過程にどれほど多くの判断が関わるかが分かります。しかも、これでも全部ではありません！ 新しい建物を建てるには、まだまだ多くの判断が必要です。それでも、具体的な課題を決め、制約をはっきりさせることで、設計の過程はずっと進めやすくなります。そうすれば、できるかぎり良い解決策を出すことに集中できるのです。` },
    ],

/* localStorage が使えない環境（プライベートモード等）でも止まらないようにする */
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

/* ---------- 使う人（Saho / Riho）ごとに記録を分ける ---------- */
const USERS = {
  saho: { name:"Saho", mark:"✦", key:"saho-reading-v1",
          tokenKey:"vocabTrail_gh_token",      ghPath:"progress/reading_progress.json",      wordApp:"index.html" },
  riho: { name:"Riho", mark:"✧", key:"riho-reading-v1",
          tokenKey:"vocabTrail_riho_gh_token", ghPath:"progress/riho_reading_progress.json", wordApp:"riho.html" },
};
const USER_KEY = "saho-reading-user";
const USER = (() => {
  // ① URL の ?user= がいちばん強い
  const q = new URLSearchParams(location.search).get("user");
  if (USERS[q]) { lsSet(USER_KEY, q); return q; }
  // ② どのページから来たかで判断（?user= が落ちても Riho のページから来たら Riho）
  const ref = (document.referrer || "").toLowerCase();
  if (ref.indexOf("riho") >= 0) { lsSet(USER_KEY, "riho"); return "riho"; }
  if (ref.indexOf("index.html") >= 0) { lsSet(USER_KEY, "saho"); return "saho"; }
  // ③ 前に使った人をおぼえておく
  const saved = lsGet(USER_KEY);
  return USERS[saved] ? saved : "saho";
})();
const ME = USERS[USER];
function switchUser(u) {
  if (!USERS[u] || u === USER) return;
  location.href = location.pathname + "?user=" + u;
}

const KEY = ME.key;
// クリア条件：正答率に関係なく、課題を最後まで（答え合わせまで）やればクリア

function loadState() {
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { s = {}; }
  if (!s.levels) {                       // 旧フォーマット（Lexile がそのままキー）からの移行
    const levels = {};
    Object.keys(s).forEach(k => { if (/^\d+$/.test(k)) levels[k] = s[k]; });
    s = { levels, history: s.history || [] };
  }
  s.levels = s.levels || {}; s.history = s.history || [];
  return s;
}
let state = loadState();
const save = () => lsSet(KEY, JSON.stringify(state));

const listOf    = lex => READINGS[lex] || [];              // その Lexile の長文リスト
const passageOf = (lex,i) => listOf(lex)[i] || null;
const lvOf      = lex => state.levels[lex] || null;
const isCleared = lex => !!(lvOf(lex) && lvOf(lex).cleared);
const unlocked  = i   => i === 0 || isCleared(SKY[i-1].lex);
const hkey      = h   => h.lex + "#" + (h.i || 0);
const readCount = ()  => new Set(state.history.map(hkey)).size;   // 読んだ長文の本数
const totalReadings = () => Object.values(READINGS).reduce((s,a) => s + a.length, 0);
const clearedCount  = () => SKY.filter(c => isCleared(c.lex)).length;
const histLex   = lex => state.history.filter(h => h.lex === lex);
const histPsg   = (lex,i) => state.history.filter(h => h.lex === lex && (h.i || 0) === i);
const readInLex = lex => new Set(histLex(lex).map(h => h.i || 0)).size;
const avgRate   = hs => hs.length ? Math.round(hs.reduce((s,x) => s + x.c / x.t, 0) / hs.length * 100) : null;
const bestRate  = hs => hs.length ? Math.max(...hs.map(x => Math.round(x.c / x.t * 100))) : null;
const rateOf    = lex => avgRate(histLex(lex));            // その Lexile の平均正答率
const overallRate = () => avgRate(state.history);
const rateCls = r => r >= 80 ? "hi" : r >= 60 ? "mid" : "lo";
function fmtDate(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function constSVG(c, litCount, opt = {}) {
  const total = c.pts.length;
  const lit = opt.all ? total : Math.round(total * (litCount / (opt.of || total)));
  const on = opt.on !== false;
  const S = opt.box || 100, k = S / 100;
  const P = c.pts.map(p => [p[0]*k, p[1]*k]);
  let s = `<svg viewBox="0 0 ${S} ${S}" xmlns="http://www.w3.org/2000/svg">`;
  s += c.lines.map(([a,b]) =>
    `<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}"
      stroke="${on ? '#ffd977' : '#6b7194'}" stroke-width="${1.1*k}" opacity="${on ? .55 : .28}"/>`).join("");
  s += P.map((p,i) => {
    const active = on && i < lit;
    const r = (i === 0 ? 3.6 : 2.7) * k;
    return `<circle cx="${p[0]}" cy="${p[1]}" r="${r}"
      fill="${active ? '#ffd977' : '#77809f'}" ${active ? 'class="tw"' : ''}/>` +
      (active ? `<circle cx="${p[0]}" cy="${p[1]}" r="${r*2.1}" fill="#ffd977" opacity=".2"/>` : "");
  }).join("");
  return s + "</svg>";
}

  const W = 760, H = 300;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="sky-svg" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2340"/><stop offset="1" stop-color="#3a3f66"/></linearGradient></defs>
    <rect width="${W}" height="${H}" rx="14" fill="url(#ng)"/>`;
  for (let i = 0; i < 90; i++) {
    const x = (i * 97.3) % W, y = (i * 53.7) % H, r = (i % 5 === 0) ? 1.6 : 0.9;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#fff" opacity="${0.15 + (i%7)*0.06}"/>`;
  }
  s += `<path d="${SKY.map((c,i) => { const p = posOf(i); return (i?'L':'M')+p[0].toFixed(1)+' '+p[1]; }).join(' ')}"
        fill="none" stroke="#8d94bd" stroke-width="1.6" stroke-dasharray="3 6" opacity=".4"/>`;
  SKY.forEach((c, i) => {
    const box = 50, on = isCleared(c.lex), p = posOf(i);
    s += `<g transform="translate(${(p[0]-box/2).toFixed(1)} ${p[1]-box/2})">
      ${constSVG(c, 0, { box, on, all:true })}
      <text x="${box/2}" y="${box+12}" text-anchor="middle" font-size="10"
        fill="${on ? '#ffd977' : '#8d94bd'}" font-family="Inter, sans-serif">${on ? c.name : c.lex}</text>
    </g>`;
  });
  return s + "</svg>";
}

function ghToast(msg) {
  document.querySelectorAll(".gh-toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "gh-toast";
  t.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#24292e;color:#fff;padding:10px 17px;border-radius:12px;font-weight:500;font-size:0.8rem;box-shadow:0 6px 16px rgba(0,0,0,.18);z-index:9999;opacity:0;transition:all .25s ease";
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = "1"; t.style.transform = "translateX(-50%) translateY(0)"; });
  setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translateX(-50%) translateY(20px)"; setTimeout(() => t.remove(), 300); }, 2400);
}

async function ghSave(silent) {
  if (!ghToken()) { if (!silent) alert("GitHub トークンが未設定です。☁️ の画面で入力してください。"); return false; }
  try {
    const payload = JSON.stringify({ app: "saho-reading", savedAt: new Date().toISOString(), state }, null, 2);
    let sha = "";
    const g = await fetch(ghApi(), { headers: ghHead() });
    if (g.ok) sha = (await g.json()).sha;
    const body = { message: `読解記録 ${new Date().toLocaleString("ja-JP")}`,
                   content: btoa(unescape(encodeURIComponent(payload))), ...(sha ? { sha } : {}) };
    const r = await fetch(ghApi(), { method: "PUT",
      headers: { ...ghHead(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.ok) { lsSet(GH_LAST, new Date().toISOString()); ghToast("☁️ GitHubに保存しました"); return true; }
    ghToast("⚠️ GitHub保存に失敗しました");
  } catch (e) { ghToast("⚠️ 保存に失敗: " + e.message); }
  return false;
}

async function ghLoad(silent) {
  if (!ghToken()) { if (!silent) alert("GitHub トークンが未設定です。☁️ の画面で入力してください。"); return false; }
  try {
    const res = await fetch(ghApi(), { headers: ghHead() });
    if (!res.ok) { if (!silent) alert("GitHubにまだ記録がありません。"); return false; }
    const j = await res.json();
    const parsed = JSON.parse(decodeURIComponent(escape(atob(j.content))));
    if (parsed && parsed.state) {
      state = { levels: parsed.state.levels || {}, history: parsed.state.history || [] };
      save();
      lsSet(GH_LAST, new Date().toISOString());
      if (silent) ghToast("☁️ GitHubから記録を読み込みました");
      else alert(`GitHubから読み込みました！\n読んだ長文 ${readCount()} 本 / 記録 ${state.history.length} 件`);
      renderHome();
      return true;
    }
  } catch (e) { if (!silent) alert("読み込みに失敗しました: " + e.message); }
  return false;
}

                    <button class="choice" id="c${qi}_${ci}" onclick="pick(${qi},${ci})">

function photoFallback(img, key) {
  const fig = img.closest(".photo");
  if (fig && FALLBACK_SVG[key]) img.outerHTML = FALLBACK_SVG[key];
  else if (fig) fig.remove();
}

function pick(qi, ci) {
  if (session.graded) return;
  session.pick[qi] = ci;
  session.r.questions[qi].choices.forEach((_, i) =>
    document.getElementById(`c${qi}_${i}`).classList.toggle("sel", i === ci));
  const left = session.pick.filter(p => p === null).length;
  const b = document.getElementById("gradeBtn");
  b.disabled = left > 0;
  b.textContent = left > 0 ? `答え合わせをする（あと${left}問）` : "答え合わせをする";
}

/* ---------- 採点 ---------- */
function grade() {
  const { lex, r, pick } = session;
  session.graded = true;
  let correct = 0;

  r.questions.forEach((q, qi) => {
    const my = pick[qi], ok = my === q.ans;
    if (ok) correct++;
    q.choices.forEach((_, ci) => {
      const el = document.getElementById(`c${qi}_${ci}`);
      el.disabled = true; el.classList.remove("sel");
      if (ci === q.ans) el.classList.add("correct");
      else if (ci === my) el.classList.add("miss");
    });
    document.getElementById(`q${qi}`).classList.add(ok ? "ok" : "ng");

    // 解説は「まちがえた問題」だけ
    document.getElementById(`fb${qi}`).innerHTML = ok
      ? `<div class="verdict">✔ せいかい！</div>`
      : `<div class="expl">
           <span class="lbl">せいかいは</span>
           <div class="ans">${"ABCD"[q.ans]}. ${q.choices[q.ans]}</div>
           <span class="lbl">本文のカギになる文</span>
           <div class="key"><div class="en">${q.keyEn}</div><div class="ja">${q.keyJa}</div></div>
           <span class="lbl">なぜそうなるの？</span>
           <div>${q.why}</div>
           ${q.others ? `<span class="lbl" style="margin-top:6px">ほかの選択肢</span>
             <ul>${q.others.map(o => `<li>× ${o}</li>`).join("")}</ul>` : ""}
         </div>`;
  });

  // まちがえた問題のカギの文を本文でハイライト
  const wrong = r.questions.map((q, i) => (pick[i] === q.ans ? null : i + 1)).filter(Boolean);
  document.querySelectorAll("#passage mark").forEach(m => {
    const qs = (m.dataset.q || "").split(/\s+/).map(Number);
    if (qs.some(n => wrong.includes(n))) m.classList.add("lit");
  });

  // 記録
  const prev = state.levels[lex] || { best:0, cleared:false };
  state.levels[lex] = { best: Math.max(prev.best, correct), total: r.questions.length,
                        cleared: true };   // 正答率に関係なく、やりきったらクリア
  state.history.unshift({ lex, i: session.i, ts: Date.now(), c: correct, t: r.questions.length });
  if (state.history.length > 300) state.history.pop();
  save();

  document.getElementById("gradeBtn").remove();
  ghSave(true);              // 1回終わるごとに GitHub へ自動保存
  renderAfter(correct);
}

function renderAfter(correct) {
  const { lex, i, r } = session;
  const c = SKY.find(x => x.lex === lex);
  const list = listOf(lex), ni = i + 1 < list.length ? i + 1 : null;
  const n = r.questions.length, wrong = n - correct;
  const rt = Math.round(correct / n * 100);
  const avg = rateOf(lex);
  const next = SKY[SKY.findIndex(x => x.lex === lex) + 1];
  const comment = rt === 100 ? "パーフェクト！ ぜんぶ正解です。"
                : wrong === 0 ? "よくできました。"
                : rt >= 75 ? `まちがえた${wrong}問の解説を読んでおこう。`
                : `まちがえた${wrong}問の解説と全文の和訳をじっくり読んで、もう一度読んでみよう。`;

  document.getElementById("after").innerHTML = `
    <div class="card result pop">
      <div class="result-score">${correct}<small> / ${n}</small></div>
      <div class="result-rate">正答率 <span class="rate ${rateCls(rt)}">${rt}%</span>　／　このLexileの平均 ${avg}%</div>
      <h2>🎉 クリア！ ${c.name}をゲット！</h2>
      <p>${comment}<br>${next ? `つぎは Lexile ${next.lex}–${next.lex+50}（${next.name}）が開きました。` : "ぜんぶの星座をあつめました！"}</p>
      <div class="const-won">
        ${constSVG(c, 0, { on:true, all:true, box:100 })}
        <div class="const-name">${c.name}　${c.en}</div>
      </div>
      <div class="result-actions">
        <button class="btn ghost" onclick="startReading(${lex},${i})">もう一回</button>
        ${ni !== null
          ? `<button class="btn" onclick="startReading(${lex},${ni})">次の長文へ →</button>`
          : `<button class="btn ghost" onclick="renderHistory()">履歴を見る</button>`}
        <button class="btn night" onclick="${list.length > 1 ? `renderLevel(${lex})` : "renderHome()"}">${list.length > 1 ? "長文いちらんへ" : "星空マップへ"}</button>
      </div>
    </div>

    <div class="card">
      <h2>🇯🇵 全文の和訳</h2>
      <div class="ja-title">${r.title}<br><span style="font-weight:300;color:var(--ink-soft)">${r.titleJa}</span></div>
      ${r.paras.map(p => `${p.h ? `<div class="para-h">${p.h}</div>` : ""}<div class="ja-p">${p.ja}</div>`).join("")}
      <div class="hint mt">※ まちがえた問題のカギの文は、本文中で <mark style="background:#fdeaa8">黄色</mark> にしてあります。</div>
    </div>

    <div class="card">
      <h2>📚 この長文の単語</h2>
      <div class="vocab">
        ${r.vocab.map(([w, j]) => `<div class="vw"><b>${w}</b><span>${j}</span></div>`).join("")}
      </div>
    </div>`;

  document.getElementById("after").scrollIntoView({ behavior:"smooth", block:"start" });
}

function resetAll() {
  if (!confirm("読んだ記録・星座・履歴をぜんぶ消します。よろしいですか？")) return;
  state = { levels:{}, history:[] }; save(); renderHome();
}

/* ---------- だれの記録かを画面に出す ---------- */
document.getElementById("brandMark").textContent = ME.mark;
document.getElementById("brandName").textContent = ME.name;
document.title = `${ME.name} English Reading — 星座をあつめよう`;

/* ---------- いつも上にある学習メニュー（Riho は4か所） ---------- */
(() => {
  const links = USER === "riho"
    ? [["riho.html", "📚 単語学習"],
       ["riho-reading.html", "📖 長文リーディング", true],
       ["riho-essay-topic.html", "✍️ Essay Learning"],
       ["riho-toefl-writing.html", "📓 TOEFL Learning"]]
    : [["index.html", "📚 単語学習"],
       ["saho-reading.html?user=saho", "📖 長文リーディング", true]];
  const nav = document.createElement("nav");
  nav.className = "rnav";
  nav.innerHTML = links.map(([href, label, on]) =>
    `<a href="${href}"${on ? ' class="active"' : ""}>${label}</a>`).join("");
  document.body.insertBefore(nav, document.body.firstChild);
})();
(() => {
  const other = USER === "saho" ? "riho" : "saho";
  const b = document.createElement("button");
  b.className = "btn ghost small";
  b.textContent = USERS[other].name + "に切りかえ";
  b.title = "記録は " + USERS[other].name + " のものに切りかわります";
  b.onclick = () => switchUser(other);
  document.querySelector(".nav").appendChild(b);
})();

renderHome();
// 端末をかえたときのために、ローカルが空でトークンがあれば GitHub から自動で呼び出す
if (ghToken() && !state.history.length) ghLoad(true);
</script>
