<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEFL 問題集 復習 📝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fef9f3; --card: #ffffff; --soft: #fff4e6;
    --bg-blue: #e8f4fd; --bg-pink: #ffe8ee; --bg-green: #e8f7ea; --bg-yellow: #fff5cc; --bg-purple: #f0e8fc;
    --text: #3d3935; --text-soft: #6b635c; --text-light: #9a8e82;
    --pink: #ff7a9c; --pink-dark: #e85a7f; --blue: #5ba3e0; --blue-dark: #3a7fb8;
    --green: #6fbf73; --green-dark: #4a9e4f; --yellow: #f5c842; --yellow-dark: #d4a820;
    --purple: #a78bd6; --purple-dark: #7a5fb3; --orange: #ff9966;
    --shadow: 0 2px 0 rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'M PLUS Rounded 1c', 'Quicksand', sans-serif; background: var(--bg);
    color: var(--text); line-height: 1.7; font-size: 16px; }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.5rem; font-weight: 800; text-align: center; margin: 8px 0 4px; }
  .sub { text-align: center; color: var(--text-soft); font-size: 0.9rem; margin-bottom: 18px; }

  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
  .tab { border: 2px solid transparent; background: var(--card); border-radius: 14px; padding: 10px 4px;
    font: inherit; font-weight: 700; font-size: 0.9rem; color: var(--text-soft); cursor: pointer;
    box-shadow: var(--shadow); transition: all .15s; }
  .tab .n { display: block; font-size: 0.72rem; font-weight: 500; color: var(--text-light); }
  .tab.on[data-cat=reading]   { border-color: var(--blue);   background: var(--bg-blue); color: var(--blue-dark); }
  .tab.on[data-cat=listening] { border-color: var(--green);  background: var(--bg-green); color: var(--green-dark); }
  .tab.on[data-cat=writing]   { border-color: var(--pink);   background: var(--bg-pink); color: var(--pink-dark); }
  .tab.on[data-cat=speaking]  { border-color: var(--purple); background: var(--bg-purple); color: var(--purple-dark); }

  .card { background: var(--card); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 4px; }
  .card h3 { font-size: 1rem; font-weight: 800; margin: 14px 0 8px; }
  .meta { color: var(--text-light); font-size: 0.82rem; }
  .empty { text-align: center; color: var(--text-soft); padding: 40px 16px; }
  .empty .big { font-size: 2.4rem; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .stat { background: var(--soft); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-family: 'Quicksand', sans-serif; font-size: 1.5rem; }
  .stat span { font-size: 0.75rem; color: var(--text-soft); }

  .bar { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 0.85rem; }
  .bar .lbl { width: 9.5em; flex-shrink: 0; }
  .bar .track { flex: 1; height: 14px; background: #f1ece6; border-radius: 99px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 99px; }
  .bar .num { width: 3em; text-align: right; font-weight: 700; }

  .tip { background: var(--bg-yellow); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; margin-top: 10px; }
  .tip ol { padding-left: 1.3em; }
  .tip li { margin: 3px 0; }
  code, .w { font-family: 'Quicksand', sans-serif; font-weight: 700; }

  details { margin-top: 10px; }
  summary { cursor: pointer; font-weight: 700; color: var(--blue-dark); font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
  td, th { padding: 6px 6px; border-bottom: 1px solid #f0e9e1; text-align: left; vertical-align: top; }
  th { color: var(--text-soft); font-weight: 700; }
  .x { color: var(--pink-dark); text-decoration: line-through; }
  .o { color: var(--green-dark); font-weight: 700; }

  .btn { font: inherit; font-weight: 800; border: none; border-radius: 999px; padding: 10px 22px; cursor: pointer;
    background: var(--blue); color: #fff; box-shadow: 0 3px 0 var(--blue-dark); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--blue-dark); }
  .btn.alt { background: var(--card); color: var(--blue-dark); box-shadow: 0 3px 0 #cfe0ee; border: 2px solid var(--blue); }
  .btn.pink { background: var(--pink); box-shadow: 0 3px 0 var(--pink-dark); }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

  /* quiz */
  .qhead { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-soft); }
  .prog { height: 8px; background: #f1ece6; border-radius: 99px; overflow: hidden; margin: 6px 0 16px; }
  .prog div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--purple)); transition: width .3s; }
  .tag { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; }
  .tag.form { background: var(--bg-purple); color: var(--purple-dark); }
  .tag.mean { background: var(--bg-pink); color: var(--pink-dark); }
  .tag.adv { background: #eceff3; color: #5a6470; }
  .stat.must { background: var(--bg-blue); }
  .stat span { line-height: 1.4; }
  .tag.blank { background: var(--bg-yellow); color: var(--yellow-dark); }
  .sentence { font-family: 'Quicksand', sans-serif; font-size: 1.2rem; font-weight: 600; line-height: 2.3; margin: 12px 0 6px; }
  .word { white-space: nowrap; }
  .word .stem { color: var(--blue-dark); font-weight: 700; }
  .lt { width: 1.35em; height: 1.7em; text-align: center; font: inherit; font-weight: 700; font-size: 1.1rem;
    border: none; border-bottom: 2.5px solid var(--blue); background: var(--bg-blue); border-radius: 4px 4px 0 0;
    margin: 0 1px; color: var(--text); padding: 0; }
  .lt:focus { outline: 2px solid var(--purple); }
  .lt.ok { border-color: var(--green-dark); background: var(--bg-green); }
  .lt.ng { border-color: var(--pink-dark); background: var(--bg-pink); }
  .hint { font-size: 0.85rem; color: var(--text-soft); }
  .fb { margin-top: 14px; border-radius: 14px; padding: 14px; font-size: 0.92rem; }
  .fb.good { background: var(--bg-green); }
  .fb.bad { background: var(--bg-pink); }
  .fb .ttl { font-weight: 800; font-size: 1rem; margin-bottom: 4px; }
  .col { padding-left: 1.2em; }
  .sumhead { background: var(--bg-blue); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .sumlist { padding-left: 1.6em; }
  .sumlist li { padding: 6px 0; border-bottom: 1px dashed #efe7de; }
  .sumlist .sentence { display: inline; font-size: 1.05rem; margin: 0; line-height: 2.2; }
  .sumfb { font-size: 0.88rem; }
  .fb .orig { margin-top: 8px; font-size: 0.88rem; color: var(--text); border-top: 1px dashed rgba(0,0,0,0.12); padding-top: 8px; }
  .result { text-align: center; }
  .result .score { font-family: 'Quicksand', sans-serif; font-size: 3rem; font-weight: 700; color: var(--blue-dark); }
  .wronglist { text-align: left; margin-top: 10px; font-size: 0.9rem; }

  /* speaking / generic FB */
  .fbsec { border-left: 4px solid var(--purple); padding: 4px 0 4px 12px; margin: 12px 0; }
  .fbsec.good { border-color: var(--green); }
  .fbsec.bad { border-color: var(--pink); }
  .fbsec ul { padding-left: 1.2em; }
  .steps { counter-reset: s; list-style: none; }
  .steps li { position: relative; padding: 8px 10px 8px 40px; margin: 6px 0; background: var(--bg-purple); border-radius: 10px; }
  .steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 10px; top: 8px;
    width: 22px; height: 22px; border-radius: 50%; background: var(--purple); color: #fff; text-align: center;
    font-size: 0.8rem; line-height: 22px; font-weight: 800; }
  .steps.sp li { background: #faf8f5; border-left: 4px solid var(--c); }
  .steps.sp li::before { background: var(--c); }
  .chks { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .chk { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
  .score-Limited { color: var(--pink-dark); font-size: 0.9rem; }
  .score-Developing { color: var(--yellow-dark); font-size: 0.9rem; }
  .seg { border-bottom: 3px solid var(--c); }
  .segl { display: inline-block; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 0.68rem; font-weight: 800;
    color: #fff; background: var(--c); border-radius: 6px; padding: 0 6px; margin-right: 4px; vertical-align: 2px; }
  .model { background: #faf7ff; border: 2px dashed var(--purple); border-radius: 12px; padding: 12px 14px;
    font-family: 'Quicksand', sans-serif; font-weight: 600; line-height: 1.8; }

  @media (max-width: 520px) {
    .tab { font-size: 0.78rem; }
    .sentence { font-size: 1.05rem; }
    .bar .lbl { width: 7.5em; font-size: 0.78rem; }
  }
</style>
</head>

<div class="container">
  <h1>📝 TOEFL 問題集 復習</h1>
  <p class="sub">解いた問題の「まちがえたところ」だけを、もう一度。</p>
  <div class="tabs" id="tabs"></div>

<script>
/* =====================================================================
   データ：問題集の記録。新しい回はそれぞれの配列の「先頭」に追加する。
   ===================================================================== */
const DATA = {
  reading: [
    {
      id: "r-2026-10-03",
      date: "2026-10-03",
      title: "Complete the Words（単語の穴うめ）5セット",
      correct: 29, total: 50,
      /* TOEFL 5.5（C1）を超える語＝落としてもよい問題。breakdown はそれ以外（C1で解くべき問題）のまちがいだけを数える */
      beyond: ["exacerbate", "Unsaturated", "cholesterol", "inflammation", "clippings"],
      breakdown: [
        { key: "form",  label: "品詞・語尾のミス",   n: 4,  color: "var(--purple)" },
        { key: "mean",  label: "ちがう単語を入れた", n: 3,  color: "var(--pink)" },
        { key: "blank", label: "わからず適当に埋めた", n: 9,  color: "var(--yellow)" }
      ],
      advice: [
        "<b>C1で解くべき問題のまちがいの半分以上（16個中9個）が「同じ文字の連打・でたらめ」</b>。投資のセットは2/10でした。ここを減らすのが一番の近道です。",
        "<b>知らない単語でも、文字数で語尾は当てられる。</b> 2文字 → <code>-ic / -al</code>、4文字 → <code>-tion / -ance / -ting</code>、5文字 → <code>-ation</code>、6文字 → <code>-mental</code>。今回の expecta<b>tion</b>, genera<b>ting</b>, fin<b>ance</b>, inflamm<b>ation</b>, organ<b>ic</b>, funda<b>mental</b> はこれで取れた問題です。",
        "<b>似た単語に引っぱられない。</b> advocates → <span class='x'>advocados</span>（アボカド）、landfills → <span class='x'>landscape</span>（景色）。入れたあと、文の意味が通るか確かめる。",
        "<b>学問の名前は -ics。</b> finance and econom<b>ics</b>（経済学）。<span class='x'>economies</span> は「国の経済」の複数形。"
      ],
      passages: [
        { theme: "投資の基本",         score: 2, miss: [["resources","resourses"],["money","motiv"],["expectation","expectarrrr"],["generating","generalluy"],["profit","proiee"],["fundamental","fundauuuuuu"],["finance","finuuuu"],["economics","economies"]] },
        { theme: "男女平等と経済",     score: 8, miss: [["advocates","advocados"],["workforce","workiiiii"]] },
        { theme: "消費主義と格差",     score: 8, miss: [["exacerbate","exacerrrrr"],["individuals","individusls"]] },
        { theme: "体に良い脂質",       score: 6, miss: [["Unsaturated","Unsatncuary"],["health","hetttt"],["cholesterol","cholestttttt"],["inflammation","inflammingos"]] },
        { theme: "コンポスト（堆肥）", score: 5, miss: [["practical","practices"],["organic","organii"],["clippings","clipperes"],["fertilizer","fertilesss"],["landfills","landscape"]] }
      ],
      /* まちがえた21個から、TOEFL で出やすい15語を厳選（health, money などの基本語・専門的すぎる語は除外） */
      quiz: [
        { id:"resources", type:"form", before:"Many countries do not have enough natural ", stem:"resour", ans:"ces", after:" such as water and oil.",
          ja:"resource = 資源・財源", yours:"resourses",
          pt:"つづりは <b>-ces</b>。source（源）と同じく -ce で終わる。",
          use:"経済・環境・お金",
          colloc:[["natural resources","天然資源"],["allocate resources","資源を配分する"],["limited resources","限られた資源"]],
          family:[["resource","名","資源"],["resourceful","形","工夫に富んだ"],["source","名","源 ※別の単語"]] },
        { id:"expectation", type:"blank", before:"She studied hard with the ", stem:"expecta", ans:"tion", after:" of passing the exam.",
          ja:"expectation = 期待・見込み", yours:"expectarrrr",
          pt:"with the ___ of の間＝名詞。<b>4文字なら -tion</b> を疑う。",
          use:"お金・研究・社会",
          colloc:[["with the expectation of ～","～を見込んで"],["meet expectations","期待に応える"],["high expectations","高い期待"]],
          family:[["expect","動","期待する"],["expectation","名","期待"],["expected","形","予想された"]] },
        { id:"generating", type:"blank", before:"Solar panels are a clean way of ", stem:"genera", ans:"ting", after:" electricity.",
          ja:"generate = 生み出す・発生させる", yours:"generalluy",
          pt:"of の後ろ＝<b>-ing 形</b>。genera のあと4文字 → -ting。",
          use:"エネルギー・お金・テクノロジー",
          colloc:[["generate income","収入を生む"],["generate electricity","電気を作る"],["generate interest","関心を集める"]],
          family:[["generate","動","生み出す"],["generation","名","発生・世代"],["generator","名","発電機"]] },
        { id:"profit", type:"blank", before:"The small bakery made a large ", stem:"pro", ans:"fit", after:" last year.",
          ja:"profit = 利益・もうけ", yours:"proiee",
          pt:"a large ___＝名詞。本番は income or ___ と「お金」が並んでいた → profit。",
          use:"お金・ビジネス・経済",
          colloc:[["make a profit","利益を出す"],["income or profit","収入や利益"],["a non-profit organization","非営利団体"]],
          family:[["profit","名","利益"],["profitable","形","もうかる"],["profitability","名","収益性"]] },
        { id:"fundamental", type:"blank", before:"Freedom of speech is a ", stem:"funda", ans:"mental", after:" right in many countries.",
          ja:"fundamental = 基本的な・根本的な", yours:"fundauuuuuu",
          pt:"名詞の前＝形容詞。funda のあと6文字 → <b>-mental</b>。",
          use:"経済・科学・社会",
          colloc:[["a fundamental concept","基本的な概念"],["fundamental rights","基本的人権"],["a fundamental change","根本的な変化"]],
          family:[["fundamental","形","基本的な"],["fundamentally","副","根本的に"],["fundamentals","名","基礎・基本"]] },
        { id:"finance", type:"blank", before:"She wants to study ", stem:"fin", ans:"ance", after:" and work at a bank in the future.",
          ja:"finance = 金融・財務", yours:"finuuuu",
          pt:"<b>finance and economics</b>（金融と経済学）は名詞のペア。<b>-ance</b> は名詞の語尾。",
          use:"お金・経済",
          colloc:[["finance and economics","金融と経済学"],["personal finance","個人のお金の管理"],["finance a project","事業に資金を出す"]],
          family:[["finance","名・動","金融／資金を出す"],["financial","形","お金の・金融の"],["financially","副","経済的に"]] },
        { id:"economics", type:"form", before:"My brother is studying ", stem:"econ", ans:"omics", after:" to learn how markets work.",
          ja:"economics = 経済学", yours:"economies",
          pt:"学問の名前は <b>-ics</b>（economics, physics）。economies は「国の経済」の複数形。",
          use:"経済・教育",
          colloc:[["study economics","経済学を学ぶ"],["finance and economics","金融と経済学"],["the global economy","世界経済"]],
          family:[["economy","名","経済"],["economics","名","経済学"],["economic","形","経済の"],["economical","形","節約になる"]] },
        { id:"advocates", type:"mean", before:"Environmental ", stem:"advoc", ans:"ates", after:" are calling for stronger laws to protect forests.",
          ja:"advocate = 支持者・主張する人", yours:"advocados",
          pt:"argue（主張する）の主語＝<b>人</b>。avocado（アボカド）とまちがえない。",
          use:"社会問題・政策",
          colloc:[["advocates argue that ～","支持者は～と主張する"],["advocate for ～","～を強く支持する"],["an advocate of ～","～の支持者"]],
          family:[["advocate","名・動","支持者／主張する"],["advocacy","名","支持・擁護"]] },
        { id:"workforce", type:"blank", before:"Women make up almost half of the country's ", stem:"work", ans:"force", after:".",
          ja:"workforce = 労働力・働く人たち", yours:"workiiiii",
          pt:"participate in the ___＝名詞。work のあと5文字 → workforce。",
          use:"社会・経済・男女平等",
          colloc:[["join the workforce","働き始める"],["workforce participation","労働参加"],["a skilled workforce","熟練した労働力"]],
          family:[["work","動・名","働く／仕事"],["worker","名","労働者"],["workforce","名","労働力"]] },
        { id:"exacerbate", type:"blank", before:"Cutting down forests can ", stem:"exacer", ans:"bate", after:" the effects of climate change.",
          ja:"exacerbate = 悪化させる", yours:"exacerrrrr",
          pt:"can の後＝動詞。<b>make worse</b> と同じ意味の難単語。TOEFL頻出。",
          use:"社会問題・環境・医学",
          colloc:[["exacerbate inequality","格差を悪化させる"],["exacerbate the problem","問題を悪化させる"],["exacerbate symptoms","症状を悪化させる"]],
          family:[["exacerbate","動","悪化させる"],["exacerbation","名","悪化"]] },
        { id:"inflammation", type:"form", before:"Ice can help reduce pain and ", stem:"inflamm", ans:"ation", after:" after an injury.",
          ja:"inflammation = 炎症", yours:"inflammingos",
          pt:"reduce A and B：cholesterol と並ぶ名詞。<b>5文字なら -ation</b>。",
          use:"健康・医学・生物",
          colloc:[["reduce inflammation","炎症を抑える"],["chronic inflammation","慢性の炎症"],["cause inflammation","炎症を起こす"]],
          family:[["inflame","動","炎症を起こす"],["inflammation","名","炎症"],["inflammatory","形","炎症性の"]] },
        { id:"practical", type:"form", before:"Riding a bike is a ", stem:"pract", ans:"ical", after:" way to get around the city.",
          ja:"practical = 実用的な・現実的な", yours:"practices",
          pt:"a ___ way＝名詞の前→形容詞。<b>-ical</b>（critical と同じ形）。",
          use:"生活・環境・教育",
          colloc:[["a practical way to ～","～する実用的な方法"],["practical skills","実用的なスキル"],["practical advice","役に立つアドバイス"]],
          family:[["practice","名・動","練習（する）・習慣"],["practical","形","実用的な"],["practically","副","実際に・ほとんど"]] },
        { id:"organic", type:"blank", before:"This farm grows ", stem:"organ", ans:"ic", after:" vegetables without chemicals.",
          ja:"organic = 有機の・生物由来の", yours:"organii",
          pt:"名詞の前＝形容詞。<b>2文字なら -ic / -al</b>。",
          use:"環境・農業・食べ物",

const CATS = [
  { key: "reading",   label: "📖 Reading" },
  { key: "listening", label: "🎧 Listening" },
  { key: "writing",   label: "✍️ Writing" },
  { key: "speaking",  label: "🗣 Speaking" }
];

/* ---------- 保存（ブラウザ内のみ。使えなくても動く） ---------- */
const STORE_KEY = "rihoToeflReview";
function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { return {}; } }
function saveStore(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }
let store = loadStore();
function getTab() { try { return localStorage.getItem(STORE_KEY + ":tab") || "reading"; } catch (e) { return "reading"; } }
function setTab(t) { try { localStorage.setItem(STORE_KEY + ":tab", t); } catch (e) {} }

const $ = (s, r = document) => r.querySelector(s);
const TAG = { form: ["form", "品詞・語尾"], mean: ["mean", "単語の意味"], blank: ["blank", "空欄だった"] };

/* ---------- タブ ---------- */
let current = getTab();
function renderTabs() {
  $("#tabs").innerHTML = CATS.map(c =>
    `<button class="tab${c.key === current ? " on" : ""}" data-cat="${c.key}">${c.label}<span class="n">${DATA[c.key].length}回分</span></button>`
  ).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { current = b.dataset.cat; setTab(current); render(); });
}
function render() {
  renderTabs();
  const list = DATA[current];
  if (!list.length) {
    $("#main").innerHTML = `<div class="card empty"><div class="big">🗂️</div>
      <p>まだ記録がありません。<br>問題集を解いたら、結果とフィードバックがここに追加されます。</p></div>`;
    return;
  }
  if (current === "speaking") {
    // 同じ日の分は解いた順（id の番号順）に並べる
    const sorted = list.slice().sort((a, b) => b.date.localeCompare(a.date) || a.id.localeCompare(b.id, undefined, { numeric: true }));
    $("#main").innerHTML = speakingOverview(list) + sorted.map(speakingCard).join("");
    return;
  }
  $("#main").innerHTML = list.map(e => ({ reading: readingCard, listening: genericCard, writing: genericCard })[current](e)).join("");
  if (current === "reading") list.forEach(e => bindReading(e));
}

/* ---------- Reading ---------- */
// C1（TOEFL 5.5）で解くべき問題と、C1超えで落としてもよい問題に分けて数える
function splitScore(e) {
  const beyond = new Set((e.beyond || []).map(w => w.toLowerCase()));
  const missed = new Set(e.passages.flatMap(p => p.miss.map(([c]) => c.toLowerCase())));
  const bTotal = beyond.size;
  const bRight = [...beyond].filter(w => !missed.has(w)).length;
  return { mustTotal: e.total - bTotal, mustRight: e.correct - bRight, bTotal, bRight, beyond };
}

function readingCard(e) {
  const s = splitScore(e);
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const mustMiss = s.mustTotal - s.mustRight;
  const bars = e.breakdown.map(b =>
    `<div class="bar"><span class="lbl">${b.label}</span><span class="track"><span class="fill" style="display:block;width:${pct(b.n, mustMiss)}%;background:${b.color}"></span></span><span class="num">${pct(b.n, mustMiss)}%</span></div>`).join("");
  const rows = e.passages.map(p =>
    `<tr><td>${p.theme}</td><td>${p.score}/10</td><td>${p.miss.map(([c, y]) => `<span class="x">${y}</span> → <span class="o">${c}</span>${s.beyond.has(c.toLowerCase()) ? ' <span class="tag adv">C1超え</span>' : ""}`).join("<br>")}</td></tr>`).join("");
  return `<div class="card" id="card-${e.id}">
    <h2>${e.title}</h2>
    <div class="meta">${e.date}　・　全体 ${e.correct}/${e.total}（${pct(e.correct, e.total)}%）</div>
    <div class="stats">
      <div class="stat must"><b>${pct(s.mustRight, s.mustTotal)}%</b><span>C1で解くべき問題<br>${s.mustRight}/${s.mustTotal}</span></div>
      <div class="stat"><b>${pct(s.bRight, s.bTotal)}%</b><span>C1超え（落としてOK）<br>${s.bRight}/${s.bTotal}</span></div>
      <div class="stat" id="best-${e.id}">${bestStat(e)}</div>
    </div>
    <h3>C1で解くべき問題のまちがい（${mustMiss}個）の内訳</h3>
    ${bars}
    <p class="hint" style="margin-top:6px">落としてOK（TOEFL 5.5＝C1 を超える語）：${[...e.beyond].map(w => `<span class="w">${w}</span>`).join(", ")}</p>
    <div class="tip"><ol>${e.advice.map(a => `<li>${a}</li>`).join("")}</ol></div>
    <details><summary>セットごとの答え合わせを見る</summary>
      <table><tr><th>テーマ</th><th>点</th><th>あなた → 正解</th></tr>${rows}</table>
    </details>
    <h3>🎯 復習問題（厳選 ${e.quiz.length} 問）</h3>
    <p class="hint">まちがえた単語から、TOEFL でよく出る単語だけを選びました。本番とはちがう新しい文で、同じ単語を穴うめします。</p>
    <div class="quiz" id="quiz-${e.id}"></div>
  </div>`;
}

// 復習（全問）と Summary のうち良いほうの点。まだ解いていなければ問題数を見せる
function bestStat(e) {
  const rec = store[e.id] || {};
  const scores = [rec.best, rec.summaryBest].filter(v => v != null);
  const n = e.quiz.length;
  return scores.length
    ? `<b>${Math.max(...scores)}/${n}</b><span>復習ベスト</span>`
    : `<b>${n}問</b><span>復習問題（まだ挑戦していません）</span>`;
}
function refreshBest(e) { const el = $("#best-" + e.id); if (el) el.innerHTML = bestStat(e); }

function bindReading(e) {
  const box = $("#quiz-" + e.id);
  const rec = store[e.id] || {};
  const startBtns = [`<button class="btn" data-go="all">全部とく（${e.quiz.length}問）</button>`];
  if (rec.lastWrong && rec.lastWrong.length) startBtns.push(`<button class="btn pink" data-go="wrong">前回まちがえた ${rec.lastWrong.length} 問だけ</button>`);
  if (rec.attempts) startBtns.push(`<button class="btn alt" data-sum="1">📋 Summary テスト${rec.summaryBest != null ? `（ベスト ${rec.summaryBest}/${e.quiz.length}）` : ""}</button>`);
  box.innerHTML = `<div class="btns">${startBtns.join("")}</div>`;
  const sb = box.querySelector("[data-sum]"); if (sb) sb.onclick = () => runSummary(e, box);
  box.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const items = b.dataset.go === "wrong" ? e.quiz.filter(q => rec.lastWrong.includes(q.id)) : e.quiz.slice();
    runQuiz(e, box, shuffle(items), b.dataset.go === "all");
  });
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const letterBoxes = n => Array.from({ length: n }, () =>
  `<input class="lt" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`).join("");

// 1マス1文字の入力。ins は並んだマス全部（Summary では全問ぶん続けて移動できる）
function bindLetters(ins, onEnter) {
  ins.forEach((inp, k) => {
    inp.addEventListener("input", () => {
      // 速く打つ・貼りつけたときは、あふれた文字を次のマスへ
      const chars = inp.value.replace(/[^a-zA-Z]/g, "").toLowerCase().split("");
      let j = k;
      if (!chars.length) inp.value = "";
      chars.forEach(c => { if (ins[j]) ins[j++].value = c; });
      if (chars.length) (ins[j] || ins[ins.length - 1]).focus();
    });
    inp.addEventListener("keydown", ev => {
      if (ev.key === "Backspace" && !inp.value && ins[k - 1]) { ins[k - 1].focus(); ins[k - 1].value = ""; ev.preventDefault(); }
      if (ev.key === "ArrowLeft" && ins[k - 1]) ins[k - 1].focus();
      if (ev.key === "ArrowRight" && ins[k + 1]) ins[k + 1].focus();
      if (ev.key === "Enter") { ev.preventDefault(); if (onEnter) onEnter(); }
    });
  });
}

/* ---------- Summary：全問を1ページでまとめて解き、最後に一括採点 ---------- */
function runSummary(e, box) {
  const items = shuffle(e.quiz.slice());
  box.innerHTML = `
    <div class="sumhead"><b>📋 Summary テスト</b>（全 ${items.length} 問）<br><span class="hint">本番と同じように、ぜんぶ埋めてから最後に採点します。</span></div>
    <ol class="sumlist">${items.map(q => `<li data-id="${q.id}"><span class="sentence">${q.before}<span class="word"><span class="stem">${q.stem}</span>${letterBoxes(q.ans.length)}</span>${q.after}</span><div class="sumfb"></div></li>`).join("")}</ol>
    <div class="btns"><button class="btn" id="gradeBtn">採点する</button></div>`;
  const all = [...box.querySelectorAll(".lt")];
  bindLetters(all, null);
  all[0].focus();
  $("#gradeBtn", box).onclick = () => {
    let right = 0; const wrong = [];
    items.forEach(q => {
      const li = box.querySelector(`li[data-id="${q.id}"]`);
      const ins = [...li.querySelectorAll(".lt")];
      const typed = ins.map(x => x.value).join("");
      const ok = typed === q.ans;
      ins.forEach((x, k) => { x.readOnly = true; x.classList.add(x.value === q.ans[k] ? "ok" : "ng"); });
      if (ok) right++; else wrong.push(q);
      li.querySelector(".sumfb").innerHTML = ok ? `<span class="o">⭕</span>`
        : `<span class="x">❌</span> 正解 <span class="w o">${q.stem}${q.ans}</span>　<span class="hint">${q.pt}</span>`;
    });
    const rec = store[e.id] || {};
    rec.summaryBest = Math.max(rec.summaryBest || 0, right);
    rec.lastWrong = wrong.map(q => q.id);
    store[e.id] = rec; saveStore(store);
    refreshBest(e);
    const head = box.querySelector(".sumhead");
    head.innerHTML = `<div class="result"><div class="score">${right} / ${items.length}</div>
      <p>${wrong.length ? `まちがえた ${wrong.length} 問は下に ❌ と正解が出ています。` : "全問正解！🎉 この回の単語はマスターしました。"}</p></div>`;
    box.querySelector(".btns").innerHTML = `${wrong.length ? `<button class="btn pink" id="againWrong">まちがえた ${wrong.length} 問を復習</button>` : ""}<button class="btn" id="sumAgain">Summary をもう一度</button><button class="btn alt" id="backBtn">もどる</button>`;
    const aw = $("#againWrong", box); if (aw) aw.onclick = () => runQuiz(e, box, shuffle(wrong), false);
    $("#sumAgain", box).onclick = () => runSummary(e, box);
    $("#backBtn", box).onclick = () => render();
    head.scrollIntoView({ behavior: "smooth", block: "start" });
  };
}

function runQuiz(e, box, items, full) {
  let i = 0, right = 0; const wrong = [];
  const show = () => {
    const q = items[i];
    const [tcls, tlabel] = TAG[q.type];
    const boxes = letterBoxes(q.ans.length);
    box.innerHTML = `
      <div class="qhead"><span>${i + 1} / ${items.length}</span><span>${(e.beyond || []).some(w => w.toLowerCase() === (q.stem + q.ans).toLowerCase()) ? `<span class="tag adv">発展（C1超え）</span> ` : ""}<span class="tag ${tcls}">${tlabel}</span></span></div>
      <div class="prog"><div style="width:${i / items.length * 100}%"></div></div>
      <div class="sentence">${q.before}<span class="word"><span class="stem">${q.stem}</span>${boxes}</span>${q.after}</div>
      <p class="hint">空欄は ${q.ans.length} 文字。1マスに1文字ずつ入れてね。</p>
      <div id="fbArea"></div>
      <div class="btns"><button class="btn" id="checkBtn">こたえあわせ</button></div>`;
    const ins = [...box.querySelectorAll(".lt")];
    bindLetters(ins, () => { const c = $("#checkBtn", box); if (c) c.click(); });
    ins[0].focus();
    $("#checkBtn", box).onclick = () => {
      const typed = ins.map(x => x.value).join("");
      const ok = typed === q.ans;
      ins.forEach((x, k) => { x.readOnly = true; x.classList.add(x.value === q.ans[k] ? "ok" : "ng"); });
      if (ok) right++; else wrong.push(q.id);
      $("#fbArea", box).innerHTML = `<div class="fb ${ok ? "good" : "bad"}">
        <div class="ttl">${ok ? "⭕ 正解！" : "❌ ざんねん"}　${q.ja}</div>
        <div>あなたの答え：<span class="x">${q.yours}</span>（本番）${ok ? "" : `／<span class="x">${q.stem}${typed || "（空欄）"}</span>（今回）`}</div>
        <div>💡 ${q.pt}</div>
        <div>🌱 ${q.family.filter(([, , m]) => !m.includes("※")).map(([w, p]) => `<span class="w">${w}</span>(${p[0]})`).join(" / ")}</div>
        <div class="orig"><b>🔗 よく使う形</b>（${q.use}の文章で頻出）
          <ul class="col">${q.colloc.map(([en, j]) => `<li><span class="w">${en}</span>　${j}</li>`).join("")}</ul></div></div>`;
      const btns = box.querySelector(".btns");
      btns.innerHTML = `<button class="btn" id="nextBtn">${i + 1 < items.length ? "つぎへ →" : "結果を見る"}</button>`;
      const nb = $("#nextBtn", box); setTimeout(() => nb.focus(), 250);
      nb.onclick = () => { i++; i < items.length ? show() : finish(); };
    };
  };
  const finish = () => {
    const rec = store[e.id] || {};
    rec.lastWrong = wrong.slice();
    if (full) rec.best = Math.max(rec.best || 0, right);
    rec.attempts = (rec.attempts || 0) + 1;
    store[e.id] = rec; saveStore(store);
    const wq = items.filter(q => wrong.includes(q.id));
    box.innerHTML = `<div class="result">
      <div class="score">${right} / ${items.length}</div>
      <p>${wrong.length ? "まちがえた単語は、次は「前回まちがえた問題だけ」で練習できます。" : "全問正解！🎉 この回の単語はバッチリです。"}</p>
      ${wq.length ? `<div class="wronglist"><b>もう一度おぼえる：</b><ul style="padding-left:1.2em">${wq.map(q => `<li>${q.ja.replace(/^(\S+)/, '<span class="w">$1</span>')}</li>`).join("")}</ul></div>` : ""}
      <div class="tip" style="margin-top:14px">📋 最後に <b>Summary テスト</b>：全 ${e.quiz.length} 問を1ページでまとめて解いて、ちゃんと覚えたか確認しよう。</div>
      <div class="btns"><button class="btn" id="sumBtn">📋 Summary テストへ</button>${wq.length ? `<button class="btn pink" id="againWrong">まちがえた ${wq.length} 問をもう一度</button>` : ""}<button class="btn alt" id="backBtn">もどる</button></div></div>`;
    $("#sumBtn", box).onclick = () => runSummary(e, box);
    const aw = $("#againWrong", box); if (aw) aw.onclick = () => runQuiz(e, box, shuffle(wq), false);
    $("#backBtn", box).onclick = () => render();
    refreshBest(e);
  };
  show();
}

/* ---------- Listening / Writing（結果＋FB） ---------- */
function list(items) { return items && items.length ? `<ul>${items.map(x => `<li>${x}</li>`).join("")}</ul>` : ""; }
function genericCard(e) {
  return `<div class="card"><h2>${e.title}</h2><div class="meta">${e.date}${e.score ? "　・　" + e.score : ""}</div>
    ${e.summary ? `<p style="margin-top:8px">${e.summary}</p>` : ""}
    ${e.good && e.good.length ? `<div class="fbsec good"><b>👍 よかったところ</b>${list(e.good)}</div>` : ""}
    ${e.issues && e.issues.length ? `<div class="fbsec bad"><b>🔧 直すところ</b>${list(e.issues)}</div>` : ""}
    ${e.tips && e.tips.length ? `<div class="tip"><ol>${e.tips.map(t => `<li>${t}</li>`).join("")}</ol></div>` : ""}</div>`;
}

/* ---------- Speaking（FB＋構成＋お手本） ---------- */
const STEPS = [
  { name: "意見",       en: "Opinion",      color: "#5ba3e0", sec: "5秒",  say: "I believe ～ / In my opinion, ～ / If I could ～, I would ～", tip: "質問の言葉を使って、<b>1文目で答えを言い切る</b>。" },
  { name: "理由",       en: "Reason",       color: "#6fbf73", sec: "8秒",  say: "The main reason is that ～ / This is because ～", tip: "「なぜそう思うか」を1〜2文で。" },
  { name: "具体例",     en: "Example",      color: "#ff9966", sec: "15秒", say: "For example, ～ / For instance, ～ / Last year, I ～", tip: "<b>いつ・どこで・何が起きたか</b>。自分の体験でOK。作った話でも減点されない。" },
  { name: "大切な理由", en: "Significance", color: "#a78bd6", sec: "10秒", say: "This is important because ～ / This matters because ～", tip: "その例から<b>何が良くなるのか</b>（健康・安心・将来・成長）まで言う。" },
  { name: "反対意見",   en: "Contrast",     color: "#ff7a9c", sec: "7秒",  say: "Some people might say ～, but I think ～ / On the other hand, ～", tip: "反対の考えに一言ふれて、<b>自分の意見にもどって終わる</b>。" }
];
const CHECK = { o: ["✓", "var(--bg-green)", "var(--green-dark)"], t: ["△", "var(--bg-yellow)", "var(--yellow-dark)"],
                x: ["✗", "var(--bg-pink)", "var(--pink-dark)"], "-": ["–", "#f3efea", "var(--text-light)"] };

function speakingOverview(list) {
  const n = list.length;
  const scores = {};
  list.forEach(e => scores[e.score] = (scores[e.score] || 0) + 1);
  const miss = STEPS.map((s, k) => list.filter(e => e.check[k] === "x" || e.check[k] === "t").length);
  const bars = STEPS.map((s, k) =>
    `<div class="bar"><span class="lbl">${s.name}が弱い</span><span class="track"><span class="fill" style="display:block;width:${miss[k] / n * 100}%;background:${s.color}"></span></span><span class="num">${Math.round(miss[k] / n * 100)}%</span></div>`).join("");
  return `<div class="card">
    <h2>🗣 Speaking まとめ（${n}問）</h2>
    <div class="meta">${Object.entries(scores).map(([k, v]) => `${k} ×${v}`).join("　・　")}</div>
    <div class="tip" style="margin-top:12px"><b>いちばん大事なこと：</b>意見と理由は言えています。点が伸びない原因は、<b>「具体例」と「なぜ大切か」が全${n}問でほぼ抜けている</b>こと。
      意見を言ったら、すぐ <b>For example</b> で自分の体験を話し、<b>This is important because</b> でしめる。これだけで話の長さも中身も2倍になります。</div>
    <h3>5つのステップ、どこが弱い？（FBで「足りない・もう少し」と言われた割合）</h3>
    ${bars}
    <h3>🧱 どの問題でも使える「話す順番」（45秒の目安）</h3>
    <ol class="steps sp">${STEPS.map(s => `<li style="--c:${s.color}"><b>${s.name}</b> <span class="meta">${s.en}・${s.sec}</span><br><span class="w">${s.say}</span><br><span class="hint">${s.tip}</span></li>`).join("")}</ol>
    <h3>🔁 同じ言葉をくり返さないために</h3>
    <p class="hint">「同じ言葉のくり返し」「分かりにくい文」は ${list.filter(e => e.fixes && e.fixes.length).length} 問で指摘されました。つなぎ言葉を1つ入れるだけで、話が整理されて聞こえます。</p>
    <table><tr><th>使う場面</th><th>つなぎ言葉</th></tr>
      <tr><td>理由を足す</td><td class="w">In addition, / Also, / Another reason is that</td></tr>
      <tr><td>例を出す</td><td class="w">For example, / For instance, / Last year, I</td></tr>
      <tr><td>反対のことを言う</td><td class="w">However, / On the other hand, / But</td></tr>
      <tr><td>しめる</td><td class="w">That's why ～ / So, overall, I think ～</td></tr></table>
  </div>`;
}

function speakingCard(e, idx) {
  const chips = STEPS.map((s, k) => { const [m, bg, fg] = CHECK[e.check[k]] || CHECK["-"];
    return `<span class="chk" style="background:${bg};color:${fg}">${m} ${s.name}</span>`; }).join("");
  const model = e.model.map(([k, t]) => `<span class="seg" style="--c:${STEPS[k].color}"><span class="segl">${STEPS[k].name}</span>${t}</span>`).join(" ");
  return `<div class="card"><h2>問題 ${idx + 1}　<span class="score-${e.score}">${e.score}</span></h2><div class="meta">${e.date}</div>
    <div class="tip" style="background:var(--bg-blue)"><b>質問（FBから推定）：</b><span class="w">${e.prompt}</span></div>
    <p style="margin-top:10px">${e.summary}</p>
    <div class="chks">${chips}</div>
    <div class="fbsec good"><b>👍 よかったところ</b>${list(e.good)}</div>
    <div class="fbsec bad"><b>🔧 直すところ</b>${list(e.issues)}</div>
    ${e.fixes && e.fixes.length ? `<h3>✏️ 言い直し</h3><table>${e.fixes.map(([a, b]) => `<tr><td class="x">${a}</td><td>→</td><td class="o">${b}</td></tr>`).join("")}</table>` : ""}
    <h3>🎤 こんなふうに話せたら良かった</h3>
    <div class="model">${model}</div>
    <details><summary>日本語訳を見る</summary><p style="margin-top:6px;font-size:0.9rem">${e.modelJa}</p></details></div>`;
}

render();
</script>
</body>
